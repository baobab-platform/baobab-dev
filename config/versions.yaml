# ==============================================================================
# BAOBAB Enterprise Platform
# Development Container Version Manifest
#
# File: config/versions.yaml
#
# Purpose
# -------
# Single source of truth for all software versions installed by the BAOBAB
# Development Container.
#
# Notes
# -----
# • This manifest declares desired versions; config/versions.lock pins resolved bytes.
# • Re-run config/resolve.sh and review all digest/install contract changes.
# • Keep security vendoring, native consumer pins and image readback consistent.
# • Node 26/pnpm 12/Java 21/Python 3.14.10 below are PR #57 candidates,
#   not authority to publish v1.5.0 or activate unqualified consumer upgrades.
# ==============================================================================

manifest:
  schema: "1.0"
  name: "BAOBAB Development Container"
  description: "Version manifest for the BAOBAB DevContainer"

platform:
  ubuntu:
    version: "26.04"

languages:

  python:
    version: "3.14.10"
    source: "python.org"

  node:
    major: "26"
    exact: "26.13.1"
    source: "nodesource"

  flutter:
    version: "latest"
    channel: "stable"
    source: "flutter"

  java:
    version: "21"
    source: "apt"
    # Temurin Java 21 is the shared developer default for both iDempiere v13
    # and baobab-subscriptions. iDempiere documents OpenJDK >=17; actual
    # v13 JVM/bundle and owner tests on Java 21 remain qualification gates.
    # Requires a full JDK (not JRE-only), via Eclipse Temurin's own apt repository —
    # NOT Ubuntu's distribution-selected OpenJDK package. Same reasoning already applied
    # to docker/postgresql below: an upstream-maintained apt repo keeps the
    # exact vendor/build consistent across Ubuntu base-image upgrades, rather
    # than whatever OpenJDK build Ubuntu's own archive happens to carry for a
    # given release. Adoptium publishes Temurin for both amd64 and arm64
    # through this same repository (confirmed via their own multi-arch
    # Docker images) — no per-arch checksum pair needed here, unlike the
    # GitHub-release binaries under utilities/security below.
    #
    # Needed for baobab-erp's iDempiere ERP engine (github.com/baobab-platform/
    # baobab-erp) — iDempiere's own docs (wiki.idempiere.org/en/
    # Install_Prerequisites, live-verified 2026-09-01) require a JDK
    # (explicitly not JRE-only — "openjdk-17-jre is not sufficient because
    # it doesn't have the jar command used in some scripts"), OpenJDK 17 or
    # later, LTS preferred. "21" here means major version only, resolved the
    # same way postgresql.major is below — apt's own dependency resolution
    # picks the exact point release, not this file.

database:

  postgresql:
    major: "17"
    source: "apt"

package_managers:

  uv:
    version: "latest"
    source: "github"

  poetry:
    version: "latest"
    source: "github"

  pnpm:
    version: "12.16.1"
    source: "github-release"
    # Publisher-release asset SHA-256 for the two official Linux glibc
    # binaries; install exact native PNPM, never an arbitrary Corepack shim.
    sha256_amd64: "565ff81174a14f6f7bd5d84c1b17e51031a80230d370a1fe24be5d16bd02a825"
    sha256_arm64: "f5847699e5d528f8f8e9bcfb385e58cb9fba7482af1b1aa7b70737be42277f81"
    # Security-sensitive native executable: all installed bytes are matched
    # against the official GitHub release digest for each architecture.
    # pnpm 12 treats package.json#packageManager as a configuration bootstrap
    # dependency. A COLD lockfile creation needs registry metadata; an offline
    # frozen install is qualified after metadata/archive is fetched and cached.
    # This image sets pnpm_config_pm_on_fail=error, never ignore/warn/download:
    # mismatched consumer pins fail rather than downloading a second pnpm.
    # The exact native binary and its per-architecture SHA-256 remain authoritative.
    # Keep consumers' packageManager pins equal to the candidate only when
    # they have passed independent BXS/Playwright/native-engine qualification.
    # Node 26's Corepack is a separate, pinned tool for Yarn compatibility.

  corepack:
    version: "0.36.0"
    source: "npm"
    # Node 26 does not bundle Corepack. Exact package + npm-registry integrity
    # is mandatory, before any noninteractive pnpm activation.

  npm:
    version: "latest"
    source: "npm"
    # The Node.js-bundled npm CLI itself, upgraded in-place in the Dockerfile
    # (`npm install -g npm@${NPM_VERSION}`) rather than left at whatever
    # version ships with the resolved Node major. Resolved once here, not
    # left floating to `npm install -g npm@latest` at build time — see the
    # Dockerfile CHANGE LOG entry dated 2026-08-28: floating `@latest`
    # in-Dockerfile failed on a bad upstream npm-registry publish, so both
    # npm and its bundled tar (below) are now resolved through this file
    # like every other tool, and fail the lockfile step instead of the
    # build step if the registry is broken.

  npm_bundled_tar:
    version: "latest"
    source: "npm"
    # NOT the system `tar` binary (apt-managed) — this is the `tar` npm
    # package bundled inside npm's own node_modules, upgraded in-place for
    # tar's own CVE fixes (see Dockerfile CHANGE LOG: CVE-2026-59873/
    # CVE-2026-73566). Floats to "latest" for the same CVE-freshness reason
    # npm itself does; resolved once here, not at Docker build time.

utilities:

  task:
    version: "latest"
    source: "github"

  ripgrep:
    version: "latest"
    source: "github"

  fd:
    version: "latest"
    source: "github"

  bat:
    version: "latest"
    source: "github"

  eza:
    version: "latest"
    source: "github"

  jq:
    version: "system"
    source: "apt"

  yq:
    version: "latest"
    source: "github"

  fzf:
    version: "system"
    source: "apt"

  tree:
    version: "system"
    source: "apt"

  unzip:
    version: "system"
    source: "apt"

  zip:
    version: "system"
    source: "apt"

  xz:
    version: "system"
    source: "apt"

development:

  docker:
    version: "latest"
    source: "docker"

  github_cli:
    # Security-qualified 2.102.1 carries Go 1.27.3 and x/net 0.60.0.
    # The newer 2.103.2 binary still embeds vulnerable Go 1.27.1/x/net.
    # Re-evaluate this temporary explicit pin after a scanned upstream fix.
    version: "2.102.1"
    source: "github"

  maven:
    version: "3.10.0"
    source: "apache"
    # DEV-10 R4 owner-directed stable Maven 3.10.x upgrade candidate.
    # Apache's release catalog and release history identify 3.10.0 as the
    # latest GA in this line (2026-11-03); Maven 4.0.0-rc-7 is NOT GA.
    # Pin the exact version rather than a mutable "latest" or "3.10.x".
    # Maven 3.10 uses Resolver 2.x: the Baobab ERP OSGi and Subscriptions
    # consumer tests, including Java 21 and PostgreSQL 17, are independent
    # acceptance gates. This source change is not a completed qualification.
    #
    # The official architecture-independent Apache distribution is fetched
    # from archive.apache.org so later supersession cannot break the build:
    #   https://archive.apache.org/dist/maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz
    # config/resolve.sh verifies the Apache-published .sha512 sidecar and
    # records the exact value in versions.lock; image builds check the tarball.
    # Do not infer Maven 4/Tycho or production iDempiere compatibility here.

# ------------------------------------------------------------------------------
# NEW — frontend_tooling
#
# Backs the `frontend` and `frontend-e2e` Dockerfile build targets (ADR-0001,
# baobab-platform/shared) and the `frontend` profile in the development-environment
# contract schema. Follows this file's own established convention: "latest",
# resolved to an exact version by resolve.sh into versions.lock at build
# time — NOT hardcoded here, for the same reason pnpm/uv/poetry above aren't.
#
# `stage` marks which Dockerfile target installs each tool, since (unlike
# every other domain in this file) not all of these belong in the same
# build stage:
#   frontend      -> Node/pnpm/Turborepo only, no browser binaries
#   frontend-e2e  -> extends frontend, adds Playwright's browser download +
#                    Sharp (native libvips binding) + Lighthouse (reuses
#                    Playwright's Chromium, per ADR-0001's brainstorm — no
#                    second browser install)
#
# Verified as real, currently-published packages at authoring time
# (2026-08-26): turbo 2.10.12, playwright 1.62.1, sharp 0.35.4,
# lighthouse 13.4.1. Not pinned to these numbers — see note above.
# ------------------------------------------------------------------------------

frontend_tooling:

  turbo:
    version: "latest"
    source: "npm"
    stage: "frontend"

  playwright:
    version: "1.64.1"
    source: "npm"
    stage: "frontend-e2e"
    note: >
      Explicit pin, NOT "latest" — unlike sharp/lighthouse/turbo above,
      which are ordinary CLI tools with no version coupling to a
      consumer's own dependencies. Playwright is different: the
      globally-installed `playwright` CLI in this image (which downloads
      browser binaries at build time via `npx playwright install`) and a
      consumer repo's own `@playwright/test` dependency (which drives
      test execution and looks up browser binaries by the EXACT revision
      its own version expects) must resolve to the same Playwright
      release, or the browser binaries this image downloaded for one
      revision are invisible to a test runner expecting a different one
      — observed for real: baobab-platform/zuribeans#60's CI failed with
      "Error: browserType.launch: Executable doesn't exist at
      /root/.cache/ms-playwright/chromium_headless_shell-1234/..." after
      "latest" drifted past zuribeans' own pinned
      "@playwright/test": "1.62.1" between this image's builds — the
      exact same class of drift versions.yaml's own pnpm pin was
      hardened against (see package_managers.pnpm above and
      docs/incidents/2026-09-18-codespaces-corepack-interactive-prompt.md).
      Keep this pin equal to whatever frontend-e2e consumers currently
      declare, the same way pnpm's pin is maintained.

  sharp:
    version: "latest"
    source: "npm"
    stage: "frontend-e2e"
    note: "Native libvips binding — verify arm64 prebuilt binary availability during hardening, not just amd64."

  lighthouse:
    version: "latest"
    source: "npm"
    stage: "frontend-e2e"
    note: "Reuses Playwright's Chromium — does not install a second browser."

security:

  cosign:
    version: "latest"
    source: "github"

# ------------------------------------------------------------------------------
# NEW — infra
#
# Backs the `infra` Dockerfile build target and the `infra` profile in the
# development-environment contract schema (baobab-platform/shared). Powers local
# development + testing for baobab-platform/infrastructure (Terraform-managed AWS
# infrastructure) — deliberately excludes Python/Node/Flutter/Java/Maven,
# none of which infrastructure-as-code needs. Branches off `base` directly
# in the Dockerfile, not `with-node` — see that stage's own comment.
# ------------------------------------------------------------------------------

infra:

  terraform:
    # Security patch on the approved 1.16.x line: Go 1.26.10 and x/net 0.60.0.
    # Official SHA256SUMS pins for both Linux architectures in versions.lock.
    version: "1.17.1"
    source: "hashicorp"
    # Explicit pin, NOT "latest" — same rationale as development.maven
    # above: infra tooling is exactly the class of dependency where a
    # silent version float carries real risk (a `terraform apply` running
    # against live AWS infrastructure with an unreviewed provider/engine
    # upgrade). 1.16.1 was HashiCorp's stable release at original authoring
    # time (2026-09-02/03); bumped to 1.16.2 (HashiCorp's release from
    # 2026-09-09) on 2026-09-15 after this pin's own Trivy gate started
    # failing the v1.4.0 publish build on CVE-2026-84304 and CVE-2026-84445
    # (google.golang.org/grpc, both HIGH) in the 1.16.1 binary. 1.16.2's own
    # go.mod bumps google.golang.org/grpc straight to v1.83.2, which carries
    # the fix for both CVEs (84304 needs >=1.83.1, 84445 needs >=1.82.2/
    # 1.83.2) — live-verified against
    # github.com/hashicorp/terraform/blob/v1.16.2/go.mod and
    # releases.hashicorp.com/terraform/1.16.2/terraform_1.16.2_SHA256SUMS.
    #
    # Distribution is a per-architecture zip (unlike Maven's single
    # architecture-independent tarball). HashiCorp publishes one SHA256SUMS
    # manifest per release covering every platform's asset — verified via
    # the same sha256sum -c mechanism as the GitHub-release binaries in the
    # cli-tools stage (see resolve.sh's terraform_sha256_for_asset()),
    # just sourced from releases.hashicorp.com instead of GitHub's API.

  aws_cli:
    version: "2.36.38"
    source: "aws"
    # Explicit pin, NOT "latest" — same infra-tooling rationale as
    # terraform above. AWS publishes versioned installer archives
    # (awscli-exe-linux-<arch>-<version>.zip) alongside its current
    # release — see "Installing past releases of the AWS CLI version 2"
    # (docs.aws.amazon.com/cli/latest/userguide/getting-started-version.html).
    # 2.36.38 is the current release at authoring time (2026-09-02/03),
    # live-verified against github.com/aws/aws-cli's own v2 CHANGELOG.rst
    # and by confirming both architectures' installer archives actually
    # exist at that version's URL.
    #
    # Verification is NOT checksum-based — the one deliberate exception to
    # this file's sha256sum/sha512sum convention. AWS does not publish a
    # SHA256SUMS-style manifest for the CLI; each archive ships instead
    # with a detached PGP signature (.sig), verified at Docker build time
    # via `gpg --verify` against the AWS CLI Team's published public key
    # (fingerprint FB5D B77F D5C1 18B8 0511 ADA8 A631 0ACC 4672 475C,
    # embedded directly in the Dockerfile's infra stage). Same category as
    # Maven's SHA-512-not-SHA-256 exception above — a different vendor
    # convention, not a weaker one: round-trip verified in this session
    # (key import -> download -> gpg --verify: good signature; a
    # tampered-file negative control was correctly rejected).
