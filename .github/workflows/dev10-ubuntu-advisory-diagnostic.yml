name: DEV-10 Ubuntu advisory evidence (diagnostic)
on:
  pull_request:
    paths:
      - .github/workflows/dev10-ubuntu-advisory-diagnostic.yml
      - scripts/audit_ubuntu_linux_headers.py
      - docs/assessments/dev10-kernel-cves.tsv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-inventory:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch and classify the 295 Canonical source-package statuses
        run: |
          set -euo pipefail
          python3 -B scripts/audit_ubuntu_linux_headers.py \
            --inventory docs/assessments/dev10-kernel-cves.tsv \
            --output "$RUNNER_TEMP/dev10-canonical/canonical-cves.json"
      - name: Retain Canonical descriptions and release statuses for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev10-canonical-ubuntu-cve-source-status
          path: ${{ runner.temp }}/dev10-canonical/canonical-cves.json
          if-no-files-found: error
          retention-days: 30
