name: DEV-10 read-only CodeQL alert identification
on:
  pull_request:
    paths:
      - .github/workflows/dev10-codeql-alert-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
  security-events: read
jobs:
  identify-codeql:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Query the current branch alert metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          repo = os.environ["REPOSITORY"]
          branch = os.environ.get("PR_BRANCH", "")
          if not branch or any(c not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_./" for c in branch):
              raise SystemExit("Invalid PR ref")
          url = "https://api.github.com/repos/" + repo + "/code-scanning/alerts?" + urllib.parse.urlencode({
              "state": "open", "pr": 48, "per_page": 100
          })
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  alerts = json.load(response)
          except urllib.error.HTTPError as e:
              print("Code scanning read status:", e.code)
              raise SystemExit(1)
          print("Open alerts on branch:", len(alerts))
          for item in alerts:
              rule = item.get("rule") or {}
              inst = item.get("most_recent_instance") or {}
              loc = inst.get("location") or {}
              print(json.dumps({
                  "number": item.get("number"),
                  "rule": rule.get("id"),
                  "severity": rule.get("security_severity_level") or rule.get("severity"),
                  "description": rule.get("description"),
                  "path": loc.get("path"),
                  "start_line": loc.get("start_line"),
                  "end_line": loc.get("end_line"),
                  "message": (inst.get("message") or {}).get("text", "")[:250],
                  "url": item.get("html_url"),
              }, sort_keys=True))
          PY
