name: DEV-10 locked onboarding
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n scripts/post-create.sh && bash -n scripts/verify.sh && bash -n scripts/build-security-pip.sh && python3 -B -m unittest discover -s tests -v
  published-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-26.04
          - architecture: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate Actions image read separately from Codespaces credentials
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Resolve current stable image to an immutable OCI index digest
        id: stable-image
        env:
          IMAGE_TAG: ghcr.io/baobab-platform/baobab-dev:1.5.1
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE_TAG" > "$RUNNER_TEMP/baobab-dev-index.json"
          jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json" or
             .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1) and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1)
          ' "$RUNNER_TEMP/baobab-dev-index.json" >/dev/null
          digest="sha256:$(sha256sum "$RUNNER_TEMP/baobab-dev-index.json" | cut -d ' ' -f 1)"
          image_ref="ghcr.io/baobab-platform/baobab-dev@$digest"
          [[ "$image_ref" =~ ^ghcr\.io/baobab-platform/baobab-dev@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Stable image did not resolve to an immutable GHCR index digest"; exit 1;
          }
          docker pull "$image_ref"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "Onboarding base: $image_ref (${{ matrix.architecture }} native runner)" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute actual locked repository onboarding in the published image
        env:
          IMAGE_REF: ${{ steps.stable-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_REF"
          docker run --rm -e HOME=/tmp/dev10-home \
            -v "$GITHUB_WORKSPACE:/source:ro" "$IMAGE_REF" bash -c '
              set -euo pipefail
              mkdir -p "$HOME" /tmp/dev10-project
              cp -R /source/. /tmp/dev10-project/
              export WORKSPACE_DIR=/tmp/dev10-project
              cd "$WORKSPACE_DIR"
              bash scripts/post-create.sh --stage=post-create
              python3 -B -m unittest discover -s tests -v
            '
      - name: Root frozen pnpm workspace covers frontend without an unlocked fallback
        env:
          IMAGE_REF: ${{ steps.stable-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker run --rm -e HOME=/tmp/dev10-home -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            "$IMAGE_REF" bash -c '
              set -euo pipefail
              mkdir -p "$HOME"
              # This exercises the published v1.5.1 image baseline (pnpm 12.16.1).
              # The branch's newer 12.21.0 pin is qualified by source and candidate-image builds.
              cp -R tests/fixtures/pnpm-workspace /tmp/dev10-workspace
              mv /tmp/dev10-workspace/package.json.fixture /tmp/dev10-workspace/package.json
              mv /tmp/dev10-workspace/frontend/package.json.fixture /tmp/dev10-workspace/frontend/package.json
              cp -R config /tmp/dev10-workspace/config
              export WORKSPACE_DIR=/tmp/dev10-workspace
              cd "$WORKSPACE_DIR"
              bash /workspace/scripts/post-create.sh --stage=post-create
              test ! -f frontend/package-lock.json
            '
      - name: A failed final verifier must fail the actual container lifecycle
        env:
          IMAGE_REF: ${{ steps.stable-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          result=0
          docker run --rm -e HOME=/tmp/dev10-home -v "$GITHUB_WORKSPACE:/source:ro" \
            "$IMAGE_REF" bash -c '
              set -euo pipefail
              mkdir -p "$HOME" /tmp/dev10-fail/config /tmp/dev10-fail/bin
              cp -R /source/config/. /tmp/dev10-fail/config/
              printf "#!/bin/sh\nexit 42\n" > /tmp/dev10-fail/bin/baobab-verify
              chmod +x /tmp/dev10-fail/bin/baobab-verify
              export PATH=/tmp/dev10-fail/bin:$PATH WORKSPACE_DIR=/tmp/dev10-fail
              cd "$WORKSPACE_DIR"
              bash /source/scripts/post-create.sh --stage=post-create
              python3 -B -m unittest discover -s /source/tests -v
            ' || result=$?
          test "$result" -eq 42
