name: DEV-10 locked onboarding
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read

# Only the newest branch/PR image qualification is useful; cancel superseded
# pending matrices while never interrupting main or release-tag validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint lifecycle and onboarding scripts before container execution
        run: |
          set -euo pipefail
          bash -n scripts/post-create.sh scripts/project-pnpm.sh scripts/verify.sh scripts/summary.sh
          bash -n scripts/ci/onboarding-published-image.sh scripts/ci/checkout-linux-vulns.sh
          shellcheck scripts/ci/onboarding-published-image.sh scripts/ci/checkout-linux-vulns.sh
          bash -n config/bashrc.d/20-aliases.sh scripts/build-security-pip.sh
          python3 -B -m unittest discover -s tests -v
      - name: Read immutable supplemental 41-CVE source pins
        run: |
          set -euo pipefail
          echo "UPSTREAM_41_SHA=$(jq -r .commit security/evidence/dev10-image-observed-cves-41-upstream.lock.json)" >> "$GITHUB_ENV"
      - name: Checkout pinned Linux CNA records
        uses: ./.github/actions/checkout-linux-vulns
        with:
          sha: ${{ env.UPSTREAM_41_SHA }}
          inventory: docs/assessments/dev10-image-observed-cves-41.tsv
      - name: Checkout pinned official CVE List mirror
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cvelist-v5-41"
          sha="$(jq -r .source.commit security/evidence/dev10-image-observed-cves-41-cvelist.lock.json)"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/CVEProject/cvelistV5.git
          git -C "$root" -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=1 origin "$sha"
          git -C "$root" sparse-checkout init --cone
          git -C "$root" sparse-checkout set cves/2026/99xxx cves/2026/100xxx
          git -C "$root" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$sha"
          echo "CVELIST_41_ROOT=$root" >> "$GITHUB_ENV"
      - name: Checkout pinned Canonical OSV snapshot
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canonical-osv-41"
          sha="$(jq -r .source.commit security/evidence/dev10-image-observed-cves-41-canonical.lock.json)"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/canonical/ubuntu-security-notices.git
          git -C "$root" -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=1 origin "$sha"
          git -C "$root" sparse-checkout init --cone
          git -C "$root" sparse-checkout set osv/cve/2026
          git -C "$root" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$sha"
          echo "CANONICAL_41_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify direct Linux CNA records against the official CVE List mirror
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dev10-image-41-source-evidence"
          mkdir -p "$evidence"
          python3 -B scripts/verify_dev10_linux_cna_mirror.py \
            --cvelist-lock security/evidence/dev10-image-observed-cves-41-cvelist.lock.json \
            --cvelist-tsv docs/assessments/dev10-image-observed-cves-41-upstream.tsv \
            --upstream-lock security/evidence/dev10-image-observed-cves-41-upstream.lock.json \
            --cvelist-root "$CVELIST_41_ROOT" \
            --kernel-root "$UPSTREAM_ROOT" \
            --output "$evidence/cvelist-mirror-reconciliation.json"
      - name: Audit pinned upstream CNA and Canonical records
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dev10-image-41-source-evidence"
          python3 -B scripts/audit_dev10_image_observed_41.py \
            --inventory docs/assessments/dev10-image-observed-cves-41.tsv \
            --canonical-tsv docs/assessments/dev10-image-observed-cves-41-canonical.tsv \
            --canonical-lock security/evidence/dev10-image-observed-cves-41-canonical.lock.json \
            --upstream-lock security/evidence/dev10-image-observed-cves-41-upstream.lock.json \
            --upstream-root "$UPSTREAM_ROOT" \
            --canonical-root "$CANONICAL_41_ROOT" \
            --upstream-sha "$UPSTREAM_41_SHA" \
            --output "$evidence/upstream-canonical-reconciliation.json"
          mkdir -p "$evidence/upstream-records" "$evidence/canonical-records" "$evidence/cvelist-records"
          while IFS="$(printf '\\t')" read -r cve _; do
            [[ "$cve" == "cve" ]] && continue
            cp "$UPSTREAM_ROOT/cve/published/2026/$cve.json" "$evidence/upstream-records/$cve.json"
            cp "$CANONICAL_41_ROOT/osv/cve/2026/UBUNTU-$cve.json" "$evidence/canonical-records/$cve.json"
            record_path="$(awk -F '\\t' -v id="$cve" 'NR>1 && $1==id {print $2}' docs/assessments/dev10-image-observed-cves-41-upstream.tsv)"
            cp "$CVELIST_41_ROOT/$record_path" "$evidence/cvelist-records/$cve.json"
          done < docs/assessments/dev10-image-observed-cves-41.tsv
          python3 - "$evidence/upstream-canonical-reconciliation.json" "$evidence/cvelist-mirror-reconciliation.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          mirror=json.load(open(sys.argv[2]))
          assert data["counts"]["records"] == 41
          assert data["counts"]["records_with_affected_paths"] == 41
          assert mirror["counts"]["records"] == 41
          assert mirror["counts"]["mirror_mismatches"] == 0
          print("### Supplemental 41-CVE source evidence")
          print("Linux CNA mirror:",mirror["counts"])
          print("Canonical source/binary records:",data["canonical"])
          PY
      - name: Retain pinned 41-CVE source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-image-observed-41-source-evidence
          path: ${{ runner.temp }}/dev10-image-41-source-evidence/*
          if-no-files-found: warn
          retention-days: 30
  published-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: final
            architecture: amd64
            runner: ubuntu-26.04
          - profile: final
            architecture: arm64
            runner: ubuntu-26.04-arm
          - profile: frontend
            architecture: amd64
            runner: ubuntu-26.04
          - profile: frontend
            architecture: arm64
            runner: ubuntu-26.04-arm
          - profile: frontend-e2e
            architecture: amd64
            runner: ubuntu-26.04
          - profile: frontend-e2e
            architecture: arm64
            runner: ubuntu-26.04-arm
          - profile: infra
            architecture: amd64
            runner: ubuntu-26.04
          - profile: infra
            architecture: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate Actions image read separately from Codespaces credentials
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Install pinned crane CLI for independent registry reads
        env:
          CRANE_VERSION: "0.21.9"
          CRANE_SHA256_AMD64: "5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e"
          CRANE_SHA256_ARM64: "1f4c647b7bb260ab5435661df5b526cf59950ebf95201790db7183ac189cbcbd"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset="go-containerregistry_Linux_x86_64.tar.gz"; expected="$CRANE_SHA256_AMD64" ;;
            aarch64) asset="go-containerregistry_Linux_arm64.tar.gz"; expected="$CRANE_SHA256_ARM64" ;;
            *) echo "::error::Unsupported crane host architecture"; exit 2 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/$asset" "https://github.com/google/go-containerregistry/releases/download/v$CRANE_VERSION/$asset"
          echo "$expected  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" crane
          sudo install "$RUNNER_TEMP/crane" /usr/local/bin/crane
          crane version
      - name: Resolve current stable image to an immutable OCI index digest
        id: stable-image
        run: |
          set -euo pipefail
          PROFILE="${{ matrix.profile }}"
          IMAGE_TAG="$(jq -r --arg profile "$PROFILE" '.stable_profile_images[$profile].image_tag' security/evidence/dev10-kernel-evidence.lock.json)"
          EXPECTED_INDEX_DIGEST="$(jq -r --arg profile "$PROFILE" '.stable_profile_images[$profile].index_digest' security/evidence/dev10-kernel-evidence.lock.json)"
          test -n "$IMAGE_TAG" && test "$EXPECTED_INDEX_DIGEST" != "null"
          docker buildx imagetools inspect --raw "$IMAGE_TAG" > "$RUNNER_TEMP/baobab-dev-index.json"
          jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json" or
             .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1) and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1)
          ' "$RUNNER_TEMP/baobab-dev-index.json" >/dev/null
          digest="sha256:$(sha256sum "$RUNNER_TEMP/baobab-dev-index.json" | cut -d ' ' -f 1)"
          image_ref="ghcr.io/baobab-platform/baobab-dev@$digest"
          [[ "$image_ref" =~ ^ghcr\.io/baobab-platform/baobab-dev@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Stable image did not resolve to an immutable GHCR index digest"; exit 1;
          }
          [[ "$digest" == "$EXPECTED_INDEX_DIGEST" ]] || {
            echo "::error::Stable GHCR index digest differs from the reviewed evidence lock: $digest"
            exit 1
          }
          registry_digest="$(crane digest "$IMAGE_TAG")"
          [[ "$registry_digest" == "$digest" ]] || {
            echo "::error::Independent crane digest differs from raw OCI index SHA: $registry_digest vs $digest"
            exit 1
          }
          docker pull "$image_ref"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "Onboarding base: $PROFILE / $image_ref (${{ matrix.architecture }} native runner)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Cosign CLI for independent GHCR verification
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Independently verify stable GHCR digest, native signatures, SBOM and SLSA provenance
        id: ghcr-provenance
        continue-on-error: true
        env:
          IMAGE_REF: ${{ steps.stable-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          PROFILE="${{ matrix.profile }}"
          RELEASE_TAG="$(jq -r --arg profile "$PROFILE" '.stable_profile_images[$profile].release_tag' security/evidence/dev10-kernel-evidence.lock.json)"
          SIGNER_TAG="$(jq -r --arg profile "$PROFILE" '.stable_profile_images[$profile].signer_tag' security/evidence/dev10-kernel-evidence.lock.json)"
          expected_sha="$(jq -r --arg profile "$PROFILE" '.stable_profile_images[$profile].source_sha' security/evidence/dev10-kernel-evidence.lock.json)"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          observed_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$observed_sha" = "$expected_sha"
          python3 -B scripts/verify_registry_arch_attestations.py \
            --image "$IMAGE_REF" --tag "$RELEASE_TAG" --signer-tag "$SIGNER_TAG" \
            --expected-sha "$expected_sha" \
            --evidence "$RUNNER_TEMP/ghcr-native-provenance-evidence.json"
      - name: Classify historical GHCR provenance without waiving release qualification
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ghcr-native-provenance-evidence.json"
          test -s "$evidence" || { echo "::error::No independent GHCR verification evidence was produced"; exit 1; }
          status="$(jq -r '.status' "$evidence")"
          case "$status" in
            STRICT_SIGNED_NATIVE_CONTENT_VERIFIED)
              echo "### Independent GHCR release evidence" >> "$GITHUB_STEP_SUMMARY"
              echo "The locked v1.5.1 index digest, native signatures, SBOM and SLSA provenance verified strictly." >> "$GITHUB_STEP_SUMMARY"
              ;;
            HISTORICAL_BASELINE_UNQUALIFIED)
              echo "::warning::Historical v1.5.1 baseline did not satisfy strict current verification; v1.5.2 promotion remains gated."
              {
                echo "### Historical GHCR baseline: unqualified"
                echo "The locked v1.5.1 digest is retained for onboarding diagnostics only. This result is not R5 release qualification and grants no v1.5.2 publication or promotion authority."
                jq -r '"Failure category: " + .failure.command_category, "Error code: " + .failure.error_code, "Exit status: " + (.failure.exit_status|tostring)' "$evidence"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unexpected GHCR verification status: $status"
              jq '.failure' "$evidence" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
      - name: Retain independent GHCR provenance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-ghcr-provenance-${{ matrix.profile }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/ghcr-native-provenance-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Execute locked onboarding and root pnpm workspace in the published image
        env:
          IMAGE_REF: ${{ steps.stable-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/scripts/ci/onboarding-published-image.sh"
          bash -n "$GITHUB_WORKSPACE/scripts/ci/onboarding-published-image.sh"
          docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_REF"
          mkdir -p "$RUNNER_TEMP/dev10-evidence"
          chmod 0777 "$RUNNER_TEMP/dev10-evidence"
          if [[ "${{ matrix.profile }}" == "frontend-e2e" ]]; then
            # Historical v1.5.1 installed Playwright's browser cache as root.
            # Copy those exact immutable-image binaries into the shared evidence
            # volume with read/execute access, then launch them as vscode.
            docker run --rm --user 0:0 \
              -v "$RUNNER_TEMP/dev10-evidence:/evidence" "$IMAGE_REF" bash -c '
                set -euo pipefail
                browser_source=""
                for candidate in "${PLAYWRIGHT_BROWSERS_PATH:-}" /opt/ms-playwright /root/.cache/ms-playwright /home/vscode/.cache/ms-playwright; do
                  [[ -n "$candidate" && -d "$candidate" ]] || continue
                  browser_source="$candidate"
                  break
                done
                [[ -n "$browser_source" ]] || { echo "No Playwright browser cache exists in the immutable image" >&2; exit 1; }
                mkdir -p /evidence/browser-cache
                cp -a "$browser_source/." /evidence/browser-cache/
                chmod -R a+rX /evidence/browser-cache
              '
          fi
          expected_version="$(jq -r .source.binary_package_mapping.binary_version security/evidence/dev10-image-observed-cves-41-canonical.lock.json)"
          docker run --rm -e EXPECTED_PROFILE="${{ matrix.profile }}" -e IMAGE_REF="$IMAGE_REF" \
            -e EXPECTED_ARCHITECTURE="${{ matrix.architecture }}" \
            -e EXPECTED_LINUX_LIBC_DEV_VERSION="$expected_version" \
            -e PLAYWRIGHT_BROWSERS_PATH=/evidence/browser-cache \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/dev10-evidence:/evidence" "$IMAGE_REF" \
            bash /source/scripts/ci/onboarding-published-image.sh
          python3 -B scripts/ci/assemble_image_binary_package_manifest.py \
            --profile "${{ matrix.profile }}" \
            --architecture "${{ matrix.architecture }}" \
            --image-ref "$IMAGE_REF" \
            --expected-version "$expected_version" \
            --package-metadata "$RUNNER_TEMP/dev10-evidence/linux-libc-dev.package.tsv" \
            --manifest "$RUNNER_TEMP/dev10-evidence/linux-libc-dev.manifest.tsv" \
            --output "$RUNNER_TEMP/dev10-evidence/binary-package-provenance-${{ matrix.profile }}-${{ matrix.architecture }}.json"
      - name: Retain immutable-image onboarding verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-onboarding-verification-${{ matrix.profile }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/dev10-evidence/*
          if-no-files-found: warn
          retention-days: 30
      - name: A failed final verifier must fail the actual container lifecycle
        if: matrix.profile == 'final' && matrix.architecture == 'amd64'
        env:
          IMAGE_REF: ${{ steps.stable-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          result=0
          docker run --rm -v "$GITHUB_WORKSPACE:/source:ro" \
            "$IMAGE_REF" bash -c '
              set -euo pipefail
              mkdir -p "$HOME" /tmp/dev10-fail/config /tmp/dev10-fail/bin
              cp -R /source/config/. /tmp/dev10-fail/config/
              printf "#!/bin/sh\nexit 42\n" > /tmp/dev10-fail/bin/baobab-verify
              chmod +x /tmp/dev10-fail/bin/baobab-verify
              export PATH=/tmp/dev10-fail/bin:$PATH WORKSPACE_DIR=/tmp/dev10-fail
              cd "$WORKSPACE_DIR"
              bash /source/scripts/post-create.sh --stage=post-create
              python3 -B -m unittest discover -s /source/tests -v
            ' || result=$?
          test "$result" -eq 42
