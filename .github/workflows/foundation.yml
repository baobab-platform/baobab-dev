name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69
    with:
      foundation_ref: "31de2bc3dcd56128c019c640dc7e12c10ae9ca69"
      dependency_review_enabled: false
      container_ignore_unfixed: false

  pr-reviewer-independence:
    name: PR reviewer independence audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit live PR reviewer contributor independence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_pr_reviewer_independence.py --pr-number "$PR_NUMBER"

  # Explicit replacement for Shared's temporary 'container-scan' exception.
  # Retain full Trivy coverage; only exact known CVEs can be risk accepted.
  dev10-container-risk:
    name: DEV-10 / Foundation container CVE gate
    environment: dev10-security-policy-read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate approved risk policy negative cases
        run: python3 -B -m unittest discover -s tests -p test_dev10_kernel_risk_gate.py -v
      - name: Build actual Foundation development container
        run: |
          set -euo pipefail
          docker build --file .devcontainer/docker/Dockerfile \
            --build-arg VERSION=0.0.0-ci \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "foundation-scan:${GITHUB_SHA}" .
      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$asset" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Scan unfiltered image and enforce scoped risk decision
        id: risk-scan
        env:
          PR_NUMBER: "${{ github.event.pull_request.number || 0 }}"
          TRUSTED_POLICY_SHA: ${{ vars.DEV10_PROTECTED_DECISION_SHA256 }}
          TRUSTED_APPROVERS: ${{ vars.DEV10_SECURITY_APPROVER_LOGINS }}
          POLICY_EVENT: ${{ github.event_name }}
          POLICY_REF: ${{ github.ref }}
          POLICY_BASE_REF: ${{ github.base_ref }}
          POLICY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT_DIR="${RUNNER_TEMP}/foundation-trivy-evidence"
          mkdir -p "$REPORT_DIR"
          set +e
          trivy image \
            --scanners vuln,secret \
            --ignorefile /dev/null \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --skip-version-check \
            --format json \
            --output "${RUNNER_TEMP}/foundation-trivy-raw.json" \
            "foundation-scan:${GITHUB_SHA}"
          scan_rc=$?
          set -e
          python3 scripts/summarize-trivy-vulnerabilities.py \
            "${RUNNER_TEMP}/foundation-trivy-raw.json" \
            "${REPORT_DIR}/findings.json" final linux/amd64
          # Produce non-authorizing review evidence before any approval gate.
          # Never upload the raw scan, which can contain secret-match material.
          if (( scan_rc == 1 )); then
            scanner_version=$(trivy --version | sed -n 's/^Version: //p' | head -1)
            python3 scripts/prepare_dev10_risk_inventory.py \
              --raw-trivy "${RUNNER_TEMP}/foundation-trivy-raw.json" \
              --scanner-version "$scanner_version" \
              --profile final --architecture linux/amd64 \
              --output "${REPORT_DIR}/foundation.review-only.json"
            sha256sum "${REPORT_DIR}/foundation.review-only.json" \
              > "${REPORT_DIR}/foundation.review-only.sha256"
          fi
          if (( scan_rc != 0 )); then
            if (( scan_rc != 1 )); then
              echo "::error::Trivy tool failure is not an accepted CVE risk."
              exit "$scan_rc"
            fi
            # Foundation's locally built image is not an immutable GHCR child
            # digest. Do not counterfeit digest identity to invoke the remote
            # evaluator. Instead authenticate the protected decision and its
            # independent approval custody before local scan acceptance.
            decision_file="security/decisions/development/foundation.json"
            [[ -f "$decision_file" && -n "$TRUSTED_POLICY_SHA" && -n "$TRUSTED_APPROVERS" ]] || {
              echo "::error::Authenticated development risk policy is not provisioned"; exit 2;
            }
            python3 scripts/verify_protected_risk_custody.py \
              --decision "$decision_file" --trusted-approvers "$TRUSTED_APPROVERS"
            python3 scripts/verify_protected_policy_hash.py \
              --decision "$decision_file" --trusted-sha256 "$TRUSTED_POLICY_SHA" \
              --report "${RUNNER_TEMP}/foundation-trivy-raw.json" \
              --profile final --architecture linux/amd64 \
              --event "$POLICY_EVENT" --ref "$POLICY_REF" --base-ref "$POLICY_BASE_REF" \
              --head-repository "$POLICY_HEAD_REPOSITORY" \
              > "${REPORT_DIR}/dev10-protected-risk-acceptance.json"
          fi
      - name: Retain sanitized vulnerability and risk evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev10-foundation-container-risk-${{ github.sha }}
          path: ${{ runner.temp }}/foundation-trivy-evidence/
          if-no-files-found: error
          retention-days: 14
