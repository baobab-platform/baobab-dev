name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  # Run the expensive, unfiltered Foundation image scan only when the PR
  # changes inputs that can alter the image. All shared Foundation gates remain
  # on the full profile for every event; policy records have their own schema gate.
  scope:
    runs-on: ubuntu-26.04
    outputs:
      container_scan: ${{ steps.detect.outputs.container_scan }}
      image_41_evidence: ${{ steps.detect.outputs.image_41_evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect changed container or scan-policy inputs
        env:
          EVENT_NAME: "${{ github.event_name }}"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "container_scan=true" >> "$GITHUB_OUTPUT"
            echo "image_41_evidence=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For pull_request events GITHUB_SHA is the synthetic merge commit.
          # Its first parent is the actual base used for this run; the event's
          # pull_request.base.sha can be stale after main advances.
          git rev-parse --verify "${GITHUB_SHA}^2" >/dev/null || {
            echo "::error::pull_request event did not resolve to a synthetic merge commit."
            exit 2
          }
          changed="$(git diff --name-only "${GITHUB_SHA}^1" "$GITHUB_SHA")"
          container_changed=false
          image_41_evidence=false
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              docs/assessments/dev10-image-observed-cves-41.tsv|docs/assessments/dev10-image-observed-cves-41-canonical.tsv|security/evidence/dev10-image-observed-cves-41-canonical.lock.json|security/evidence/dev10-image-observed-cves-41-upstream.lock.json|scripts/audit_dev10_image_observed_41.py|scripts/verify_ubuntu_binary_package_arch.py|tests/test_dev10_image_observed_41_sources.py|tests/test_ubuntu_binary_package_arch.py|tests/test_kernel_cve_paths.py)
                image_41_evidence=true
                ;;
              # This custodian-only tool is not copied or executed by the
              # development image; its own policy-contract workflow tests it.
              scripts/provision_protected_risk_policy.py|scripts/custody_independence.py|scripts/github_api_transport.py|scripts/evaluate_protected_risk_decision.py|scripts/verify_protected_risk_custody.py|scripts/verify_protected_policy_hash.py|scripts/prepare_dev10_risk_inventory.py|scripts/audit_pr_reviewer_independence.py)
                ;;
              .devcontainer/*|config/*|scripts/*|.baobab/repository.yaml|docs/assessments/dev10-kernel-cves.tsv)
                container_changed=true
                ;;
            esac
          done <<< "$changed"

          echo "image_41_evidence=$image_41_evidence" >> "$GITHUB_OUTPUT"
          if [[ "$container_changed" == "true" ]]; then
            echo "container_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "container_scan=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No container build inputs changed; the dedicated image scan is not applicable to this PR."
          fi

  foundation:
    needs: scope
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69
    with:
      foundation_ref: "31de2bc3dcd56128c019c640dc7e12c10ae9ca69"
      dependency_review_enabled: false
      container_ignore_unfixed: false

  pr-reviewer-independence:
    name: PR reviewer independence audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit live PR reviewer contributor independence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_pr_reviewer_independence.py --pr-number "$PR_NUMBER"

  # Explicit replacement for Shared's temporary 'container-scan' exception.
  # Retain full Trivy coverage; only exact known CVEs can be risk accepted.

  dev10-image-observed-41-source-evidence:
    needs: scope
    if: needs.scope.outputs.image_41_evidence == 'true'
    name: DEV-10 supplemental 41-CVE upstream and Canonical evidence
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout immutable PR merge head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate supplemental source evidence and regression tests
        run: |
          set -euo pipefail
          bash -n scripts/ci/checkout-linux-vulns.sh
          python3 -B -m unittest discover -s tests -p test_kernel_cve_paths.py -v
          python3 - <<'PY'
          import json
          with open("security/evidence/dev10-image-observed-cves-41-upstream.lock.json") as f:
              upstream=json.load(f)
          with open("security/evidence/dev10-image-observed-cves-41-canonical.lock.json") as f:
              canonical=json.load(f)
          assert upstream["record_count"] == 41
          assert canonical["source"]["record_count"] == 41
          assert len(set(upstream["cves"])) == 41
          print("Validated 41 supplemental CVEs and immutable source pins.")
          PY
          echo "UPSTREAM_41_SHA=$(jq -r .commit security/evidence/dev10-image-observed-cves-41-upstream.lock.json)" >> "$GITHUB_ENV"
      - name: Checkout pinned Canonical OSV snapshot
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canonical-ubuntu-security-notices-41"
          sha="$(jq -r .source.commit security/evidence/dev10-image-observed-cves-41-canonical.lock.json)"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/canonical/ubuntu-security-notices.git
          git -C "$root" -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=1 origin "$sha"
          git -C "$root" sparse-checkout init --cone
          git -C "$root" sparse-checkout set osv/cve/2026
          git -C "$root" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$sha"
          echo "CANONICAL_41_ROOT=$root" >> "$GITHUB_ENV"
      - name: Checkout pinned upstream Linux CNA records
        uses: ./.github/actions/checkout-linux-vulns
        with:
          sha: ${{ env.UPSTREAM_41_SHA }}
          inventory: docs/assessments/dev10-image-observed-cves-41.tsv
      - name: Audit all 41 upstream paths and Canonical Resolute records
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dev10-image-41-source-evidence"
          mkdir -p "$evidence/upstream-records" "$evidence/canonical-records"
          python3 -B scripts/audit_dev10_image_observed_41.py \
            --inventory docs/assessments/dev10-image-observed-cves-41.tsv \
            --canonical-tsv docs/assessments/dev10-image-observed-cves-41-canonical.tsv \
            --canonical-lock security/evidence/dev10-image-observed-cves-41-canonical.lock.json \
            --upstream-root "$UPSTREAM_ROOT" \
            --canonical-root "$CANONICAL_41_ROOT" \
            --upstream-sha "$UPSTREAM_41_SHA" \
            --output "$evidence/upstream-canonical-reconciliation.json"
          while read -r cve; do
            [[ "$cve" =~ ^CVE-[0-9]{4}-[0-9]{4,}$ ]] || continue
            year="$(printf '%s' "$cve" | cut -c5-8)"
            cp "$UPSTREAM_ROOT/cve/published/$year/$cve.json" "$evidence/upstream-records/$cve.json"
            cp "$CANONICAL_41_ROOT/osv/cve/2026/UBUNTU-$cve.json" "$evidence/canonical-records/$cve.json"
          done < <(tail -n +2 docs/assessments/dev10-image-observed-cves-41.tsv | cut -f1)
          python3 - "$evidence/upstream-canonical-reconciliation.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["counts"]["records"] == 41
          assert data["counts"]["records_with_affected_paths"] == 41
          assert data["canonical"]["affected_version"] == "7.0.0-43.43"
          print("### Supplemental 41-CVE source evidence")
          print("Linux CNA revision:",data["upstream"]["commit"])
          print("Canonical OSV revision:",data["canonical"]["commit"])
          print("Verified records and affected paths:",data["counts"])
          print("Resolute source package/version:",data["canonical"]["resolute_source_package"],data["canonical"]["affected_version"])
          print("No binary non-applicability or VEX disposition inferred.")
          PY
      - name: Retain exact upstream and Canonical source records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-image-observed-41-upstream-canonical-evidence
          path: ${{ runner.temp }}/dev10-image-41-source-evidence/
          if-no-files-found: error
          retention-days: 30


  dev10-image-observed-41-binary-manifests:
    needs: scope
    if: needs.scope.outputs.image_41_evidence == 'true'
    name: DEV-10 supplemental 41-CVE binary package evidence
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - name: Checkout immutable PR merge head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable native arm64 package execution
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          platforms: arm64
      - name: Resolve immutable Ubuntu base image and package version
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version="$(jq -r .package_version security/evidence/dev10-kernel-evidence.lock.json)"
          test "$version" = "7.0.0-43.43"
          docker pull --platform "linux/$TARGET_ARCH" ubuntu:26.04
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:26.04)"
          [[ "$image_ref" =~ ^ubuntu@sha256:[a-f0-9]{64}$ ]]
          evidence="$RUNNER_TEMP/dev10-image-41-binary/$TARGET_ARCH"
          mkdir -p "$evidence"
          printf '%s\n' "$image_ref" > "$evidence/ubuntu-base-image.txt"
          echo "UBUNTU_KERNEL_RELEASE=$version" >> "$GITHUB_ENV"
          echo "UBUNTU_IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "TARGET_ARCH=$TARGET_ARCH" >> "$GITHUB_ENV"
      - name: Install and capture exact architecture package
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dev10-image-41-binary/$TARGET_ARCH"
          docker run --rm --platform "linux/$TARGET_ARCH" \
            -e UBUNTU_KERNEL_RELEASE="$UBUNTU_KERNEL_RELEASE" \
            -e TARGET_ARCH="$TARGET_ARCH" \
            -v "$evidence:/evidence" \
            "$UBUNTU_IMAGE_REF" bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -qq -y --no-install-recommends linux-libc-dev=$UBUNTU_KERNEL_RELEASE >/dev/null
              test "$(dpkg-query -W linux-libc-dev | cut -f2)" = "$UBUNTU_KERNEL_RELEASE"
              dpkg-query -L linux-libc-dev > /evidence/installed-paths.txt
              dpkg-query -W -f="\${Package}\t\${Version}\t\${Architecture}\t\${Status}\t\${source:Package}\t\${source:Version}\n" linux-libc-dev > /evidence/installed-package.txt
              apt-cache show "linux-libc-dev=$UBUNTU_KERNEL_RELEASE" > /evidence/apt-package-metadata.txt
              apt-cache policy linux-libc-dev > /evidence/apt-policy.txt
              apt-cache madison linux-libc-dev > /evidence/apt-madison.txt
              mkdir -p /tmp/apt-package-download
              chmod 0777 /tmp/apt-package-download
              cd /tmp/apt-package-download
              apt-get download "linux-libc-dev=$UBUNTU_KERNEL_RELEASE"
              package_deb="$(find . -maxdepth 1 -type f -name "linux-libc-dev_*_$TARGET_ARCH.deb" -print -quit)"
              test -n "$package_deb"
              sha256sum "$(basename "$package_deb")" > /evidence/apt-package-deb-sha256.txt
              cp "$package_deb" /evidence/
              find /var/lib/apt/lists -type f -name "*_Packages*" -print0 | sort -z | xargs -0 -r sha256sum > /evidence/apt-package-index-sha256.txt
              find /var/lib/apt/lists -type f -name "*InRelease" -print0 | sort -z | xargs -0 -r sha256sum > /evidence/apt-inrelease-sha256.txt
              {
                while IFS= read -r package_path; do
                  if [ -L "$package_path" ]; then
                    printf "symlink\t%s\t%s\n" "$package_path" "$(readlink "$package_path")"
                  elif [ -d "$package_path" ]; then
                    printf "dir\t%s\t\n" "$package_path"
                  elif [ -f "$package_path" ]; then
                    printf "file\t%s\t%s\n" "$package_path" "$(sha256sum -- "$package_path" | cut -d" " -f1)"
                  else
                    echo "Installed package path is missing: $package_path" >&2
                    exit 3
                  fi
                done < /evidence/installed-paths.txt
              } | LC_ALL=C sort -t "$(printf "\t")" -k2,2 > /evidence/installed-content-manifest.tsv
              test -s /evidence/installed-content-manifest.tsv
              test -s /evidence/apt-package-index-sha256.txt
              test -s /evidence/apt-inrelease-sha256.txt
            '
          deb="$(find "$evidence" -maxdepth 1 -type f -name "linux-libc-dev_*_$TARGET_ARCH.deb" -print -quit)"
          test -n "$deb"
          python3 -B scripts/verify_ubuntu_binary_package_arch.py \
            --architecture "$TARGET_ARCH" \
            --installed-package "$evidence/installed-package.txt" \
            --installed-content-manifest "$evidence/installed-content-manifest.tsv" \
            --apt-package-metadata "$evidence/apt-package-metadata.txt" \
            --apt-policy "$evidence/apt-policy.txt" \
            --apt-madison "$evidence/apt-madison.txt" \
            --deb "$deb" \
            --index-sha256 "$evidence/apt-package-index-sha256.txt" \
            --release-sha256 "$evidence/apt-inrelease-sha256.txt" \
            --base-image "$evidence/ubuntu-base-image.txt" \
            --output "$evidence/binary-package-provenance.json"
          python3 - "$evidence/binary-package-provenance.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          item=json.load(open(sys.argv[1]))
          assert item["binary_version"] == "7.0.0-43.43"
          assert item["source_package"] == "linux"
          assert item["package_path_count"] > 0
          print("Architecture:",item["architecture"])
          print("Binary/source:",item["binary_package"],item["binary_version"],"=>",item["source_package"],item["source_version"])
          print("Package payload paths:",item["package_path_count"])
          print("Manifest SHA-256:",item["package_content_manifest_sha256"])
          print("CVE applicability and VEX remain under investigation.")
          PY
      - name: Retain architecture-specific binary package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-image-observed-41-binary-${{ matrix.architecture }}
          path: ${{ runner.temp }}/dev10-image-41-binary/${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 30

  dev10-container-risk:
    needs: scope
    name: DEV-10 / Foundation container CVE gate
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate approved risk policy negative cases
        run: python3 -B -m unittest discover -s tests -p test_dev10_kernel_risk_gate.py -v
      - name: Validate DEV-10 policy, review-transition and contributor custody
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests/test_protected_local_policy.py \
            tests/test_protected_risk_custody.py \
            tests/test_custody_independence.py \
            tests/test_audit_pr_reviewer_independence.py \
            tests/test_protected_risk_decision.py
      - name: Build actual Foundation development container
        if: needs.scope.outputs.container_scan == 'true'
        run: |
          set -euo pipefail
          docker build --file .devcontainer/docker/Dockerfile \
            --build-arg VERSION=0.0.0-ci \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "foundation-scan:${GITHUB_SHA}" .
      - name: Install checksum-verified Trivy
        if: needs.scope.outputs.container_scan == 'true'
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$asset" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Scan unfiltered image and enforce scoped risk decision
        if: needs.scope.outputs.container_scan == 'true'
        id: risk-scan
        env:
          TRUSTED_POLICY_SHA: ${{ vars.DEV10_PROTECTED_DECISION_SHA256 }}
          TRUSTED_APPROVERS: ${{ vars.DEV10_SECURITY_APPROVER_LOGINS }}
          POLICY_EVENT: ${{ github.event_name }}
          POLICY_REF: ${{ github.ref }}
          POLICY_BASE_REF: ${{ github.base_ref }}
          POLICY_HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || (github.event_name == 'push' && github.repository) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT_DIR="${RUNNER_TEMP}/foundation-trivy-evidence"
          mkdir -p "$REPORT_DIR"
          set +e
          trivy image \
            --scanners vuln,secret \
            --ignorefile /dev/null \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --skip-version-check \
            --format json \
            --output "${RUNNER_TEMP}/foundation-trivy-raw.json" \
            "foundation-scan:${GITHUB_SHA}"
          scan_rc=$?
          set -e
          python3 scripts/summarize-trivy-vulnerabilities.py \
            "${RUNNER_TEMP}/foundation-trivy-raw.json" \
            "${REPORT_DIR}/findings.json" final linux/amd64
          # Produce non-authorizing review evidence before any approval gate.
          # Never upload the raw scan, which can contain secret-match material.
          if (( scan_rc == 1 )); then
            scanner_version=$(trivy --version | sed -n 's/^Version: //p' | head -1)
            python3 scripts/prepare_dev10_risk_inventory.py \
              --raw-trivy "${RUNNER_TEMP}/foundation-trivy-raw.json" \
              --scanner-version "$scanner_version" \
              --profile final --architecture linux/amd64 \
              --output "${REPORT_DIR}/foundation.review-only.json"
            sha256sum "${REPORT_DIR}/foundation.review-only.json" \
              > "${REPORT_DIR}/foundation.review-only.sha256"
          fi
          if (( scan_rc != 0 )); then
            if (( scan_rc != 1 )); then
              echo "::error::Trivy tool failure is not an accepted CVE risk."
              exit "$scan_rc"
            fi
            # Foundation's locally built image is not an immutable GHCR child
            # digest. Do not counterfeit digest identity to invoke the remote
            # evaluator. Instead authenticate the protected decision and its
            # independent approval custody before local scan acceptance.
            decision_file="security/decisions/development/foundation.json"
            [[ -f "$decision_file" && -n "$TRUSTED_POLICY_SHA" && -n "$TRUSTED_APPROVERS" ]] || {
              echo "::error::Authenticated development risk policy is not provisioned"; exit 2;
            }
            custody_result="${RUNNER_TEMP}/dev10-protected-policy-custody.json"
            python3 scripts/verify_protected_risk_custody.py \
              --decision "$decision_file" --trusted-approvers "$TRUSTED_APPROVERS" \
              --output "$custody_result"
            approval_id=$(jq -er '.approval_id' "$custody_result")
            approved_at=$(jq -er '.approved_at' "$custody_result")
            approved_by_id=$(jq -er '.approved_by_id' "$custody_result")
            python3 scripts/verify_protected_policy_hash.py \
              --decision "$decision_file" --trusted-sha256 "$TRUSTED_POLICY_SHA" \
              --report "${RUNNER_TEMP}/foundation-trivy-raw.json" \
              --profile final --architecture linux/amd64 \
              --event "$POLICY_EVENT" --ref "$POLICY_REF" --base-ref "$POLICY_BASE_REF" \
              --head-repository "$POLICY_HEAD_REPOSITORY" \
              --approval-id "$approval_id" --approved-at "$approved_at" \
              --approved-by-id "$approved_by_id" \
              > "${REPORT_DIR}/dev10-protected-risk-acceptance.json"
          fi
      - name: Retain sanitized vulnerability and risk evidence
        if: always() && needs.scope.outputs.container_scan == 'true' && (steps.risk-scan.outcome == 'success' || steps.risk-scan.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-foundation-container-risk-${{ github.sha }}
          path: ${{ runner.temp }}/foundation-trivy-evidence/
          if-no-files-found: error
          retention-days: 14
