# ==============================================================================
# BAOBAB Enterprise Platform
# Security (source-level)
#
# File: .github/workflows/security.yml
#
# PURPOSE:
#   Adds source-level secret scanning for this repository — previously
#   the only security scanning here was Trivy's container-filesystem
#   scan inside publish.yml, which never looks at the repository's own
#   git history (its Dockerfiles, shell scripts, config/versions.yaml,
#   etc). Delegates to baobab-platform/shared's reusable
#   security-secrets-scan.yml, same pattern as this repo's pages.yml and
#   greetings.yml.
#
# WHY THIS FILE IS NARROWER THAN baobab-platform/baobab's security.yml:
#   baobab-platform/baobab's equivalent file also runs CodeQL and Bandit/
#   pip-audit — both are Python-application checks and this repository
#   has no Python application source to scan (CodeQL has no extractor
#   for plain shell/Dockerfile, and there is no `security` uv
#   dependency-group here because there is nothing for Bandit to point
#   at). Secret scanning and dependency review are the two checks that
#   are genuinely toolchain-agnostic, so those are the two this repo
#   adopts. Trivy's own image-layer secret scan
#   (`--scanners vuln,secret` in publish.yml) stays exactly where it is —
#   it scans a different thing (the built container filesystem) than
#   this file does (the git-committed source), so the two are
#   complementary, not redundant.
#
#   `dependency-review` is GitHub's own actions/dependency-review-action,
#   invoked directly rather than through another baobab-platform/shared
#   workflow_call layer — same reasoning as baobab-platform/baobab's security.yml.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Re-pinned the baobab-platform/shared `uses:` line to the v1.1.0 tag —
#   security-secrets-scan.yml shipped in that release. SHA is the tag's
#   peeled/dereferenced commit (not the annotated tag object's own SHA),
#   verified live via `git ls-remote --tags
#   https://github.com/baobab-platform/shared.git v1.1.0 v1.1.0^{}` on
#   2026-08-25 (f8df9b90ffe8fef5cbf6d14a9bcf868f723d1464), and confirmed
#   present via `git ls-tree -r <that SHA> -- .github/workflows`.
# * Initial version, this repo's first source-level security workflow.
#   (Shipped with an honest 0000...0000 placeholder pin at the time,
#   since security-secrets-scan.yml did not exist yet in baobab-platform/shared
#   — see this file's git history for that revision.)
# ==============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly — staggered against this repo's own Monday 00:00 UTC
    # update-lockfile.yml schedule to avoid queueing both at once.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning
    permissions:
      contents: read
    # SHA is baobab-platform/shared's v1.1.0 tag (annotated — peeled commit, not
    # the tag object's own SHA), verified live via `git ls-remote --tags
    # https://github.com/baobab-platform/shared.git v1.1.0 v1.1.0^{}` on 2026-08-25.
    uses: baobab-platform/shared/.github/workflows/security-secrets-scan.yml@f7466cc89a17c0b6e02b5a1e5fce3ce76073a718 # v1.1.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  python-dependency-audit:
    name: Independent Python dependencies (committed locks)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Checkout committed dependency manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.14
        uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6
        with:
          python-version: '3.14'
      - name: Install exact checksum-verified uv / uvx from committed lock
        run: |
          set -euo pipefail
          . config/versions.lock
          work=$(mktemp -d)
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/${UV_ASSET_AMD64}" \
            -o "$work/uv.tar.gz"
          echo "${UV_SHA256_AMD64}  $work/uv.tar.gz" | sha256sum --check --strict
          tar -xzf "$work/uv.tar.gz" -C "$work"
          install -m 0755 "$(find "$work" -type f -name uv -print -quit)" "$RUNNER_TEMP/uv"
          install -m 0755 "$(find "$work" -type f -name uvx -print -quit)" "$RUNNER_TEMP/uvx"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rm -rf "$work"
      - name: Audit all committed Python dependency pins without exemptions
        run: |
          set -euo pipefail
          bash -n scripts/audit-python-dependencies.sh
          bash scripts/audit-python-dependencies.sh --source 2>&1 | tee "$RUNNER_TEMP/python-audit.log"
      - name: Retain independent Python audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dependency-audit-${{ github.sha }}
          path: ${{ runner.temp }}/python-audit.log
          if-no-files-found: warn
          retention-days: 30

  cli-source-graphs:
    name: Security rebuild dependency graphs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified Trivy
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz
          echo '2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b  /tmp/trivy.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - name: Audit complete locked source graphs without suppressions
        run: |
          set -euo pipefail
          audit=$(mktemp -d)
          trap 'rm -rf "$audit"' EXIT
          for tool in task yq buildx compose; do
            mkdir "$audit/$tool"
            cp "config/security/$tool/go.mod.lock" "$audit/$tool/go.mod"
            cp "config/security/$tool/go.sum" "$audit/$tool/go.sum"
          done
          /tmp/trivy fs --scanners vuln --ignorefile /dev/null --severity HIGH,CRITICAL --exit-code 1 "$audit"
