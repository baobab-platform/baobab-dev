name: DEV-10 upstream Linux CVE path evidence
# Diagnostic only. No release action, scanner exemptions, shared caches, or secrets.
on:
  pull_request:
    paths:
      - .github/workflows/dev10-kernel-paths.yml
      - scripts/audit_kernel_cve_paths.py
      - tests/test_kernel_cve_paths.py
      - docs/assessments/dev10-kernel-cves-298.tsv
      - docs/assessments/dev10-canonical-cve-status-20261118.tsv
      - scripts/build_dev10_applicability_register.py
      - scripts/verify_dev10_vex.py
      - tests/test_dev10_security_authorisation.py
      - tests/test_canonical_osv_evidence.py
      - security/evidence/dev10-kernel-evidence.lock.json
      - security/evidence/dev10-cve-applicability.schema.json
      - scripts/dev10_evidence_lock.py
      - scripts/audit_canonical_osv.py
      - .github/actions/checkout-linux-vulns/action.yml
      - scripts/ci/checkout-linux-vulns.sh

permissions:
  contents: read

jobs:
  upstream-evidence:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Load and validate reviewed kernel evidence lock
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from dev10_evidence_lock import EvidenceLock; EvidenceLock.load()'
          echo "UBUNTU_KERNEL_RELEASE=$(jq -r .package_version security/evidence/dev10-kernel-evidence.lock.json)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$(jq -r .upstream_cna.sha security/evidence/dev10-kernel-evidence.lock.json)" >> "$GITHUB_ENV"
          echo "EXPECTED_CVE_COUNT=$(jq -r .inventory.count security/evidence/dev10-kernel-evidence.lock.json)" >> "$GITHUB_ENV"
      - name: Test conservative advisory classification
        run: python3 -B -m unittest discover -s tests -p test_kernel_cve_paths.py -v
      - name: Test conservative CVE register and real signed-policy negative cases
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_dev10_security_authorisation.py -v
      - name: Capture actual binary-file manifest from exact Ubuntu package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-evidence"
          docker pull ubuntu:26.04
          UBUNTU_IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:26.04)"
          [[ "$UBUNTU_IMAGE_REF" =~ ^ubuntu@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Ubuntu base image did not resolve to an immutable digest: $UBUNTU_IMAGE_REF"
            exit 1
          }
          printf '%s\\n' "$UBUNTU_IMAGE_REF" > "$RUNNER_TEMP/kernel-evidence/ubuntu-base-image.txt"
          docker run --rm --platform linux/amd64 \
            -e UBUNTU_KERNEL_RELEASE="$UBUNTU_KERNEL_RELEASE" \
            -v "$RUNNER_TEMP/kernel-evidence:/evidence" \
            "$UBUNTU_IMAGE_REF" bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq --no-install-recommends linux-libc-dev=${UBUNTU_KERNEL_RELEASE} >/dev/null
              test "$(dpkg-query -W linux-libc-dev | awk "{print \\$2}")" = "${UBUNTU_KERNEL_RELEASE}"
              dpkg-query -L linux-libc-dev > /evidence/installed-paths.txt
              apt-cache policy linux-libc-dev > /evidence/apt-policy.txt
              apt-cache madison linux-libc-dev > /evidence/apt-madison.txt
              dpkg-query -W -f="${Package} ${Version} ${Architecture} ${Status}\\n" linux-libc-dev > /evidence/installed-package.txt
              find /var/lib/apt/lists -type f -name '*_Packages*' -print0 | sort -z | xargs -0 -r sha256sum > /evidence/apt-package-index-sha256.txt
              test -s /evidence/apt-package-index-sha256.txt
            '
          grep -q '^/usr/include/linux/types.h$' "$RUNNER_TEMP/kernel-evidence/installed-paths.txt"
      - name: Record reviewed upstream Linux CVE tracker revision
        run: |
          set -euo pipefail
          printf '%s\\n' "$UPSTREAM_SHA" > "$RUNNER_TEMP/kernel-evidence/upstream-commit.txt"
          echo "Reviewed immutable upstream tracker: $UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout immutable upstream Linux CVE source once
        uses: ./.github/actions/checkout-linux-vulns
        with:
          sha: ${{ env.UPSTREAM_SHA }}
          inventory: docs/assessments/dev10-kernel-cves-298.tsv
      - name: Fetch and classify all 298 upstream CVE affected paths
        run: |
          set -euo pipefail
          python3 -B scripts/audit_kernel_cve_paths.py \
            --trivy docs/assessments/dev10-kernel-cves-298.tsv \
            --vendor docs/assessments/dev10-canonical-cve-status-20261118.tsv \
            --manifest "$RUNNER_TEMP/kernel-evidence/installed-paths.txt" \
            --upstream-sha "$UPSTREAM_SHA" \
            --binary-package-version "$UBUNTU_KERNEL_RELEASE" \
            --upstream-root "$UPSTREAM_ROOT" \
            --output "$RUNNER_TEMP/kernel-evidence/affected-source-files.json"
      - name: Summarise immutable upstream CVE path evidence
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/kernel-evidence/affected-source-files.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert len(data["records"]) == int(__import__("os").environ["EXPECTED_CVE_COUNT"])
          print("### Upstream CVE affected-file evidence; security HELD")
          print("Canonical CVEs:", len(data["records"]))
          print("Upstream immutable revision:", data["upstream_commit"])
          print("Package:", data["package"])
          print("Classification counts:", data["counts"])
          print("No VEX, exception or remediation disposition is inferred.")
          PY
      - name: Retain auditable per-CVE path evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-upstream-kernel-file-path-evidence
          path: ${{ runner.temp }}/kernel-evidence/
          if-no-files-found: error
          retention-days: 30
