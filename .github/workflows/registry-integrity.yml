# ==============================================================================
# BAOBAB Dev Container — Released Registry Contract Integrity
# ==============================================================================
# A published GitHub Release advertises concrete `docker pull` directives and
# immutable digests. Those directives are a consumer contract: downstream
# Dev Containers and Codespaces must be able to resolve them for as long as the
# release is supported.
#
# This workflow independently verifies the latest stable release against GHCR:
#   1. every advertised tag still resolves;
#   2. the resolved digest still equals the digest recorded in the release;
#   3. the OCI index remains readable;
#   4. linux/amd64 and linux/arm64 image manifests are still referenced and
#      individually resolvable.
#   5. the Cosign keyless signature, SLSA provenance attestation, and SPDX
#      SBOM attestation are all still independently verifiable — not just
#      the image bytes.
#
# It runs daily and after the publish workflow completes. This is deliberately
# separate from publish.yml: publish-time verification proves correctness at
# publication time; this workflow proves durability after publication.
#
# CHECK 5 (signature/attestation durability) reuses scripts/verify-image.sh
# unchanged — the same script publish.yml itself runs right after signing —
# rather than re-implementing the cosign invocations here. ADDED 2026-09-16:
# checks 1-4 alone proved an image's BYTES stayed pullable, but said nothing
# about whether its signature/attestations stayed resolvable. Those live in
# GHCR's OCI 1.1 Referrers API, a separate code path from plain manifest/blob
# serving (see scripts/verify-image.sh's own CHANGE LOG: this API's GHCR
# support was confirmed empirically, not from documentation, precisely
# because it was uncertain) — real drift there (retention/GC behavior,
# registry-side Referrers API regressions) would leave the image pullable
# while quietly breaking every downstream consumer's own zero-trust
# verification, and checks 1-4 would report it as fully healthy. Verified
# per-ref by DIGEST (`${image}@${digest}`), not by tag, matching this
# workflow's own tag/digest-drift check above and publish.yml's own
# verification convention — a tag is a mutable pointer that could move
# between this job's digest check and its attestation check; the digest
# cannot.
# ==============================================================================

name: Verify Released GHCR Contracts

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # On the stacked PR, prove changed integrity logic against the current
  # released GHCR contract with read-only credentials.
  pull_request:
    branches:
      - main
      - feat/dev10-r4-lts-multiarch-candidate
    paths:
      - '.github/workflows/registry-integrity.yml'
      - 'scripts/verify-image.sh'
      - 'scripts/verify_release_contracts.py'
      - 'scripts/verify_registry_arch_attestations.py'
      - 'scripts/verify_signed_release_predicates.py'
      - 'scripts/verify_legacy_provenance.py'
      - 'tests/test_legacy_provenance.py'
      - 'tests/test_registry_arch_attestations.py'
      - 'tests/test_verify_release_contracts.py'
      - 'tests/test_signed_release_predicates.py'
  workflow_run:
    workflows:
      - "Publish Baobab Dev Container"
    types:
      - completed

permissions:
  contents: read
  packages: read

concurrency:
  # PR revisions must not suppress the independent daily/after-release observer.
  group: released-ghcr-contract-integrity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify-latest-stable-release:
    name: Verify latest stable release is pullable
    # A PR's validation-only Publish completion is NOT a new stable release.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      # Needed for scripts/verify-image.sh (check 5 below) — this workflow
      # previously never checked out the repo, since crane-based checks 1-4
      # need no repo files at all.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate registry governance, release-contract and signed-attestation negatives
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests/test_verify_release_contracts.py \
            tests/test_registry_arch_attestations.py \
            tests/test_signed_release_predicates.py \
            tests/test_legacy_provenance.py

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane CLI tool
        env:
          CRANE_VERSION: "0.21.9"
          CRANE_SHA256: "5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e"
        run: |
          set -euo pipefail
          ASSET="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL -o "${ASSET}" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/${ASSET}"
          echo "${CRANE_SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" crane
          chmod +x crane
          sudo mv crane /usr/local/bin/crane
          crane version

      # Same installer/pin as publish.yml's "Install Cosign CLI tool" step —
      # see that step's comment for why cosign-installer v4.x is required to
      # install cosign v3.x, and why no cosign-release: override is pinned.
      # Reuses the SAME GHCR docker credential helper docker/login-action
      # already configured above; cosign verify/verify-attestation need no
      # extra permission or secret beyond the packages: read already granted
      # job-wide — keyless verification talks to Sigstore's public
      # Fulcio/Rekor/TUF infrastructure, not GitHub, and never signs
      # anything here.
      - name: Install Cosign CLI tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Make verify-image.sh executable
        run: chmod +x scripts/verify-image.sh

      - name: Fetch latest stable GitHub Release contract
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "${RUNNER_TEMP}/release.json"
          TAG_NAME=$(jq -r '.tag_name' "${RUNNER_TEMP}/release.json")
          RELEASE_URL=$(jq -r '.html_url' "${RUNNER_TEMP}/release.json")
          jq -r '.body // ""' "${RUNNER_TEMP}/release.json" > "${RUNNER_TEMP}/release-body.md"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Unexpected latest GitHub release tag"; exit 1;
          }
          # Do not trust release.target_commitish or infer source identity.
          # Dereference the actual tag, including annotated tag objects.
          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")
          object_type=$(jq -er '.object.type' <<< "$tag_object")
          object_sha=$(jq -er '.object.sha' <<< "$tag_object")
          for depth in 1 2 3 4; do
            [[ "$object_type" != "tag" ]] && break
            tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
            object_type=$(jq -er '.object.type' <<< "$tag_object")
            object_sha=$(jq -er '.object.sha' <<< "$tag_object")
          done
          [[ "$object_type" == commit && "$object_sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Release tag does not resolve unambiguously to a commit"; exit 1;
          }
          echo "source_sha=${object_sha}" >> "$GITHUB_OUTPUT"
          echo "Verifying release ${TAG_NAME}: ${RELEASE_URL} source ${object_sha}"

      - name: Parse and require all four advertised stable-release contracts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_contracts.py \
            --release-body "$RUNNER_TEMP/release-body.md" \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-contracts.tsv"

      - name: Verify advertised tags, digests, indices, platform manifests, and attestations
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          failures=0
          mkdir -p "$RUNNER_TEMP/registry-native-evidence"

          while IFS=$'\t' read -r target ref expected_digest; do
            [[ -z "${ref}" ]] && continue
            echo "::group::Verify ${ref}"

            if ! actual_digest=$(crane digest "${ref}" 2>&1); then
              echo "::error::Release ${RELEASE_TAG} advertises ${ref}, but GHCR cannot resolve it: ${actual_digest}"
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi

            if [[ "${actual_digest}" != "${expected_digest}" ]]; then
              echo "::error::Digest drift for ${ref}: release records ${expected_digest}, GHCR resolves ${actual_digest}."
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi

            if ! manifest_json=$(crane manifest "${ref}" 2>&1); then
              echo "::error::Tag resolves but its OCI manifest cannot be read: ${ref}: ${manifest_json}"
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi

            image_name="${ref%%:*}"

            # A valid release index must have exactly one image descriptor
            # and exactly one attestation sibling for each platform.
            for arch in amd64 arm64; do
              child_count=$(jq --arg arch "$arch" \
                '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch)] | length' \
                <<<"$manifest_json")
              if [[ "$child_count" -ne 1 ]]; then
                echo "::error::$ref has $child_count linux/$arch image descriptors; expected exactly one."
                failures=$((failures + 1))
                continue
              fi
              child_digest=$(jq -r --arg arch "$arch" \
                '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
                <<<"$manifest_json")
              if [[ ! "$child_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "::error::$ref has invalid linux/$arch image digest."
                failures=$((failures + 1))
                continue
              fi
              if ! crane manifest "${image_name}@${child_digest}" >/dev/null; then
                echo "::error::$ref references missing linux/$arch child $child_digest."
                failures=$((failures + 1))
                continue
              fi
              sibling_count=$(jq --arg digest "$child_digest" \
                '[.manifests[]? | select(.annotations."vnd.docker.reference.type" == "attestation-manifest" and .annotations."vnd.docker.reference.digest" == $digest)] | length' \
                <<<"$manifest_json")
              if [[ "$sibling_count" -ne 1 ]]; then
                echo "::error::$ref has $sibling_count linux/$arch attestation siblings; expected exactly one."
                failures=$((failures + 1))
                continue
              fi
              sibling_digest=$(jq -r --arg digest "$child_digest" \
                '.manifests[] | select(.annotations."vnd.docker.reference.type" == "attestation-manifest" and .annotations."vnd.docker.reference.digest" == $digest) | .digest' \
                <<<"$manifest_json")
              if [[ ! "$sibling_digest" =~ ^sha256:[a-f0-9]{64}$ ]] ||
                 ! crane manifest "${image_name}@${sibling_digest}" >/dev/null; then
                echo "::error::$ref has missing/invalid linux/$arch attestation manifest $sibling_digest."
                failures=$((failures + 1))
                continue
              fi
              echo "linux/$arch: image $child_digest + attestation $sibling_digest (both resolvable)"
            done

            echo "tag digest: ${actual_digest} (matches release)"

            # Check 5: signature + SLSA provenance + SPDX SBOM attestation,
            # all still independently verifiable — see this file's header
            # comment for why this is a genuinely separate failure mode from
            # checks 1-4 above. Digest-pinned (image_name@actual_digest), not
            # the tag, for the same reason the earlier tag/digest check
            # exists at all. Output is captured rather than streamed live:
            # verify-image.sh's own [INFO]/[SUCCESS] lines are useful on
            # success but should not spam the log on a failure this loop
            # already reports clearly via ::error::.
            if ! verify_output=$(./scripts/verify-image.sh "${image_name}@${actual_digest}" "${RELEASE_TAG}" 2>&1); then
              echo "::error::${ref}@${actual_digest} failed signature/attestation verification (Cosign signature, SLSA provenance, or SPDX SBOM attestation no longer verifies):"
              echo "${verify_output}"
              failures=$((failures + 1))
            else
              echo "signature + attestations: VALID (Cosign signature, SLSA provenance, SPDX SBOM)"
            fi

            # Independent release-aftercare: each native architecture must
            # retain its own image, exact Git tag source revision, full
            # BuildKit SLSA/SPDX predicates and matching OIDC-signed content.
            # No image pull, tag mutation or registry write is authorised.
            if ! python3 scripts/verify_registry_arch_attestations.py \
                --image "${image_name}@${actual_digest}" \
                --tag "${RELEASE_TAG}" \
                --expected-sha "${SOURCE_SHA}" \
                --evidence "${RUNNER_TEMP}/registry-native-evidence/${target}.json"; then
              echo "::error::${ref}: dual-native signed artifact integrity failed."
              failures=$((failures + 1))
            else
              qualification=$(jq -er '.status' "${RUNNER_TEMP}/registry-native-evidence/${target}.json")
              case "$qualification" in
                STRICT_SIGNED_NATIVE_CONTENT_VERIFIED)
                  echo "both native architectures: exact SLSA/SPDX signed content and source VERIFIED" ;;
                LEGACY_SLSA_PROTOBUF_COMPATIBLE_NOT_FULL_CONTENT_EQUIVALENCE)
                  echo "::warning::${ref} pinned v1.4.4 legacy: two native signatures, schema-known SLSA, full SPDX, SOURCE and original embedded/signed SLSA fingerprints verified; not R5 full equivalence." ;;
                LEGACY_SLSA_EXACT_FINGERPRINTS_PINNED_NOT_SEMANTICALLY_EQUAL)
                  echo "::warning::${ref} pinned v1.4.4 legacy: signed and embedded SLSA full fingerprints match recorded historical evidence, two native signatures, SPDX and source verified. Schema-known SLSA projection DIFFERS; historical content equivalence is NOT claimed. R5 remains strict." ;;
                *)
                  echo "::error::Unrecognized registry attestation qualification: $qualification"
                  failures=$((failures + 1)) ;;
              esac
            fi

            echo "::endgroup::"
          done < "${RUNNER_TEMP}/release-contracts.tsv"

          if (( failures > 0 )); then
            echo "::error::${failures} released GHCR contract check(s) failed. A published release is no longer safely consumable."
            exit 1
          fi

      - name: Retain read-only native registry integrity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-native-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-native-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Write integrity summary
        if: always()
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          {
            echo "## Released GHCR Contract Integrity"
            echo
            echo "Release: [${RELEASE_TAG}](${RELEASE_URL})"
            echo
            echo "The workflow checks all four release contracts, index/image manifest reachability, immutable source revision, both signed architectures and SPDX. R5 releases require FULL exact SLSA/SPDX signed content. ONLY four pinned v1.4.4 index digests may use historical exact signed+embedded SLSA fingerprint binding, after valid independent native Cosign, subject, source and SPDX verification; any historical schema mismatch is explicitly warned, never reported as R5 full-content equivalence."
          } >> "$GITHUB_STEP_SUMMARY"
