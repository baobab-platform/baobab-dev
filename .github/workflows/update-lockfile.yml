name: DEV-10 manifest lock resolution

on:
  pull_request:
    branches: [main]
    paths: [config/versions.yaml, config/versions.lock, .python-version]
  pull_request_target:
    branches: [main]
    paths: [config/versions.yaml, config/versions.lock, .python-version]

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    if: >-
      github.repository == 'baobab-platform/baobab-dev' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository) ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: dev10-resolve-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      drift: ${{ steps.resolve.outputs.drift }}
    steps:
      - name: Check out the trusted base resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the exact PR Git object without checking out candidate code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          [[ "$(git rev-parse FETCH_HEAD)" == "$PR_HEAD" ]] || {
            echo "::error::PR head changed. The latest revision needs a fresh resolution run."
            exit 2
          }

      - name: Check that the PR changes version intent and generated files only
        id: scope
        run: |
          set -euo pipefail
          value=$(python3 -B scripts/dev10_lockfile_pr.py plan --event "$GITHUB_EVENT_PATH")
          echo "manifest_only=$value" >> "$GITHUB_OUTPUT"

      - name: Install checksum-verified yq for resolution
        if: steps.scope.outputs.manifest_only == 'true'
        env:
          YQ_BOOTSTRAP_VERSION: "4.53.3"
          YQ_BOOTSTRAP_SHA256: "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_BOOTSTRAP_VERSION}/yq_linux_amd64" \
            --output "$RUNNER_TEMP/yq"
          printf '%s  %s\n' "$YQ_BOOTSTRAP_SHA256" "$RUNNER_TEMP/yq" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Resolve the manifest against immutable upstream pins
        id: resolve
        if: steps.scope.outputs.manifest_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/dev10-resolved-locks"
          manifest="$RUNNER_TEMP/dev10-pr-manifest.yaml"
          python3 -B scripts/dev10_lockfile_pr.py stage --event "$GITHUB_EVENT_PATH" --manifest "$manifest"
          bash config/resolve.sh --manifest "$manifest" --output-dir "$resolved"
          drift=$(python3 -B scripts/dev10_lockfile_pr.py check --event "$GITHUB_EVENT_PATH" --resolved "$resolved")
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

      - name: Retain exact generated files for same-branch or maintainer writeback
        if: steps.resolve.outputs.drift == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-resolved-locks-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dev10-resolved-locks/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Explain fork handoff
        if: github.event_name == 'pull_request' && steps.resolve.outputs.drift == 'true'
        run: |
          echo 'A maintainer can take the generated files from this run into a trusted follow-up PR.' >> "$GITHUB_STEP_SUMMARY"

  writeback:
    needs: resolve
    if: github.event_name == 'pull_request_target' && needs.resolve.outputs.drift == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: dev10-lockfile-write
    concurrency:
      group: dev10-lockfile-write-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out only the trusted base writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify the immutable PR input
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          [[ "$(git rev-parse FETCH_HEAD)" == "$PR_HEAD" ]] || {
            echo "::error::PR changed. The latest head needs a fresh resolution run."
            exit 2
          }
          [[ "$(python3 -B scripts/dev10_lockfile_pr.py plan --trusted --event "$GITHUB_EVENT_PATH")" == true ]]

      - name: Download this run's resolved files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev10-resolved-locks-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dev10-resolved-locks

      - name: Require the approved lockfile GitHub App
        env:
          LOCKFILE_APP_CLIENT_ID: ${{ vars.DEV10_LOCKFILE_APP_CLIENT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$LOCKFILE_APP_CLIENT_ID" ]] || {
            echo "::error::DEV10_LOCKFILE_APP_CLIENT_ID is unavailable. Generated files are retained for a maintainer."
            exit 2
          }

      - name: Mint a repository-scoped lock writer token
        id: writer
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.DEV10_LOCKFILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV10_LOCKFILE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Append only generated files to the exact same PR branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOCKFILE_APP_TOKEN: ${{ steps.writer.outputs.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/dev10_lockfile_pr.py write --event "$GITHUB_EVENT_PATH" \
            --resolved "$RUNNER_TEMP/dev10-resolved-locks"
