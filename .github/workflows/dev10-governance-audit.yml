name: DEV-10 identity governance audit

on:
  pull_request:
    paths:
      - ".github/workflows/dev10-governance-audit.yml"
      - "scripts/audit_github_governance.py"
      - "scripts/verify_release_governance.py"
      - "scripts/github_api_transport.py"
      - "tests/test_gii14_transport_boundary.py"
      - "docs/assessments/dev10-gii12-14-governance-transport.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test governance and GitHub transport boundaries
        run: |
          python3 -B -m unittest -v \
            tests/test_gii14_transport_boundary.py tests/test_verify_release_governance.py
      - name: Observe repository governance using authenticated read-only access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/audit_github_governance.py > "$RUNNER_TEMP/dev10-governance-observation.json"
      - name: Retain sanitized governance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-governance-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev10-governance-observation.json
          if-no-files-found: error
          retention-days: 30
