# ==============================================================================
# BAOBAB Development Container
# Deploy Documentation
#
# File: .github/workflows/pages.yml
#
# PURPOSE:
#   Owns everything specific to THIS repository — trigger, path filters,
#   and deriving the pinned Python version from config/versions.yaml —
#   then delegates the generic uv+Zensical build/deploy mechanism to
#   baobab-platform/shared. See that repository's pages-zensical.yml for why
#   Python-version derivation is deliberately kept out of the shared
#   workflow.
#
# TWO-JOB SHAPE:
#   resolve-python-version runs first and calls shared's generic
#   derive-value-from-yaml composite action against THIS repo's
#   config/versions.yaml — the same targeted extraction the old inline
#   yq step did, now centrally maintained. Its output feeds the `docs`
#   job, a single `uses:` call into shared's pages-zensical.yml, which
#   expands into that workflow's own build -> deploy job graph.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Refactored onto baobab-platform/shared's pages-zensical.yml reusable workflow.
#   Build mechanics (checkout, uv, zensical build --clean, artifact
#   upload/deploy) now live centrally; only the parts genuinely specific
#   to this repository remain here.
# ==============================================================================

name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-python-version:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Shared derive-value-from-yaml reuses an existing yq, but otherwise
      # downloads a floating latest release. Install the repository's locked
      # and checksum-verified binary first so the action cannot drift.
      - name: Install locked yq
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.lock
          case "$(uname -m)" in
            x86_64)
              yq_asset="${YQ_ASSET_AMD64}"
              yq_sha256="${YQ_SHA256_AMD64}"
              ;;
            aarch64|arm64)
              yq_asset="${YQ_ASSET_ARM64}"
              yq_sha256="${YQ_SHA256_ARM64}"
              ;;
            *)
              echo "::error::Unsupported runner architecture for pinned yq: $(uname -m)" >&2
              exit 1
              ;;
          esac
          install_dir="${RUNNER_TEMP}/baobab-tools"
          mkdir -p "${install_dir}"
          yq_path="${install_dir}/yq"
          curl -fsSL -o "${yq_path}" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/${yq_asset}"
          printf '%s  %s\\n' "${yq_sha256}" "${yq_path}" | sha256sum -c -
          chmod 0755 "${yq_path}"
          "${yq_path}" --version | grep -F "version v${YQ_VERSION}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
      # Both Shared references use the v2.3.0 lightweight tag's commit,
      # verified against the GitHub tag ref on 2026-11-18: 31de2bc3dcd56128c019c640dc7e12c10ae9ca69.
      # The tag resolves directly to this commit; it is not annotated.
      - id: resolve
        uses: baobab-platform/shared/.github/actions/derive-value-from-yaml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
        with:
          manifest-path: config/versions.yaml   # TODO: adjust if this repo's manifest differs
          query: ".languages.python.version"    # TODO: adjust query path if schema differs

  docs:
    needs: resolve-python-version
    permissions:
      contents: read
      pages: write
      id-token: write
    # Same pin/rationale as resolve-python-version's step above.
    uses: baobab-platform/shared/.github/workflows/pages-zensical.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
    with:
      python-version: ${{ needs.resolve-python-version.outputs.version }}