name: DEV-10 Canonical release-tag source corroboration (read-only)
# Diagnostic proof only. No VEX, no security exception, no release privileges.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dev10-ubuntu-source.yml
      - scripts/audit_ubuntu_kernel_git_paths.py
      - scripts/audit_ubuntu_kernel_fix_history.py
      - tests/test_dev10_ubuntu_kernel_fix_history.py
      - security/evidence/dev10-ubuntu-fix-history.schema.json
      - scripts/audit_kernel_cve_paths.py
      - docs/assessments/dev10-three-cve-source-path-review-20261118.md
      - scripts/build_dev10_applicability_register.py
      - tests/test_dev10_ubuntu_kernel_source.py
      - tests/test_dev10_evidence_lock.py
      - tests/test_dev10_security_authorisation.py
      - tests/test_kernel_cve_paths.py
      - docs/assessments/dev10-kernel-cves-298.tsv
      - docs/assessments/dev10-canonical-cve-status-20261118.tsv
      - docs/security/dev10-pr74-observed-cve-inventory.md
      - security/evidence/dev10-kernel-evidence.lock.json
      - security/evidence/dev10-ubuntu-binary-evidence.lock.json
      - security/evidence/dev10-cve-applicability.schema.json
      - scripts/dev10_evidence_lock.py
      - scripts/audit_canonical_osv.py
      - tests/test_canonical_osv_evidence.py
      - .github/actions/checkout-linux-vulns/action.yml
      - scripts/ci/checkout-linux-vulns.sh
      - scripts/ci/capture-ubuntu-package-evidence.sh
      - scripts/verify_ubuntu_binary_source.py
      - tests/test_ubuntu_binary_source.py

permissions:
  contents: read

jobs:
  ubuntu-downstream-paths:
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    steps:
      - name: Checkout immutable engineering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Load and validate reviewed kernel evidence lock
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from dev10_evidence_lock import EvidenceLock; EvidenceLock.load()'
          {
            echo "UBUNTU_KERNEL_RELEASE=$(jq -r .package_version security/evidence/dev10-kernel-evidence.lock.json)"
            echo "UBUNTU_SOURCE_TAG=$(jq -r .ubuntu_tag.name security/evidence/dev10-kernel-evidence.lock.json)"
            echo "UBUNTU_TAG_COMMIT=$(jq -r .ubuntu_tag.commit security/evidence/dev10-kernel-evidence.lock.json)"
            echo "UPSTREAM_SHA=$(jq -r .upstream_cna.sha security/evidence/dev10-kernel-evidence.lock.json)"
            echo "EXPECTED_CVE_COUNT=$(jq -r .inventory.count security/evidence/dev10-kernel-evidence.lock.json)"
            echo "CANONICAL_OSV_SHA=$(jq -r .canonical_osv.commit security/evidence/dev10-kernel-evidence.lock.json)"
          } >> "$GITHUB_ENV"
      - name: Test offline Ubuntu source-path verifier
        run: |
          set -euo pipefail
          bash -n scripts/ci/checkout-linux-vulns.sh
          python3 -B -m unittest discover -s tests -p test_dev10_evidence_lock.py -v
          python3 -B -m unittest discover -s tests -p test_canonical_osv_evidence.py -v
          python3 -B -m unittest discover -s tests -p test_dev10_ubuntu_kernel_source.py -v
          python3 -B -m unittest discover -s tests -p test_dev10_ubuntu_kernel_fix_history.py -v
          python3 -B -m unittest discover -s tests -p test_ubuntu_binary_source.py -v
          python3 -B -m unittest discover -s tests -p test_kernel_cve_paths.py -v
      - name: Capture exact installed amd64 binary manifest
        run: |
          set -euo pipefail
          bash scripts/ci/capture-ubuntu-package-evidence.sh "$UBUNTU_KERNEL_RELEASE" amd64 \
            "$RUNNER_TEMP/dev10-ubuntu-source"
      - name: Verify installed Ubuntu binary-to-source package provenance
        run: |
          set -euo pipefail
          python3 -B scripts/verify_ubuntu_binary_source.py \
            --installed-package "$RUNNER_TEMP/dev10-ubuntu-source/installed-package.txt" \
            --apt-package-metadata "$RUNNER_TEMP/dev10-ubuntu-source/apt-package-metadata.txt" \
            --apt-policy "$RUNNER_TEMP/dev10-ubuntu-source/apt-policy.txt" \
            --apt-madison "$RUNNER_TEMP/dev10-ubuntu-source/apt-madison.txt" \
            --deb-sha256 "$RUNNER_TEMP/dev10-ubuntu-source/apt-package-deb-sha256.txt" \
            --index-sha256 "$RUNNER_TEMP/dev10-ubuntu-source/apt-package-index-sha256.txt" \
            --base-image "$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-base-image.txt" \
            --output "$RUNNER_TEMP/dev10-ubuntu-source/binary-source-corroboration.json"
      - name: Checkout pinned Canonical Ubuntu OSV snapshot
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canonical-ubuntu-security-notices"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/canonical/ubuntu-security-notices.git
          git -C "$root" -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=1 origin "$CANONICAL_OSV_SHA"
          # Only materialize the audited OSV blobs from the pinned tree.
          while read -r cve; do
            [[ "$cve" =~ ^CVE-[0-9]{4}-[0-9]{4,}$ ]] || exit 2
            printf '/osv/cve/%s/UBUNTU-%s.json\n' "${cve:4:4}" "$cve"
          done < <(tail -n +2 docs/assessments/dev10-kernel-cves-298.tsv | cut -f1) \
            | git -C "$root" sparse-checkout set --no-cone --stdin
          git -C "$root" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$CANONICAL_OSV_SHA"
          echo "CANONICAL_OSV_ROOT=$root" >> "$GITHUB_ENV"
      - name: Validate, digest and archive Canonical Ubuntu 26.04 OSV records
        run: |
          set -euo pipefail
          python3 -B scripts/audit_canonical_osv.py \
            --inventory docs/assessments/dev10-kernel-cves-298.tsv \
            --canonical-root "$CANONICAL_OSV_ROOT" \
            --output "$RUNNER_TEMP/dev10-ubuntu-source/canonical-osv-evidence.json"
          python3 - "$RUNNER_TEMP/dev10-ubuntu-source/canonical-osv-evidence.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["record_count"] == int(__import__("os").environ["EXPECTED_CVE_COUNT"])
          print("### Pinned Canonical OSV evidence")
          print("Snapshot commit:",data["source_commit"])
          print("Retrieved at:",data["retrieved_at"])
          print("Ubuntu 26.04 source/binary evidence:",data["counts"])
          print("No VEX or not-affected disposition inferred.")
          PY
      - name: Checkout immutable upstream Linux CVE source once
        uses: ./.github/actions/checkout-linux-vulns
        with:
          sha: ${{ env.UPSTREAM_SHA }}
          inventory: docs/assessments/dev10-kernel-cves-298.tsv
      - name: Reproduce immutable Linux CNA source paths
        run: |
          set -euo pipefail
          python3 -B scripts/audit_kernel_cve_paths.py \
            --trivy docs/assessments/dev10-kernel-cves-298.tsv \
            --vendor docs/assessments/dev10-canonical-cve-status-20261118.tsv \
            --manifest "$RUNNER_TEMP/dev10-ubuntu-source/installed-paths.txt" \
            --upstream-sha "$UPSTREAM_SHA" \
            --binary-package-version "$UBUNTU_KERNEL_RELEASE" \
            --upstream-root "$UPSTREAM_ROOT" \
            --output "$RUNNER_TEMP/dev10-ubuntu-source/affected-source-files.json"
      - name: Checkout authoritative Ubuntu 26.04 exact source release tag
        run: |
          set -euo pipefail
          git clone --depth 1 --no-checkout --filter=blob:none --single-branch \
            --branch "$UBUNTU_SOURCE_TAG" \
            https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/resolute \
            "$RUNNER_TEMP/ubuntu-linux-resolute"
          actual="$(git -C "$RUNNER_TEMP/ubuntu-linux-resolute" rev-parse --verify "refs/tags/${UBUNTU_SOURCE_TAG}^{commit}")"
          expected="$UBUNTU_TAG_COMMIT"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Ubuntu source tag commit mismatch: expected $expected, got $actual"
            exit 1
          }
      - name: Corroborate each CVE source path without inferring a fix
        run: |
          set -euo pipefail
          python3 -B scripts/audit_ubuntu_kernel_git_paths.py \
            --upstream "$RUNNER_TEMP/dev10-ubuntu-source/affected-source-files.json" \
            --ubuntu-checkout "$RUNNER_TEMP/ubuntu-linux-resolute" \
            --installed-manifest "$RUNNER_TEMP/dev10-ubuntu-source/installed-paths.txt" \
            --binary-source "$RUNNER_TEMP/dev10-ubuntu-source/binary-source-corroboration.json" \
            --expected-commit "$UBUNTU_TAG_COMMIT" \
            --output "$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-source-paths.json"
          python3 - "$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-source-paths.json" "$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-base-image.txt" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          expected=int(__import__("os").environ["EXPECTED_CVE_COUNT"])
          assert len(report["records"]) == expected
          assert report["counts"] == {"under_investigation":expected}
          print("### Ubuntu 26.04 source-tag path corroboration")
          print("Exact tag:",report["ubuntu_release_tag"])
          print("Immutable tag commit:",report["ubuntu_source_commit"])
          print("Captured binary manifest SHA-256:",report["binary_manifest"]["sha256"])
          print("Captured package:",report["binary_manifest"]["package"])
          print("Ubuntu base image:",open(sys.argv[2]).read().strip())
          print(f"All {expected} remain under investigation; fix/backport/UAPI binary analysis NOT complete.")
          PY
      - name: Materialize complete blobless Ubuntu tag history
        timeout-minutes: 25
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ubuntu-linux-resolute"
          git -C "$root" -c protocol.version=2 fetch --progress --unshallow --filter=blob:none --no-tags origin \
            "refs/tags/${UBUNTU_SOURCE_TAG}:refs/tags/${UBUNTU_SOURCE_TAG}"
          test "$(git -C "$root" rev-parse --is-shallow-repository)" = "false"
          test "$(git -C "$root" rev-parse "refs/tags/${UBUNTU_SOURCE_TAG}^{commit}")" = "$UBUNTU_TAG_COMMIT"
          echo "Complete blobless Ubuntu tag history verified at $UBUNTU_TAG_COMMIT"

      - name: Assess upstream fixes and backports against exact Ubuntu history
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-fix-history-evidence.json"
          python3 -B scripts/audit_ubuntu_kernel_fix_history.py \
            --upstream "$RUNNER_TEMP/dev10-ubuntu-source/affected-source-files.json" \
            --ubuntu-paths "$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-source-paths.json" \
            --ubuntu-checkout "$RUNNER_TEMP/ubuntu-linux-resolute" \
            --candidate-root "$RUNNER_TEMP/kernel-fix-candidate-objects" \
            --binary-source "$RUNNER_TEMP/dev10-ubuntu-source/binary-source-corroboration.json" \
            --expected-commit "$UBUNTU_TAG_COMMIT" \
            --analysis-seconds 3300 \
            --output "$output"
          python3 - "$output" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report["record_count"] == int(__import__("os").environ["EXPECTED_CVE_COUNT"])
          assert report["counts"] == {"under_investigation": int(__import__("os").environ["EXPECTED_CVE_COUNT"])}
          print("### Ubuntu upstream fix/backport history evidence")
          print("Pinned Ubuntu tag:",report["ubuntu_source"]["tag"],report["ubuntu_source"]["commit"])
          print("Complete history commits:",report["ubuntu_source"]["reachable_commit_count"])
          print("Candidate commits:",report["candidate_commit_count"])
          print("Analysis budget exhausted:",report["analysis_budget_exhausted"])
          print("Assessment counts:",report["assessment_counts"])
          print("All CVEs remain under investigation; no fix, VEX or release disposition inferred.")
          PY
          python3 -m pip install --disable-pip-version-check --no-cache-dir check-jsonschema==0.38.0
          check-jsonschema --schemafile security/evidence/dev10-ubuntu-fix-history.schema.json "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Retain digest-bound Ubuntu fix-history evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-ubuntu-fix-history-evidence
          path: |
            ${{ runner.temp }}/dev10-ubuntu-source/ubuntu-fix-history-evidence.json
            ${{ runner.temp }}/dev10-ubuntu-source/ubuntu-fix-history-evidence.json.sha256
          if-no-files-found: warn
          retention-days: 30
      - name: Join the exact upstream and Ubuntu-tag records
        run: |
          set -euo pipefail
          python3 -B scripts/build_dev10_applicability_register.py \
            --trivy docs/assessments/dev10-kernel-cves-298.tsv \
            --canonical docs/assessments/dev10-canonical-cve-status-20261118.tsv \
            --upstream "$RUNNER_TEMP/dev10-ubuntu-source/affected-source-files.json" \
            --ubuntu-patches "$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-source-paths.json" \
            --canonical-osv "$RUNNER_TEMP/dev10-ubuntu-source/canonical-osv-evidence.json" \
            --output "$RUNNER_TEMP/dev10-ubuntu-source/dev10-cve-applicability-register.json"
          python3 - "$RUNNER_TEMP/dev10-ubuntu-source/dev10-cve-applicability-register.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          expected=int(__import__("os").environ["EXPECTED_CVE_COUNT"])
          assert data["advisory_count"] == expected
          assert data["source_provenance"]["ubuntu_source_tag"] == __import__("os").environ["UBUNTU_SOURCE_TAG"]
          assert len(data["records"]) == expected
          print(f"{expected}-CVE register joined with per-CVE Ubuntu tag paths; all dispositions remain under investigation.")
          print("Ubuntu source-path correspondence counts:", data["source_provenance"]["ubuntu_source_path_counts"])
          PY
      - name: Validate final joined applicability register schema
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir check-jsonschema==0.38.0
          check-jsonschema --schemafile security/evidence/dev10-cve-applicability.schema.json \
            "$RUNNER_TEMP/dev10-ubuntu-source/dev10-cve-applicability-register.json"
      - name: Retain actual Ubuntu source path correspondence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-ubuntu-release-tag-source-evidence
          path: ${{ runner.temp }}/dev10-ubuntu-source/
          if-no-files-found: warn
          retention-days: 30
