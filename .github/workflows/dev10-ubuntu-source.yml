name: DEV-10 Canonical release-tag source corroboration (read-only)
# Diagnostic proof only. No VEX, no security exception, no release privileges.
on:
  pull_request:
    paths:
      - .github/workflows/dev10-ubuntu-source.yml
      - scripts/audit_ubuntu_kernel_git_paths.py
      - scripts/audit_kernel_cve_paths.py
      - scripts/build_dev10_applicability_register.py
      - tests/test_dev10_ubuntu_kernel_source.py

permissions:
  contents: read

jobs:
  ubuntu-downstream-paths:
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    steps:
      - name: Checkout immutable engineering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test offline Ubuntu source-path verifier
        run: python3 -B -m unittest discover -s tests -p test_dev10_ubuntu_kernel_source.py -v
      - name: Capture exact installed binary manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev10-ubuntu-source"
          docker run --rm --platform linux/amd64 ubuntu:26.04 bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -qq -y --no-install-recommends linux-libc-dev=7.0.0-42.42 >/dev/null
            test "$(dpkg-query -W linux-libc-dev | cut -f 2)" = "7.0.0-42.42"
            dpkg-query -L linux-libc-dev
          ' > "$RUNNER_TEMP/dev10-ubuntu-source/installed-paths.txt"
      - name: Reproduce immutable Linux CNA source paths
        run: |
          set -euo pipefail
          python3 -B scripts/audit_kernel_cve_paths.py \
            --trivy docs/assessments/dev10-kernel-cves.tsv \
            --vendor docs/assessments/dev10-canonical-cve-status-20261030.tsv \
            --manifest "$RUNNER_TEMP/dev10-ubuntu-source/installed-paths.txt" \
            --upstream-sha 604accad567eb6e7fb4c7fdc422470c25f35f467 \
            --output "$RUNNER_TEMP/dev10-ubuntu-source/affected-source-files.json"
      - name: Checkout authoritative Ubuntu 26.04 exact source release tag
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --single-branch \
            --branch Ubuntu-7.0.0-42.42 \
            https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/resolute \
            "$RUNNER_TEMP/ubuntu-linux-resolute"
          git -C "$RUNNER_TEMP/ubuntu-linux-resolute" rev-parse --verify 'Ubuntu-7.0.0-42.42^{commit}'
      - name: Corroborate each CVE source path without inferring a fix
        run: |
          set -euo pipefail
          python3 -B scripts/audit_ubuntu_kernel_git_paths.py \
            --upstream "$RUNNER_TEMP/dev10-ubuntu-source/affected-source-files.json" \
            --ubuntu-checkout "$RUNNER_TEMP/ubuntu-linux-resolute" \
            --installed-manifest "$RUNNER_TEMP/dev10-ubuntu-source/installed-paths.txt" \
            --output "$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-source-paths.json"
          python3 - "$RUNNER_TEMP/dev10-ubuntu-source/ubuntu-source-paths.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          assert report["counts"] == {"under_investigation":295}
          print("### Ubuntu 26.04 source-tag path corroboration")
          print("Exact tag:",report["ubuntu_release_tag"])
          print("Immutable tag commit:",report["ubuntu_source_commit"])
          print("All 295 remain under investigation; fix/backport/UAPI binary analysis NOT complete.")
          PY
      - name: Retain actual Ubuntu source path correspondence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev10-ubuntu-release-tag-source-evidence
          path: ${{ runner.temp }}/dev10-ubuntu-source/
          if-no-files-found: warn
          retention-days: 30
