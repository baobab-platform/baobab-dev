name: DEV-14 developer doctor
on:
  pull_request:
    paths:
      - 'scripts/dev14-doctor.py'
      - 'tests/test_dev14_doctor.py'
      - 'tests/test_trivy_temporary_exceptions.py'
      - '.trivyignore'
      - 'config/versions.yaml'
      - 'config/versions.lock'
      - 'docs/usage/engine-onboarding.md'
      - '.github/workflows/dev14-doctor.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/dev14-doctor.py'
      - 'tests/test_dev14_doctor.py'
      - 'tests/test_trivy_temporary_exceptions.py'
      - '.trivyignore'
      - 'config/versions.yaml'
      - 'config/versions.lock'
      - 'docs/usage/engine-onboarding.md'
      - '.github/workflows/dev14-doctor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6
        with:
          python-version: '3.14'
      - name: Test non-mutating doctor
        run: python3 -B -m unittest discover -s tests -p 'test_dev14_doctor.py' -v
      - name: Enforce expiring Trivy exceptions and patched toolchain hashes
        run: python3 -B -m unittest discover -s tests -p 'test_trivy_temporary_exceptions.py' -v
      - name: Required Rust is absent unless actually installed
        run: |
          python3 -B scripts/dev14-doctor.py --profile payments-sandbox > "$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['eng_onb_runtime_cases']=='NOT_EXECUTED'
          assert data['protected_acceptance'] is False
          assert data['production_authorized'] is False
          PY
