name: DEV-10 supplemental 41-CVE upstream and Canonical source evidence
# Read-only source evidence. No VEX, waiver, exception, or release authorization.
on:
  pull_request:
    paths:
      - .github/workflows/dev10-image-observed-cves-41.yml
      - .github/actions/checkout-linux-vulns/action.yml
      - scripts/ci/checkout-linux-vulns.sh
      - scripts/audit_kernel_cve_paths.py
      - scripts/audit_dev10_image_observed_41.py
      - docs/assessments/dev10-image-observed-cves-41.tsv
      - docs/assessments/dev10-image-observed-cves-41-canonical.tsv
      - security/evidence/dev10-image-observed-cves-41-canonical.lock.json
      - security/evidence/dev10-image-observed-cves-41-upstream.lock.json
      - tests/test_dev10_image_observed_41_sources.py

permissions:
  contents: read

jobs:
  upstream-canonical-records:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: \${{ github.sha }}
          persist-credentials: false
      - name: Validate supplemental source locks and offline tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_dev10_image_observed_41_sources.py -v
          jq -e '.record_count == 41 and .commit == "f418c1116f2ec1940e27ae4a38dbf42a0be719a8"' \
            security/evidence/dev10-image-observed-cves-41-upstream.lock.json >/dev/null
          jq -e '.source.record_count == 41 and .source.commit == "a64faad6c6b5b52353b7300d278e501c0ca75d21"' \
            security/evidence/dev10-image-observed-cves-41-canonical.lock.json >/dev/null
          echo "UPSTREAM_SHA=$(jq -r .commit security/evidence/dev10-image-observed-cves-41-upstream.lock.json)" >> "$GITHUB_ENV"
      - name: Checkout pinned Canonical Ubuntu OSV records
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canonical-ubuntu-security-notices"
          sha="$(jq -r .source.commit security/evidence/dev10-image-observed-cves-41-canonical.lock.json)"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/canonical/ubuntu-security-notices.git
          git -C "$root" -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=1 origin "$sha"
          git -C "$root" sparse-checkout init --cone
          git -C "$root" sparse-checkout set osv/cve/2026
          git -C "$root" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$sha"
          echo "CANONICAL_ROOT=$root" >> "$GITHUB_ENV"
      - name: Checkout pinned Linux CNA records
        uses: ./.github/actions/checkout-linux-vulns
        with:
          sha: \${{ env.UPSTREAM_SHA }}
          inventory: docs/assessments/dev10-image-observed-cves-41.tsv
      - name: Verify all 41 upstream paths and Canonical source-package records
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dev10-image-41-source-evidence/upstream-records"
          mkdir -p "$RUNNER_TEMP/dev10-image-41-source-evidence/canonical-records"
          python3 -B scripts/audit_dev10_image_observed_41.py \
            --inventory docs/assessments/dev10-image-observed-cves-41.tsv \
            --canonical-tsv docs/assessments/dev10-image-observed-cves-41-canonical.tsv \
            --canonical-lock security/evidence/dev10-image-observed-cves-41-canonical.lock.json \
            --upstream-root "$UPSTREAM_ROOT" \
            --canonical-root "$CANONICAL_ROOT" \
            --upstream-sha "$UPSTREAM_SHA" \
            --output "$RUNNER_TEMP/dev10-image-41-source-evidence/upstream-canonical-reconciliation.json"
          while IFS=$'\t' read -r cve _; do
            [[ "$cve" =~ ^CVE-[0-9]{4}-[0-9]{4,}$ ]] || continue
            cp "$UPSTREAM_ROOT/cve/published/\${cve:4:4}/$cve.json" \
              "$RUNNER_TEMP/dev10-image-41-source-evidence/upstream-records/$cve.json"
            cp "$CANONICAL_ROOT/osv/cve/2026/UBUNTU-$cve.json" \
              "$RUNNER_TEMP/dev10-image-41-source-evidence/canonical-records/$cve.json"
          done < docs/assessments/dev10-image-observed-cves-41.tsv
          python3 - "$RUNNER_TEMP/dev10-image-41-source-evidence/upstream-canonical-reconciliation.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["counts"]["records"] == 41
          assert data["counts"]["records_with_affected_paths"] == 41
          assert data["canonical"]["affected_version"] == "7.0.0-43.43"
          print("### Supplemental 41-CVE source evidence")
          print("Pinned Linux CNA revision:", data["upstream"]["commit"])
          print("Pinned Canonical OSV revision:", data["canonical"]["commit"])
          print("Verified records and source paths:", data["counts"])
          print("Canonical Resolute source package/version:", data["canonical"]["resolute_source_package"], data["canonical"]["affected_version"])
          print("Binary applicability, VEX and release dispositions remain under investigation.")
          PY
      - name: Retain exact 41-record source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-image-observed-41-upstream-canonical-evidence
          path: \${{ runner.temp }}/dev10-image-41-source-evidence/
          if-no-files-found: error
          retention-days: 30
