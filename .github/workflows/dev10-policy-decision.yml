name: DEV-10 policy decision contract
on:
  pull_request:
    paths:
      - "security/decisions/development/**"
      - "docs/adr/ADR-DEV10-001-reusable-development-risk-policy.md"
      - "tests/test_development_risk_decision_record.py"
      - "tests/test_provision_protected_risk_policy.py"
      - "tests/test_custody_independence.py"
      - "tests/test_protected_risk_custody.py"
      - "tests/test_audit_pr_reviewer_independence.py"
      - ".github/workflows/dev10-policy-decision.yml"
      - ".github/workflows/provision-dev10-risk-policy.yml"
      - "scripts/provision_protected_risk_policy.py"
      - "scripts/custody_independence.py"
      - "scripts/audit_pr_reviewer_independence.py"
      - "scripts/github_api_transport.py"
      - "scripts/verify_protected_risk_custody.py"
permissions:
  contents: read
  pull-requests: read
jobs:
  decision-contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Draft 2020-12 JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir check-jsonschema==0.38.0
      - name: Validate proposal and approved-form record against Draft 2020-12 schema
        run: >-
          check-jsonschema
          --schemafile security/decisions/development/foundation.schema.json
          security/decisions/development/foundation.json
          security/decisions/development/foundation.proposal.json
      - name: Validate exact inventory and negative schema fixtures
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests/test_development_risk_decision_record.py \
            tests/test_provision_protected_risk_policy.py \
            tests/test_custody_independence.py \
            tests/test_protected_risk_custody.py \
            tests/test_audit_pr_reviewer_independence.py
      - name: Validate custody GraphQL query against GitHub's live schema and response
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEV10_GRAPHQL_INTEGRATION_PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV10_GRAPHQL_INTEGRATION_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests.test_custody_independence.CompleteHistoryTests.test_live_github_graphql_schema_and_author_response
      - name: Corroborate historical decision custody and retain the live API receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/audit_pr_reviewer_independence.py --historical \
            --output "$RUNNER_TEMP/dev10-historical-custody.json"
      - name: Retain read-only exact SHA and reviewer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-historical-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev10-historical-custody.json
          if-no-files-found: error
          retention-days: 30
