# ==============================================================================
# BAOBAB Enterprise Platform — Container Publish, Attestation & Security Pipeline
# File: .github/workflows/publish.yml
#
# HIGHLIGHTS:
#   1. Actions pinned to 40-char commit SHAs (supply-chain tamper resistance).
#   2. Concurrency: cancels superseded PR/branch runs; never cancels main/tags.
#   3. Least privilege: global `contents: read`, elevated per job only.
#   4. Native Buildx SBOM (sbom: true) + SLSA provenance (provenance: true).
#   5. Trivy gates refuse new/unapproved CRITICAL/HIGH CVEs. Any residual-risk
#      decision is exact-ref, package/CVE, digest and time scoped; it is never
#      inferred from a tag family or implemented as a silent scanner ignore.
#   6. Keyless Cosign signing/attestation via GitHub OIDC — no static keys.
#      Cosign CLI v3.x since 2026-08-23 (see "Install Cosign CLI tool" below
#      for why this was a forced, non-optional major-version upgrade).
#   7. Tag-gated publish, shift-left security — see policies below.
#
# Resolve the exact checkout, then build and test each native OCI layout.
# Strict scans and independent approval precede the first GHCR write.
# A stable release may reuse an already-qualified same-source RC family.
# PRs, main pushes and main dispatches only validate. Tag publication
# uses the reviewed immutable event SHA and applies versioned tags before aliases.
#
# TRIVY CLI FLAGS (pinned TRIVY_VERSION=0.73.0):
#   `--pkg-types os,library` replaces the deprecated `--vuln-type`
#   (renamed in Trivy v0.54.0: aquasecurity/trivy#7268). `--scanners
#   vuln,secret` is explicit rather than relying on Trivy's current
#   default set. `--skip-db-update`/`--skip-java-db-update` are computed
#   dynamically by "Determine Trivy DB skip flags" (checked on disk, not
#   just cache-hit — a restore-keys prefix match populates the dir but
#   still reports cache-hit: false) because hardcoding either flag
#   breaks the very first run with "cannot be specified on the first
#   run". Vulnerability and secret scanning covers all shipped paths,
#   including Flutter engine JARs and bundled package-manager dependencies.
#   Unfixed HIGH/CRITICAL findings remain blocking; disk pressure must be
#   addressed through runner/build layout, never by removing scan coverage.
#   `--skip-version-check` drops Trivy's own unrelated, unpinned
#   "newer CLI available" network check.
#
# Registry release builds carry BuildKit SBOM and provenance. Resolve the
# exact child by platform, use it for the scan and native runtime tests, then
# pass the unchanged single-platform index to the signing and merge jobs.
#
# PERFORMANCE:
#   Trivy's vulnerability DB (~500MB+) is cached via our own SHA-pinned
#   `actions/cache` call — trivy-action's bundled `actions/cache` isn't
#   SHA-pinned, so it's rejected by the org's action-pinning policy —
#   under a single day-scoped key shared by both matrix legs and every
#   trigger: the first scan anywhere in the repo each day pays the
#   download; every later PR/branch/tag scan that day reuses the cache.
# ==============================================================================

name: Publish Baobab Dev Container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
    paths:
      - ".devcontainer/**"
      - "config/**"
      - ".python-version"
      - "scripts/**"
      - "!scripts/provision_protected_risk_policy.py"
      - "!scripts/custody_independence.py"
      - "!scripts/github_api_transport.py"
      - "tests/**"
      - ".github/workflows/publish.yml"
      # Security inventory and policy-contract changes must requalify all
      # eight profile/architecture image scans; they are not image rebuild
      # inputs, but they can change whether an image is releasable.
      - "docs/assessments/dev10-kernel-cves-298.tsv"
      - "docs/assessments/dev10-canonical-cve-status-20261118.tsv"
      - "security/evidence/**"
      - "security/decisions/development/foundation.schema.json"
      - "security/decisions/development/foundation.json"
      - "security/decisions/development/foundation.proposal.json"
      - "scripts/evaluate_protected_risk_decision.py"
      - "scripts/verify_protected_policy_hash.py"

  pull_request:
    # Run on every PR base branch. Release publication remains tag-gated in
    # the jobs below; branch-name allowlists here otherwise strand stacked
    # security integration branches when their base branch is renamed/merged.
    paths:
      - ".devcontainer/**"
      - "config/**"
      - ".python-version"
      - "scripts/**"
      - "!scripts/provision_protected_risk_policy.py"
      - "!scripts/custody_independence.py"
      - "!scripts/github_api_transport.py"
      - "tests/**"
      - ".github/workflows/publish.yml"
      # Security inventory and policy-contract changes must requalify all
      # eight profile/architecture image scans; they are not image rebuild
      # inputs, but they can change whether an image is releasable.
      - "docs/assessments/dev10-kernel-cves-298.tsv"
      - "docs/assessments/dev10-canonical-cve-status-20261118.tsv"
      - "security/evidence/**"
      - "security/decisions/development/foundation.schema.json"
      - "security/decisions/development/foundation.json"
      - "security/decisions/development/foundation.proposal.json"
      - "scripts/evaluate_protected_risk_decision.py"
      - "scripts/verify_protected_policy_hash.py"

  # Manual validation is main-only. Rebuilding an arbitrary tag in the
  # privileged dispatch context is forbidden; publishing requires a tag push.
  workflow_dispatch:

# Cancels superseded PR/branch runs to save CI time; never cancels a `main`
# or tag run, so production deploy tracks are never interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/baobab-dev

# Least-privilege default: global token rights are read-only; elevated only per job.
permissions:
  contents: read

# Explicit, not relying on GitHub's current Linux default: many `run:` steps
# in this workflow depend on Bash-specific features (arrays, `[[ ... ]]`,
# `mapfile`, process substitution, `${array[@]:1}`, `$RANDOM`) that a POSIX
# `sh` would not support.
defaults:
  run:
    shell: bash

jobs:

  # Job 1: Pre-flight immutable event commit verification.
  # Manual runs validate main only. Only a version-tag push enables
  # publishing; no dispatch input can override checkout source.
  sanity-check:
    name: Frozen Lockfile Integrity
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # GitHub review evidence and release ancestry are read-only.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      # is_release: canonical GA or numbered RC tag; security eligibility is a separate gate.
      # is_stable_release: GA tag only. Manual dispatch stays read-only.
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      is_release: ${{ steps.release-context.outputs.is_release }}
      is_stable_release: ${{ steps.release-context.outputs.is_stable_release }}
      publication_channel: ${{ steps.release-eligibility.outputs.channel }}
      contributor_ids: ${{ steps.release-eligibility.outputs.contributor_ids }}
      ubuntu_version: ${{ steps.ubuntu-base.outputs.version }}
      ubuntu_digest: ${{ steps.ubuntu-base.outputs.digest }}

    steps:
      # Resolve release status without checking out caller-selected refs.
      # GitHub sets GITHUB_SHA to the immutable event commit (PR merge SHA
      # for pull_request, tagged commit for tag push). Manual dispatch runs
      # only on main and is strictly validation-only.
      - name: Resolve release context
        id: release-context
        run: |
          set -euo pipefail

          is_stable_release() {
            local tag="$1"
            if [[ "$tag" == *-* ]]; then echo false; else echo true; fi
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error:: Manual validation is permitted only on main. Publish from a reviewed release tag push."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            # release_tag_policy.py is the single syntax/channel authority.
            # The following ancestry gate invokes it before any build job starts.
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "is_stable_release=$(is_stable_release "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_stable_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require release or RC tag commit to belong to reviewed main history
        if: steps.release-context.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 scripts/release_tag_policy.py --tag "$GITHUB_REF_NAME" >/dev/null
          python3 scripts/verify_remote_release_tag.py --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo '::error::Release tag commit is not reachable from main'; exit 1;
          }
      - name: Verify live main and release tag governance before registry access
        if: steps.release-context.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify_release_governance.py

      # Pinned + checksummed (not "latest") per this project's binary-pinning
      # convention (config/resolve.sh). CI-bootstrap tooling only — parses
      # config/versions.yaml before versions.lock exists, so intentionally
      # decoupled from YQ_VERSION in versions.lock (the yq shipped inside the
      # image itself). Bump YQ_BOOTSTRAP_VERSION/_SHA256 by hand as needed.
      - name: Install yq dependency
        env:
          YQ_BOOTSTRAP_VERSION: "4.53.3"
          YQ_BOOTSTRAP_SHA256: "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_BOOTSTRAP_VERSION}/yq_linux_amd64"
          echo "${YQ_BOOTSTRAP_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          rm -f /tmp/yq

      # Releases require a reviewed manifest/lock change or an authorized maintenance record.
      - name: DEV-10 release-family eligibility
        id: release-eligibility
        if: steps.release-context.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV10_SECURITY_APPROVER_LOGINS: ${{ vars.DEV10_SECURITY_APPROVER_LOGINS }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/tags/v*:refs/tags/v*'
          python3 scripts/release_eligibility.py --tag "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA" --source-evidence "$RUNNER_TEMP/reviewed-release-source.json" \
            > "$RUNNER_TEMP/release-eligibility.json"
          jq -er '"channel=" + .channel' "$RUNNER_TEMP/release-eligibility.json" >> "$GITHUB_OUTPUT"
          jq -c '.contributor_ids' "$RUNNER_TEMP/reviewed-release-source.json" | sed 's/^/contributor_ids=/' >> "$GITHUB_OUTPUT"

      - name: Retain exact release PR and input provenance
        if: steps.release-context.outputs.is_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-release-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-release-source.json
          if-no-files-found: error
          retention-days: 30

      - name: DEV-10 release eligibility regression tests
        run: python3 -m unittest -v tests/test_release_eligibility.py

      # Mandatory on PR, main, tag and manual validation. Run before any
      # image build/publish job can consume the sanity-check result.
      # Covers exact workflow OIDC identity, RC inference and fail-closed
      # malformed/future tag rejection without requiring live GHCR access.
      - name: DEV-10 mandatory pre-tag release matrix
        run: |
          set -euo pipefail
          python3 scripts/preflight_release_matrix.py
          python3 -m unittest -v tests/test_preflight_release_matrix.py

      - name: DEV-10 release identity preflight (positive and negative)
        run: |
          set -euo pipefail
          bash -n scripts/verify-image.sh scripts/test-verify-image-release-identity.sh
          bash scripts/test-verify-image-release-identity.sh

      - name: DEV-10 R5 negative unit tests (registry retry, RC selection, release contracts and Trivy DB freshness)
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_fetch_complete_oci_index_retry.py tests/test_select_qualified_rc_run.py tests/test_toolchain_version_pins.py tests/test_dev10_lockfile_pr.py tests/test_go_mod_download_retry.py tests/test_pnpm_release_asset_attestation.py tests/test_trivy_db_freshness.py tests/test_verify_release_contracts.py tests/test_release_artifact_contract.py tests/test_actions_artifact_containers.py tests/test_attested_release_layout.py tests/test_independent_oci_index.py tests/test_digest_security_decision.py tests/test_immutable_rc_recovery.py tests/test_verify_remote_release_tag.py tests/test_verify_image_identity.py tests/test_verify_release_environment.py tests/test_verify_release_governance.py tests/test_verify_promotion_approval.py tests/test_release_tag_policy.py tests/test_release_promotion.py tests/test_r5_release_boundaries.py tests/test_signed_release_predicates.py tests/test_legacy_provenance.py tests/test_protected_risk_decision.py tests/test_protected_local_policy.py tests/test_protected_risk_custody.py tests/test_custody_independence.py tests/test_audit_pr_reviewer_independence.py
      - name: Verify committed resolutions and upstream asset checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          : "${GH_TOKEN:?GitHub CLI requires the Actions token in GH_TOKEN}"
          chmod +x config/resolve.sh
          ./config/resolve.sh --locked

      - name: Check for lockfile drift
        id: drift-check
        run: |
          if git diff --quiet -- config/versions.lock .python-version; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on lockfile drift
        if: steps.drift-check.outputs.drift == 'true'
        run: |
          echo "::error::The committed lock or Python pin is stale on this source commit."
          echo "::error::Check DEV-10 manifest lock resolution. Forks retain both files for maintainer follow-up."
          exit 1

      - name: Verify the locked Ubuntu index contains both native architectures
        id: ubuntu-base
        run: |
          set -euo pipefail
          . config/versions.lock
          [[ "$UBUNTU_BASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "docker.io/library/ubuntu:${UBUNTU_VERSION}@sha256:${UBUNTU_BASE_SHA256}" \
            > "$RUNNER_TEMP/ubuntu-index.json"
          printf '%s  %s\n' "$UBUNTU_BASE_SHA256" "$RUNNER_TEMP/ubuntu-index.json" | sha256sum --check --strict
          jq -e '
            [.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .platform.architecture]
            | sort == ["amd64", "arm64"]
          ' "$RUNNER_TEMP/ubuntu-index.json" >/dev/null
          printf 'version=%s\ndigest=%s\n' "$UBUNTU_VERSION" "$UBUNTU_BASE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx for the read-only OCI transfer contract test
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify real BuildKit OCI export and Docker import
        if: github.event_name == 'pull_request'
        env:
          UBUNTU_VERSION: ${{ steps.ubuntu-base.outputs.version }}
          UBUNTU_BASE_SHA256: ${{ steps.ubuntu-base.outputs.digest }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/oci-transfer-probe"
          mkdir -p "$root/context"
          cat > "$root/context/Dockerfile" <<EOF
          FROM ubuntu:${UBUNTU_VERSION}@sha256:${UBUNTU_BASE_SHA256}
          ENV BAOBAB_BUILD_PROFILE=full
          LABEL org.opencontainers.image.revision=$GITHUB_SHA
          EOF
          docker buildx build --platform linux/amd64 --sbom=true --provenance=mode=max,version=v1 \
            --output "type=oci,oci-mediatypes=true,tar=false,oci-artifact=false,dest=$root/oci" \
            --metadata-file "$root/metadata.json" "$root/context"
          python3 scripts/attested_release_layout.py prepare --layout "$root/oci" \
            --target final --architecture amd64 --source "$GITHUB_SHA" \
            --lock "$(sha256sum config/versions.lock | cut -d ' ' -f1)" \
            --index "$(jq -er '."containerimage.digest"' "$root/metadata.json")" \
            --archive "$root/native.tar" --plan "$root/plan.json"
          docker load --input "$root/native.tar"
          engine_id=$(docker image inspect --format '{{.Id}}' baobab-dev:scan)
          printf 'Imported native identity %s\n' "$engine_id"
          jq -e --arg actual "$engine_id" '.config_digest == $actual or .child_digest == $actual' "$root/plan.json"

      # Retain the inputs verified on the immutable event SHA. Downstream jobs
      # use their checkout of those same bytes.
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-lockfile
          path: |
            config/versions.lock
            .python-version
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # Job 2: Multi-Arch Container Build & Vulnerability Scan Gate
  # Builds amd64/arm64 images and runs the Trivy CVE/secret gate on every
  # push and PR (see "SECURITY SCAN TRIGGER POLICY" above). Only on a
  # `v*.*.*` tag push does it also push the real image to GHCR (with SBOM +
  # SLSA provenance embedded) and smoke-test it (see "PUBLISH TRIGGER
  # POLICY" above).
  ga-reuse:
    name: Reuse qualified RC OCI digests for GA
    needs: sanity-check
    if: needs.sanity-check.outputs.publication_channel == 'ga'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      rc_run: ${{ steps.reuse.outputs.rc_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reuse immutable RC artifacts
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.sanity-check.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc" "$RUNNER_TEMP/ga"
          # Resolve the latest successful Publish run for the exact GA source
          # commit and version family. No mutable repository variable is
          # trusted to nominate an RC run.
          # Fetch every page; the selector checks total_count against the
          # combined response so a qualifying older run cannot be silently missed.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=completed&per_page=100" \
            > "$RUNNER_TEMP/publish-runs.json"
          RC_RUN=$(python3 scripts/select_qualified_rc_run.py \
            --input "$RUNNER_TEMP/publish-runs.json" --tag "$TAG" --sha "$GITHUB_SHA")
          [[ "$RC_RUN" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Could not resolve a qualified same-commit RC run"; exit 1;
          }
          echo "Reusing RC run $RC_RUN for $TAG at $GITHUB_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RC_RUN}" > "$RUNNER_TEMP/run.json"
          for target in final frontend frontend-e2e infra; do
            gh run download "$RC_RUN" --repo "$GITHUB_REPOSITORY" --name "published-info-$target" --dir "$RUNNER_TEMP/rc"
          done
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${RC_RUN}/artifacts?per_page=100" > "$RUNNER_TEMP/rc-artifact-pages.json"
          python3 scripts/verify_actions_artifact_containers.py \
            --input "$RUNNER_TEMP/rc-artifact-pages.json" --channel rc \
            --run-id "$RC_RUN" --sha "$GITHUB_SHA"
          python3 scripts/prepare_ga_reuse.py --run "$RUNNER_TEMP/run.json" --records "$RUNNER_TEMP/rc" --tag "$TAG" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ga"
          echo "rc_run=$RC_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ga-reused-candidates
          path: ${{ runner.temp }}/ga/*.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: "Build & Security Scan (${{ matrix.target }}, ${{ matrix.platform }})"
    needs: sanity-check
    if: needs.sanity-check.outputs.is_release != 'true'

    # RATIONALE: Route arm64 builds to native ARM GitHub-hosted runners for faster performance.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 120

    permissions:
      contents: read
      pull-requests: read

    # TIER 1 (baobab-dev-v1_1_0-release-plan-amended.md tasks 1.9/1.10;
    # ADR-0001): build and Trivy-scan every Dockerfile target on every
    # trigger, exactly as `final` already was. `infra` (2026-09-03,
    # baobab-platform/infrastructure local development + testing proposal) joined
    # the matrix directly at TIER 2 — publishing for real from day one —
    # rather than repeating a separate build-only proving period, since its
    # stage reuses patterns (checksummed binary install, profile-gated
    # verify.sh, leaf stage off `base`) already validated by `frontend`'s
    # own Tier 1 -> Tier 2 rollout.
    # This runs 4 targets × 2 platforms on every PR/push — an accepted,
    # disclosed cost of validating every stage continuously rather than
    # only at publish time.
    strategy:
      fail-fast: false
      matrix:
        target:
          - final
          - frontend
          - frontend-e2e
          - infra
        platform:
          - linux/amd64
          - linux/arm64

    # Read directly by the trivy binary (every Trivy flag has a
    # TRIVY_<FLAG> env equivalent). Set once here so "Cache Trivy
    # vulnerability database" and `trivy image` agree on the same path.
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Free disk space (final target only)
      # `final` is the only target combining Python+Node+Flutter+Java+Maven+
      # Docker CLI — by far the largest image this job builds — and Trivy
      # also pulls its own ~922MB Java DB on top of it. Standard
      # GitHub-hosted runners repeatedly hit "disk quota exceeded" around
      # the Trivy scan step on this target specifically — confirmed
      # reproducible via baobab-platform/baobab-dev#31's CI across five independent
      # runs (both linux/amd64 and linux/arm64), never a real build or CVE
      # regression. The biggest single contributor — a second, fully
      # daemon-loaded copy of `final` for scanning — is eliminated
      # separately (see "Build local single-manifest image for scanning"
      # below, which scans `final` from an OCI tarball instead of
      # `load: true`); this step remains as an additional, cheap margin of
      # safety. frontend/frontend-e2e/infra never hit this — they don't
      # carry Flutter's Android engine artifacts or the JDK/Maven install,
      # so this step is gated to `final` only rather than slowing down
      # every matrix leg. Removes preinstalled runner toolchains this build
      # never uses (Android SDK, .NET, GHC, CodeQL bundles) — the standard
      # community pattern for GitHub-hosted runners' disk-space constraints
      # on large multi-stage Docker builds.
      - name: Free disk space (final target only)
        if: matrix.target == 'final'
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # - name: Setup QEMU Emulation
      # uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Setup Docker Buildx Engine
        id: local-builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # DEV-10 R5: read-only validation. Registry credentials and digest
      # publication are moved to a separate privileged tag-only job.
      - name: Extract OCI Metadata & Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Keep the largest native image as a Docker archive until Trivy finishes.
      # Loading it later, after freeing this job's builder cache, reuses the same build.
      - name: Build local single-manifest image for scanning
        id: build-local-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            UBUNTU_VERSION=${{ needs.sanity-check.outputs.ubuntu_version }}
            UBUNTU_BASE_SHA256=${{ needs.sanity-check.outputs.ubuntu_digest }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: baobab-dev:scan
          outputs: ${{ matrix.target == 'final' && format('type=docker,dest={0}/scan-image-final.tar', runner.temp) || 'type=docker' }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          # PRs only restore caches. Publish target layers once, on main,
          # so eight PR workers cannot exhaust the repository cache budget.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,mode=min,scope={0}-{1},ignore-error=true', matrix.target, matrix.platform) || '' }}

      # Cache Trivy vulnerability database
      # Trivy re-downloads its ~500MB+ DB on every scan by default.
      # trivy-action's own bundled `actions/cache` isn't SHA-pinned (fails
      # the org's action-pinning policy), so this uses our own SHA-pinned
      # `actions/cache` call instead. One day-scoped key
      # (`cache-trivy-<date>`, `cache-trivy-` restore-key prefix) is shared
      # across BOTH matrix legs AND every trigger (PR/branch/tag) — the DB
      # isn't architecture-specific, so whichever leg or trigger runs first
      # each day populates the cache everything else that day reuses.
      - name: Determine cache date
        id: cache-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: cache-trivy-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            cache-trivy-

      # DEV-10 R5: restored caches are a performance optimisation, not security freshness.
      # Both DBs must be updated independently and their timestamps validated.
      # Security Vulnerability Gate (Trivy)
      # Scans for OS/library CVEs; exits 1 on unpatched HIGH/CRITICAL,
      # blocking publish. Installed via a direct checksummed download
      # rather than aquasecurity/trivy-action: that composite action calls
      # aquasecurity/setup-trivy and actions/cache pinned by TAG in its own
      # source — outside this file's control, and rejected by the org's
      # "actions pinned to full commit SHA" policy transitively (confirmed
      # via a real failed run). A plain `run:` step has no `uses:` for that
      # policy to reject, and matches the checksummed-download pattern used
      # throughout this project. SHA256s below are from Trivy's own
      # checksums.txt (GitHub's release-asset digest API was rate-limited
      # at verification time; live-verified via a full download+sha256sum).
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.73.0"
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux/amd64) ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"; SHA256="2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b" ;;
            linux/arm64) ASSET="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"; SHA256="13833d97e8a1a5367471c372a173180157f593bece570e20d5d925fef552f5dd" ;;
            *) echo "::error::Unsupported platform ${{ matrix.platform }} for Trivy install"; exit 1 ;;
          esac

          curl -fsSL -o "${ASSET}" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" trivy
          chmod +x trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Refresh and validate Trivy vulnerability and Java databases
        run: |
          set -euo pipefail
          trivy image --download-db-only
          trivy image --download-java-db-only
          python3 scripts/verify_trivy_db_freshness.py \
            --cache "$TRIVY_CACHE_DIR" \
            --evidence "$RUNNER_TEMP/trivy-db-freshness.json"

      # Trivy reads the largest profile from its Docker archive.
      - name: Scan built container with Trivy
        id: trivy-scan
        env:
          TRUSTED_POLICY_SHA: ${{ vars.DEV10_PROTECTED_DECISION_SHA256 }}
          TRUSTED_APPROVERS: ${{ vars.DEV10_SECURITY_APPROVER_LOGINS }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || (github.event_name == 'push' && github.repository) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Retain only sanitized report evidence. The raw report may contain
          # secret matches and stays on the runner.
          REPORT_DIR="${RUNNER_TEMP}/trivy-evidence"
          mkdir -p "${REPORT_DIR}"
          if [[ "${{ matrix.target }}" == "final" ]]; then
            SCAN_TAR="$RUNNER_TEMP/scan-image-final.tar"
            sha256sum "$SCAN_TAR" > "$REPORT_DIR/image-archive.sha256"
            SCAN_SOURCE_ARGS=(--input "$SCAN_TAR")
            IMAGE_IDENTITY_ARGS=(--archive-sha256 "$(cut -d ' ' -f1 "$REPORT_DIR/image-archive.sha256")")
          else
            image_config_digest=$(docker image inspect --format '{{.Id}}' baobab-dev:scan)
            printf '%s\n' "$image_config_digest" > "$REPORT_DIR/image-config-digest.txt"
            SCAN_SOURCE_ARGS=(--image-src docker baobab-dev:scan)
            IMAGE_IDENTITY_ARGS=(--image-config-digest "$image_config_digest")
          fi
          set +e
          trivy image \
            --scanners vuln,secret \
            --skip-db-update --skip-java-db-update \
            --ignorefile /dev/null \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --exit-code 42 \
            --skip-version-check \
            --format json \
            --output "${RUNNER_TEMP}/trivy-raw.json" \
            "${SCAN_SOURCE_ARGS[@]}"
          scan_rc=$?
          set -e

          python3 scripts/dev10_development_scan.py \
            --report "${RUNNER_TEMP}/trivy-raw.json" --scan-exit-code "$scan_rc" \
            --evidence-dir "$REPORT_DIR" --profile "${{ matrix.target }}" --architecture "${{ matrix.platform }}" \
            "${IMAGE_IDENTITY_ARGS[@]}"

      - name: Retain unfiltered Trivy vulnerability evidence
        if: ${{ always() && steps.trivy-scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.target }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trivy-evidence/
            ${{ runner.temp }}/trivy-db-freshness.json
          if-no-files-found: error
          retention-days: 30

      - name: Load the scanned final archive for runtime verification
        if: ${{ !cancelled() && steps.build-local-image.outcome == 'success' && matrix.target == 'final' }}
        env:
          BUILDER: ${{ steps.local-builder.outputs.name }}
        run: |
          set -euo pipefail
          : "${BUILDER:?expected the dedicated job builder}"
          docker buildx prune --builder "$BUILDER" --all --force
          sha256sum --check --strict "$RUNNER_TEMP/trivy-evidence/image-archive.sha256"
          docker load --input "$RUNNER_TEMP/scan-image-final.tar"
          rm -f "$RUNNER_TEMP/scan-image-final.tar"

      - name: Qualify the scanned image on the native runner
        id: native-qualification
        if: ${{ !cancelled() && steps.build-local-image.outcome == 'success' }}
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == final ]]; then
            read -r SCAN_ARCHIVE_SHA256 _ < "$RUNNER_TEMP/trivy-evidence/image-archive.sha256"
            export SCAN_ARCHIVE_SHA256
          else
            read -r EXPECTED_CONFIG_DIGEST < "$RUNNER_TEMP/trivy-evidence/image-config-digest.txt"
            export EXPECTED_CONFIG_DIGEST
          fi
          bash scripts/ci/qualify-native-image.sh baobab-dev:scan "$TARGET" "$PLATFORM" "$RUNNER_TEMP/native-image"

      - name: Retain native runtime and package evidence
        if: ${{ !cancelled() && (steps.native-qualification.outcome == 'success' || steps.native-qualification.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-image-${{ matrix.target }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/native-image/
          if-no-files-found: ignore
          retention-days: 30

  # This tag-only job builds once per native platform and owns candidate
  # digest uploads. All eight legs must pass before signing and promotion.
  release-digests:
    name: "Qualify attested release image (${{ matrix.target }}, ${{ matrix.platform }})"
    needs: sanity-check
    if: needs.sanity-check.outputs.is_release == 'true' && github.run_attempt == 1 && (needs.sanity-check.outputs.publication_channel == 'rc' || needs.sanity-check.outputs.publication_channel == 'ga-direct')
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 140
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [final, frontend, frontend-e2e, infra]
        platform: [linux/amd64, linux/arm64]
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      
      - name: Free disk space (final release target only)
        if: ${{ matrix.target == 'final' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk space before cleanup:"
          df -h /

          # Remove unused preinstalled runner toolchains.
          # The release build supplies its own toolchain.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          echo "Disk space after cleanup:"
          df -h /

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract OCI Metadata & Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Capture pre-build resource usage
        if: ${{ matrix.target == 'final' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-resource-evidence"

          {
            echo "=== BEFORE BUILD ==="
            date -u

            echo "=== Disk ==="
            df -h /

            echo "=== Inodes ==="
            df -i /

            echo "=== Memory ==="
            free -h

            echo "=== Docker storage ==="
            docker system df -v || true

            echo "=== BuildKit cache ==="
            docker buildx du || true
          } > "$RUNNER_TEMP/release-resource-evidence/before.txt" 2>&1

          cat "$RUNNER_TEMP/release-resource-evidence/before.txt"

      - name: Build container image with SBOM & SLSA Provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./.devcontainer/docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            UBUNTU_VERSION=${{ needs.sanity-check.outputs.ubuntu_version }}
            UBUNTU_BASE_SHA256=${{ needs.sanity-check.outputs.ubuntu_digest }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,oci-mediatypes=true,tar=false,oci-artifact=false,dest=${{ runner.temp }}/release-layout
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          # Reuse main's cache. The digest build does not export it again.
          sbom: true
          # Instruct BuildKit to emit SLSA v1.0 schema inside the in-toto predicate
          provenance: mode=max,version=v1

      
      - name: Capture post-build resource usage
        if: ${{ always() && matrix.target == 'final' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-resource-evidence"

          {
            echo "=== AFTER BUILD ==="
            date -u

            echo "=== Disk ==="
            df -h /

            echo "=== Inodes ==="
            df -i /

            echo "=== Memory ==="
            free -h

            echo "=== Docker storage ==="
            docker system df -v || true

            echo "=== BuildKit cache ==="
            docker buildx du || true
          } > "$RUNNER_TEMP/release-resource-evidence/after.txt" 2>&1

          cat "$RUNNER_TEMP/release-resource-evidence/after.txt"

      - name: Upload release resource diagnostics
        if: ${{ always() && matrix.target == 'final' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-resources-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-resource-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Determine cache date
        id: cache-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: cache-trivy-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            cache-trivy-

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.73.0"
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux/amd64) ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"; SHA256="2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b" ;;
            linux/arm64) ASSET="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"; SHA256="13833d97e8a1a5367471c372a173180157f593bece570e20d5d925fef552f5dd" ;;
            *) echo "::error::Unsupported platform ${{ matrix.platform }} for Trivy install"; exit 1 ;;
          esac

          curl -fsSL -o "${ASSET}" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" trivy
          chmod +x trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Refresh and validate Trivy vulnerability and Java databases
        run: |
          set -euo pipefail
          trivy image --download-db-only
          trivy image --download-java-db-only
          python3 scripts/verify_trivy_db_freshness.py \
            --cache "$TRIVY_CACHE_DIR" \
            --evidence "$RUNNER_TEMP/trivy-db-freshness.json"

      - name: Verify the native OCI child and prepare its local scan archive
        id: exact
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # The local OCI layout survives cleaning the job's dedicated builder.
          docker buildx prune --all --force
          python3 scripts/attested_release_layout.py prepare --layout "$RUNNER_TEMP/release-layout" \
            --target "$TARGET" --architecture "${PLATFORM#linux/}" --source "$GITHUB_SHA" \
            --lock "$(sha256sum config/versions.lock | cut -d ' ' -f1)" --index "$INDEX_DIGEST" \
            --archive "$RUNNER_TEMP/release-native.tar" --plan "$RUNNER_TEMP/release-native-plan.json"

      - name: Scan unfiltered exact native OCI child
        id: exact-trivy
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/trivy-exact-evidence"
          mkdir -p "$evidence"
          set +e
          trivy image --input "$RUNNER_TEMP/release-native.tar" \
            --scanners vuln,secret --skip-db-update --skip-java-db-update \
            --ignorefile /dev/null --pkg-types os,library --severity CRITICAL,HIGH \
            --exit-code 1 --skip-version-check --format json \
            --output "$RUNNER_TEMP/trivy-exact-raw.json"
          rc=$?
          set -e
          if (( rc > 1 )); then
            echo "::error::Trivy failed to scan the exact OCI child (rc=$rc)"
            exit "$rc"
          fi
          python3 scripts/summarize-trivy-vulnerabilities.py \
            "$RUNNER_TEMP/trivy-exact-raw.json" "$evidence/findings.json" "$TARGET" "$PLATFORM"
          if (( rc != 0 )); then
            echo "::error::The native OCI child has residual release-blocking findings; development-only acceptance is insufficient."
            exit 1
          fi

      - name: Qualify the exact scanned OCI child on the native runner
        id: native-qualification
        if: ${{ !cancelled() && steps.exact.outcome == 'success' }}
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          export EXPECTED_CONFIG_DIGEST="$(jq -er '.config_digest' "$RUNNER_TEMP/release-native-plan.json")"
          export EXPECTED_NATIVE_MANIFEST_DIGEST="$(jq -er '.child_digest' "$RUNNER_TEMP/release-native-plan.json")"
          export SCAN_ARCHIVE_SHA256="$(sha256sum "$RUNNER_TEMP/release-native.tar" | cut -d ' ' -f1)"
          docker load --input "$RUNNER_TEMP/release-native.tar"
          bash scripts/ci/qualify-native-image.sh baobab-dev:scan "$TARGET" "$PLATFORM" "$RUNNER_TEMP/native-image"

      - name: Bind clean security and native runtime evidence to the built OCI layout
        run: |
          set -euo pipefail
          python3 scripts/attested_release_layout.py qualify --layout "$RUNNER_TEMP/release-layout" \
            --plan "$RUNNER_TEMP/release-native-plan.json" --archive "$RUNNER_TEMP/release-native.tar" \
            --runtime "$RUNNER_TEMP/native-image/native-image.json" --scan "$RUNNER_TEMP/trivy-exact-raw.json" \
            --scanner-version "$(trivy --version | sed -n 's/^Version: //p' | head -1)"

      - name: Retain qualified OCI layout for protected publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-layout-${{ matrix.target }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-layout/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Retain native runtime and sanitized release scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-release-${{ matrix.target }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-layout/qualification.json
            ${{ runner.temp }}/native-image/
            ${{ runner.temp }}/trivy-exact-evidence/
            ${{ runner.temp }}/trivy-db-freshness.json
          if-no-files-found: warn
          retention-days: 30

  authorize-publish:
    name: Authorize first registry write for the complete image family
    needs: [release-digests, sanity-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: dev10-release-promotion
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse promotion until independently protected environment is configured
        env:
          POLICY_READY: ${{ vars.DEV10_R5_PROMOTION_APPROVED }}
        run: |
          set -euo pipefail
          [[ "$POLICY_READY" == 'true' ]] || {
            echo '::error::DEV-10 R5 promotion policy not configured. The dev10-release-promotion environment must have independent reviewers/tag restrictions and DEV10_R5_PROMOTION_APPROVED=true.';
            exit 1;
          }
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck tag and branch governance after the deployment approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/verify_remote_release_tag.py --tag "$RELEASE_TAG" --sha "$GITHUB_SHA"
          python3 scripts/verify_release_governance.py

      - name: Verify actual independent GitHub Environment approval policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/dev10-release-promotion" > "$RUNNER_TEMP/promotion-environment.json"
          gh api "repos/${GITHUB_REPOSITORY}/environments/dev10-release-promotion/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/promotion-deployment-policies.json"
          python3 scripts/verify_release_environment.py \
            --environment "$RUNNER_TEMP/promotion-environment.json" \
            --policies "$RUNNER_TEMP/promotion-deployment-policies.json" \
            --tag "$RELEASE_TAG" > "$RUNNER_TEMP/verified-release-environment.json"

      - name: Capture independent deployment approval evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
          ORIGINAL_ACTOR_LOGIN: ${{ github.actor }}
          ORIGINAL_ACTOR_ID: ${{ github.actor_id }}
          SOURCE_CONTRIBUTORS: ${{ needs.sanity-check.outputs.contributor_ids }}
        run: |
          set -euo pipefail
          python3 scripts/verify_promotion_approval.py \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" --actor "$ORIGINAL_ACTOR_LOGIN" \
            --actor-id "$ORIGINAL_ACTOR_ID" --tag "$RELEASE_TAG" \
            --environment-evidence "$RUNNER_TEMP/verified-release-environment.json" --contributors "$SOURCE_CONTRIBUTORS" \
            --output "$RUNNER_TEMP/r5-promotion-evidence/approval.json"

      - name: Verify custody of all eight qualified native layout artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/qualified-layouts.json"
          python3 scripts/verify_actions_artifact_containers.py --input "$RUNNER_TEMP/qualified-layouts.json" \
            --channel native --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" \
            > "$RUNNER_TEMP/r5-promotion-evidence/qualified-layouts.json"

      - name: Retain the pre-publication authorization
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-registry-write-approval
          path: ${{ runner.temp }}/r5-promotion-evidence/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: "Publish Multi-Arch Manifest & Cosign Sign (${{ matrix.target }})"
    needs: [authorize-publish, sanity-check]
    if: needs.sanity-check.outputs.is_release == 'true' && github.run_attempt == 1 && (needs.sanity-check.outputs.publication_channel == 'rc' || needs.sanity-check.outputs.publication_channel == 'ga-direct')

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # TIER 2 (baobab-dev-v1_1_0-release-plan-amended.md; ADR-0001): matrix
    # over target instead of a single final-only run. All three targets
    # publish now — final+frontend proved this split on tag v1.1.0;
    # frontend-e2e completes it in this pass. `infra` joins the matrix
    # 2026-09-03 (baobab-platform/infrastructure local development + testing
    # proposal) — no other change needed in this job: the tag-suffix logic
    # in "Extract Docker tagging metadata" below and the "Container Smoke
    # Test (frontend / frontend-e2e — local scan image)" step in the build
    # job above are both already written generically for "any non-final
    # target", not enumerated per target. GitHub Release creation was
    # REMOVED from this job entirely and moved to a new `release` job
    # below: with matrix legs running in parallel, each independently
    # creating/publishing "the" release for this tag would race — multiple
    # legs concurrently calling `gh release edit --draft=false` on the same
    # tag is a real correctness bug, not a style concern. This job now only
    # publishes its own target's image and exports what the `release` job
    # needs to build one combined release afterward.
    strategy:
      fail-fast: false
      matrix:
        target:
          - final
          - frontend
          - frontend-e2e
          - infra

    # contents: write REMOVED — this job no longer creates the GitHub
    # Release (see note above). packages: write — publish the multi-arch
    # OCI index. id-token: write — CRITICAL for keyless Cosign signing via
    # GitHub OIDC.
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RC metadata produces only exact version tags; major/minor/latest are
      # GA aliases and may not be accidentally bound to an RC.
      # Only semver + `latest` patterns are needed: this job's `if:` above
      # already guarantees a `v*.*.*` tag, so branch/sha tag types would
      # never match, and `latest`'s `enable:` needs no extra tag-ref guard.

      # FIX: publish job previously had no Buildx setup, relying on the runner's older bundled buildx CLI for imagetools create/inspect — the likely cause of missing provenance in the merged index.
      - name: Setup Docker Buildx Engine
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # FIX (found via a live, reproducible failure — not caught by the
      # earlier verification): `flavor.suffix` correctly applies to the
      # EXPLICIT `type=raw,value=latest` rule below, as verified earlier —
      # but docker/metadata-action ALSO generates its own SEPARATE,
      # IMPLICIT auto-latest tag by default, independent of that rule, and
      # `suffix` does NOT apply to it unless `onlatest=true` is set. Never
      # explicitly disabling that implicit tag (via `latest=false`) meant
      # BOTH fired for every non-final target: the correct
      # `latest-<target>` from the explicit rule, AND an accidental bare
      # `latest` from the implicit one — so `final` and every other target
      # were all concurrently pushing to the SAME `ghcr.io/.../baobab-dev:
      # latest` tag in parallel matrix legs. This is a genuine, 100%-
      # reproducible race condition, not a timing issue — confirmed by two
      # consecutive full-retry-exhaustion failures with real backoff delays
      # that changed nothing, which is exactly what a real collision looks
      # like versus a transient one. `latest=false` disables the implicit
      # tag entirely; only the explicit, correctly-suffixed rule produces a
      # `latest` tag now.
      # crane (google/go-containerregistry) fetches raw OCI blobs by digest
      # and constructs OCI indices with full manual control — buildx has no
      # equivalent for either. MOVED earlier in this job (was originally
      # installed just before the provenance-extraction step, where it was
      # first needed for `crane blob`) because Option B (below) now needs
      # it for the manifest-merge step too, not just extraction.
      - name: Install crane CLI tool
        env:
          CRANE_VERSION: "0.21.9"
          CRANE_SHA256: "5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e"
        run: |
          set -euo pipefail
          ASSET="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL -o "${ASSET}" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/${ASSET}"
          echo "${CRANE_SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" crane
          chmod +x crane
          sudo mv crane /usr/local/bin/crane
          crane version

      # EXTRACTED (2026-08-28): the retry-and-verify loop both extraction
      # steps below need is now scripts/fetch-complete-oci-index.sh — see
      # that script's header for the full rationale. Made executable once
      # here since both steps use it.
      - name: Make fetch-complete-oci-index.sh executable
        run: chmod +x scripts/fetch-complete-oci-index.sh

      - name: Extract Docker tagging metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The `final` target must publish bare version tags (1.4.3, 1.4,
          # 1, latest) as the shared development-environment contract's
          # full-profile image_tag_pattern requires. `cond && '' || x` can
          # never yield '' in a GitHub expression ('' is falsy, so it falls
          # through to x), which tagged `final` as 1.4.3-final instead;
          # put the empty string in the fallback position.
          flavor: |
            latest=false
            suffix=${{ matrix.target != 'final' && format('-{0}', matrix.target) || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.sanity-check.outputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.sanity-check.outputs.release_tag }},enable=${{ needs.sanity-check.outputs.is_stable_release == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.sanity-check.outputs.release_tag }},enable=${{ needs.sanity-check.outputs.is_stable_release == 'true' }}
            type=raw,value=latest,enable=${{ needs.sanity-check.outputs.is_stable_release == 'true' }}

      - name: Refuse a direct build if the exact version tag already exists
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
        run: |
          set -euo pipefail
          suffix=""
          [[ "$TARGET" == final ]] || suffix="-$TARGET"
          image="${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG#v}$suffix"
          if existing=$(crane digest "$image" 2> "$RUNNER_TEMP/existing-tag.err"); then
            echo "::error::Version tag $image already resolves to $existing; require independent provenance and authorization readback."
            exit 1
          fi
          grep -Eq 'MANIFEST_UNKNOWN:|404 Not Found.*manifest unknown' "$RUNNER_TEMP/existing-tag.err" || {
            echo "::error::Unable to establish absence of the exact version tag."; exit 1;
          }

      - name: Download prequalified amd64 OCI bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release-layout
          name: release-layout-${{ matrix.target }}-amd64-${{ github.run_attempt }}
      - name: Transfer prequalified amd64 OCI bytes by immutable digest
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/ci/transfer-release-layout.sh "$TARGET" amd64

      - name: Download prequalified arm64 OCI bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release-layout
          name: release-layout-${{ matrix.target }}-arm64-${{ github.run_attempt }}
      - name: Transfer prequalified arm64 OCI bytes by immutable digest
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/ci/transfer-release-layout.sh "$TARGET" arm64

      # ------------------------------------------------------------------
      # Merge per-architecture digests into a unified multi-arch OCI index
      # ------------------------------------------------------------------
      # OPTION B — replaces `docker buildx imagetools create`, which has a
      # documented gap (docker/buildx#3433: "individual image manifests...
      # dropped their related attestation manifests") dropping the
      # attestation-manifest sibling for at least one platform when merging
      # attestation-bearing index sources. Confirmed live against this
      # exact pipeline: consistently linux/amd64, never linux/arm64, across
      # three separate publish runs of the `frontend` target. Option A
      # (exporting flat manifest digests instead, to route through buildx's
      # referrers-API attestation-rediscovery path) was tried first and
      # made things WORSE — 100% of legs failed instead of ~50% — ruling
      # that path out entirely rather than just this specific symptom.
      #
      # `crane index append`'s `--flatten` defaults to true: since each
      # `-m` source here is itself a 2-entry index (image manifest +
      # attestation manifest, from the single-platform sbom/provenance-
      # enabled push — see the build job's digest-export comment),
      # `--flatten` means crane appends BOTH children of each source index
      # into the new combined index, not the source index as one opaque
      # entry. This is full manual control over the merge, independent of
      # whatever internal buildx heuristic was dropping amd64's
      # attestation — verified against go-containerregistry's own
      # documented usage (cmd/crane/doc/crane_index_append.md), not
      # inferred from buildx behavior this time.
      #
      # Only the PRIMARY tag is created via `index append` (which does the
      # actual content push); every other tag (major.minor, major, latest)
      # is applied afterward via `crane tag`, which retags an existing
      # digest without re-uploading any content — far cheaper than
      # re-running `index append` once per tag.
      - name: Publish multi-architecture OCI manifest
        id: create-manifest
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          # nullglob: without it, a glob that matches ZERO files leaves the
          # literal unexpanded pattern string as the array's sole element,
          # so ${#DIGEST_FILES[@]} reports 1 even when the real count is 0.
          # Confirmed live (v1.2.5-rc.5): a broken "Download digests"
          # pattern (see that step's comment) downloaded 0 real files for
          # every target, but this check reported "found 1" for all three —
          # masking a complete match failure as a subtler off-by-one and
          # sending investigation in the wrong direction. Also tightened to
          # an exact count: 2 is the only valid outcome (amd64 + arm64,
          # never more, never fewer), so `-ne 2` catches an over-match too,
          # not just an under-match.
          shopt -s nullglob
          DIGEST_FILES=("${{ runner.temp }}/digests"/*)

          # Guard against a silently incomplete manifest: fail loudly rather
          # than publishing a "multi-arch" image that only actually supports
          # one architecture.
          if [[ ${#DIGEST_FILES[@]} -ne 2 ]]; then
            echo "::error:: Expected exactly 2 architecture digests (amd64 + arm64), found ${#DIGEST_FILES[@]}."
            echo "::error:: Check the 'build' job's per-platform 'Upload digest' steps, and this job's 'Download digests' step's pattern."
            exit 1
          fi

          DIGEST_ARGS=()
          for f in "${DIGEST_FILES[@]}"; do
            DIGEST_ARGS+=(-m "${IMG}@sha256:$(basename "$f")")
          done

          mapfile -t ALL_TAGS < <(echo "${TAGS_JSON}" | jq -r '.tags[]')

          if [[ ${#ALL_TAGS[@]} -eq 0 ]]; then
            echo "::error:: docker/metadata-action produced zero tags — nothing to publish."
            exit 1
          fi

          # R5: this unique run/target candidate name is NOT a GA version tag.
          # Finish every Cosign signature and per-arch attestation first.
          # The separate, protected `promote` job applies consumer tags only
          # after *all four* publish-matrix legs succeed.
          CANDIDATE_TAG="${IMG}:r5-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target }}"
          crane index append "${DIGEST_ARGS[@]}" -t "${CANDIDATE_TAG}"
          DIGEST=$(crane digest "${CANDIDATE_TAG}")
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Invalid candidate digest"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "::notice::Quarantined candidate index ${CANDIDATE_TAG} -> ${DIGEST}; consumer tags not applied"

      # DEBUG: confirms the attestation-manifest siblings survived crane's merge, for both platforms this time.
      - name: Debug — inspect merged manifest before extracting provenance
        if: vars.BAOBAB_PUBLISH_DEBUG == 'true'
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          echo "::group::Full crane manifest of merged index"
          crane manifest "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" | jq '.'
          echo "::endgroup::"

      # Extract per-platform SLSA provenance predicates
      # BuildKit already computed a full, genuine SLSA v1 predicate per
      # platform in the `build` job (`provenance: true`); it's embedded,
      # unsigned, in the OCI index `crane index append` just merged (see
      # that step's comment for why crane replaced `imagetools create`).
      # This step extracts exactly that — no new content invented — so the
      # "Attest container image provenance" step below signs REAL build
      # data. cosign has no visibility into BuildKit's native embedded
      # attestation (different OCI convention than cosign's own
      # `sha256-<digest>.att`; `cosign download attestation` 404s against
      # it), so reading the raw index manually is the only way to hand
      # that content to cosign. Provenance is keyed per-platform, hence two
      # predicate files and two DSSE statements attested against the same
      # multi-arch digest (cosign appends rather than overwrites, so both
      # coexist and either satisfies scripts/verify-image.sh's check).
      # REWRITTEN: buildx's convenience `.Provenance` map came back empty
      # for BOTH platforms after `imagetools create` (a known gap in that
      # roundtrip, docker/docs#23366). Manifest merging was later replaced
      # entirely with `crane index append` (see that step's comment — a
      # separate, confirmed buildx bug dropped attestation siblings
      # outright, not just the convenience map). This walks the raw OCI
      # index manually via `crane manifest` — the SAME tool that built it,
      # not buildx's `imagetools inspect`, which produced an incomplete
      # view of a crane-constructed index even though the underlying
      # registry content was correct (confirmed: this exact "No attestation
      # manifest found" error persisted after switching the merge to crane,
      # until the READ side was also switched to crane here). Never
      # fabricates a predicate; prefers the SLSA v1.0 predicate layer,
      # falling back to v0.2 only if v1 is genuinely absent.
      - name: Extract per-platform SLSA provenance predicates
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          # FIX: a live release run (v1.1.0, publishing 3 targets instead of
          # 2 — 6 concurrent push-by-digest writes to this same repository
          # instead of 4) saw the `frontend` leg fail here with "No
          # attestation manifest found for linux/amd64". Root-caused to two
          # compounding issues, both fixed: (1) `imagetools create` dropping
          # an attestation sibling during merge (switched to `crane index
          # append`), and (2) `imagetools inspect` producing an incomplete
          # read of the resulting crane-built index even after (1) was
          # fixed (switched reads to `crane manifest`). The fetch-and-retry
          # loop that guards against both this and genuine registry
          # propagation delays now lives in scripts/fetch-complete-oci-index.sh
          # (EXTRACTED 2026-08-28 — see that script's header for the full
          # rationale) — this step and "Extract per-platform SPDX SBOM
          # predicates" below both call it rather than duplicating the loop.
          MANIFEST_JSON=$(scripts/fetch-complete-oci-index.sh "${IMG}" "${DIGEST}" \
            "the 'build' job's 'Build container image with SBOM & SLSA Provenance' step")

          for PLATFORM in linux/amd64 linux/arm64; do
            ARCH="${PLATFORM#linux/}"
            FILE="provenance-$(basename "${PLATFORM}").json"
            TYPE_FILE="provenance-type-$(basename "${PLATFORM}").txt"

            # Locate this platform's own image-manifest digest within the merged index.
            IMAGE_DIGEST=$(echo "${MANIFEST_JSON}" | jq -r --arg arch "${ARCH}" \
              '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux") | .digest')

            if [[ -z "${IMAGE_DIGEST}" || "${IMAGE_DIGEST}" == "null" ]]; then
              echo "::error:: No image manifest found for ${PLATFORM} in the merged index ${IMG}@${DIGEST}."
              exit 1
            fi

            # Locate the sibling attestation-manifest that references this platform's image manifest.
            ATTESTATION_DIGEST=$(echo "${MANIFEST_JSON}" | jq -r --arg ref "${IMAGE_DIGEST}" \
              '.manifests[] | select(.annotations."vnd.docker.reference.type" == "attestation-manifest" and .annotations."vnd.docker.reference.digest" == $ref) | .digest')

            if [[ -z "${ATTESTATION_DIGEST}" || "${ATTESTATION_DIGEST}" == "null" ]]; then
              echo "::error:: No attestation manifest found for ${PLATFORM} (image digest ${IMAGE_DIGEST}) on ${IMG}@${DIGEST}."
              echo "::error:: Check the 'build' job's 'Build container image with SBOM & SLSA Provenance' step."
              exit 1
            fi

            ATTESTATION_RAW=$(crane manifest "${IMG}@${ATTESTATION_DIGEST}")

            # Prefer the real SLSA v1.0 in-toto layer; fall back to v0.2 only if BuildKit genuinely didn't emit v1.
            PREDICATE_DIGEST=$(echo "${ATTESTATION_RAW}" | jq -r \
              '.layers[] | select(.annotations."in-toto.io/predicate-type" == "https://slsa.dev/provenance/v1") | .digest')
            PREDICATE_TYPE="slsaprovenance1"

            if [[ -z "${PREDICATE_DIGEST}" || "${PREDICATE_DIGEST}" == "null" ]]; then
              PREDICATE_DIGEST=$(echo "${ATTESTATION_RAW}" | jq -r \
                '.layers[] | select(.annotations."in-toto.io/predicate-type" == "https://slsa.dev/provenance/v0.2") | .digest')
              PREDICATE_TYPE="slsaprovenance"
              if [[ -n "${PREDICATE_DIGEST}" && "${PREDICATE_DIGEST}" != "null" ]]; then
                echo "::warning:: ${PLATFORM}: SLSA v1.0 provenance layer not found; falling back to v0.2."
              fi
            fi

            if [[ -z "${PREDICATE_DIGEST}" || "${PREDICATE_DIGEST}" == "null" ]]; then
              echo "::error:: No SLSA provenance layer (v1.0 or v0.2) found in attestation manifest ${IMG}@${ATTESTATION_DIGEST} for ${PLATFORM}."
              echo "::error:: Check the 'build' job's 'provenance: mode=max,version=v1' setting."
              exit 1
            fi

            # Fetch the real in-toto statement blob and isolate the SLSA predicate object.
            crane blob "${IMG}@${PREDICATE_DIGEST}" | jq '.predicate' > "${FILE}"
            echo "${PREDICATE_TYPE}" > "${TYPE_FILE}"

            if [[ ! -s "${FILE}" ]] || [[ "$(cat "${FILE}")" == "null" ]]; then
              echo "::error:: Fetched in-toto statement for ${PLATFORM} but its .predicate field was empty/null (blob ${PREDICATE_DIGEST})."
              exit 1
            fi
          done
      # Keyless OIDC Cosign Infrastructure
      # Installs Cosign; signs/attests via short-lived GitHub OIDC tokens
      # instead of long-lived static keys.
      #
      # UPGRADED (2026-08-23): cosign-installer v3.8.0 -> v4.1.2, forced by
      # a genuine version-scheme trap: v3.8.0 was the INSTALLER ACTION's own
      # version, not the cosign CLI's — sigstore/cosign-installer's own
      # release notes state "cosign-installer v3.x cannot be used to install
      # Cosign v3.x; you must upgrade to cosign-installer v4 in order to use
      # Cosign v3." This job had been running some cosign v2.x release the
      # whole time. This surfaced because `cosign attest --signing-config`
      # (only available from cosign v2.6.0 on, on-by-default from v3.0 on)
      # returned "unknown flag" on the old pin — that specific flag is no
      # longer used anywhere in this job (see "Attest container image SBOM"
      # below for why), but the underlying version-confusion bug was real
      # regardless, and this upgrade stands on its own merits: correct,
      # current cosign, not tied to any one flag's fate.
      #
      # No `cosign-release:` override: cosign-installer's own README
      # explicitly recommends AGAINST pinning a specific Cosign version
      # unless you have a specific reason to run an older one — one fewer
      # version to independently track. Dependabot's existing
      # `github-actions` ecosystem keeps this action's own SHA (and
      # therefore its bundled Cosign default) current and reviewable, which
      # already matches this project's "explicit, reviewed version bumps"
      # convention without a second manual pin.
      #
      # RESOLVED (2026-08-23): Cosign v3 defaults to storing
      # signatures/attestations as OCI 1.1 Referrers-API artifacts instead
      # of the legacy `sha256-<digest>.sig`/`.att` tag convention this
      # pipeline relied on under v2.x. GHCR's Referrers API support couldn't
      # be confirmed from documentation alone — sources found during this
      # investigation conflicted (some recent reports said GHCR supports
      # read+write of referrers; others as recent as mid-2025 said it did
      # not). Settled empirically instead of by further research: the
      # v1.0.0-rc.2 run signed, attested (signature + SLSA provenance + SPDX
      # SBOM), and then "Verify published image signature & attestations"
      # independently re-verified all three from a cold `cosign
      # verify`/`verify-attestation` — full round trip, real success, not
      # inferred. GHCR's Referrers API support is fine for this pipeline's
      # purposes. Leaving this note in place as the record of how that was
      # actually confirmed, in case it's ever in doubt again after a future
      # cosign or GHCR change.
      - name: Install Cosign CLI tool
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      
      # NEW: make the shared cosign-retry wrapper executable once, here — all three cosign-calling steps below depend on it.
      - name: Make cosign-retry.sh executable
        run: chmod +x scripts/cosign-retry.sh  

      # SIMPLIFIED: retry logic now lives in scripts/cosign-retry.sh, shared with the two attest steps below.
      - name: Sign container image via Keyless OIDC Identity
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          scripts/cosign-retry.sh cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "sha=${{ github.sha }}" \
            "${IMG}@${DIGEST}"
      # Attest container image provenance
      # R5 signs the complete raw SLSA v1 predicate via its exact type URI.
      # Cosign's slsaprovenance1 alias currently runs a typed/protobuf
      # transform (DiscardUnknown=true, invocationID rename), destroying
      # field-for-field comparability with original BuildKit provenance.
      # URI-based custom predicate dispatch retains all fields and still
      # emits standard https://slsa.dev/provenance/v1 for verification.
      # Cosign OIDC identity and index subject remain mandatory.
      # Cosign-signs the two per-platform predicates extracted above (two
      # calls — see "Extract per-platform SLSA provenance predicates").
      # `-a`/`--annotation` is deliberately omitted here (unlike `cosign
      # sign` above): `cosign attest` doesn't accept it — confirmed absent
      # from `cosign attest`'s own flag list on both the old v2.x pin and
      # the current v3.1.x line ("unknown shorthand flag: 'a' in -a", hit
      # on the v1.0.0-rc.2 run that surfaced this investigation) — this is
      # not a version-specific gap. `--type slsaprovenance1`
      # (the v1 predicate shorthand) is deliberate, not cosmetic:
      # scripts/verify-image.sh's `cosign verify-attestation` resolves
      # plain `slsaprovenance` to the DIFFERENT v0.2 URI, so attesting
      # under v1 while verifying under the v0.2 alias would never match.
      # scripts/verify-image.sh has been updated to check
      # `--type slsaprovenance1` to match.
      # This step deliberately stays on cosign's default (TUF-distributed,
      # currently Rekor v1) signing config — it already succeeds; only the
      # SBOM attest step below needs the Rekor v2 override.
      # UPDATED: cosign needs the predicate type this run actually resolved per platform (v1, or the rare v0.2 fallback), read from the sidecar file the extraction step above wrote — no longer hardcoded to slsaprovenance1.
      # SIMPLIFIED: retry logic now lives in scripts/cosign-retry.sh, shared with sign and SBOM attest.
      - name: Attest container image provenance
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          for PLATFORM in linux/amd64 linux/arm64; do
            FILE="provenance-$(basename "${PLATFORM}").json"
            TYPE_FILE="provenance-type-$(basename "${PLATFORM}").txt"
            PREDICATE_TYPE="$(cat "${TYPE_FILE}")"

            # A typed cosign slsaprovenance1 writer converts BuildKit JSON
            # through a protobuf, discarding unknown fields and renaming
            # invocationID. Use the exact SLSA v1 URI to preserve the
            # publisher's full JSON predicate in the signed DSSE payload;
            # Cosign still sets the standard SLSA v1 predicateType URI.
            [[ "${PREDICATE_TYPE}" == "slsaprovenance1" ]] || {
              echo "::error::R5 release requires BuildKit SLSA v1 provenance, not v0.2"; exit 1;
            }
            scripts/cosign-retry.sh cosign attest --yes \
              --type "https://slsa.dev/provenance/v1" \
              --predicate "${FILE}" \
              "${IMG}@${DIGEST}"
          done
      # Extract & Attest SPDX SBOM
      # Same manual-extraction technique as SLSA provenance above — buildx's
      # `.SBOM` map has the identical create+inspect roundtrip gap as
      # `.Provenance` (sigstore/cosign#3030). BuildKit's SBOM layer uses
      # predicate type "https://spdx.dev/Document" exactly, with no
      # version-suffix ambiguity, so an exact match is safe here.
      #
      # FILE-LEVEL TRIM (2026-08-23): the structural-breakdown diagnostic
      # confirmed the ~26.6MB SBOM was 87.3% file-level cataloging (22,588
      # SPDX `files` entries + their ownership `relationships`) and only
      # 12.7% actual packages (2,783, fully declared). Syft has an official
      # setting for exactly this detail-level choice —
      # `file.metadata.selection: none` / env `SYFT_FILE_METADATA_SELECTION`
      # — but BuildKit's native SBOM generator (docker/buildkit-syft-scanner)
      # does not expose Syft config passthrough (confirmed: open upstream
      # issue, docker/buildkit-syft-scanner#130, reporter's own reading of
      # the source says the config is hardcoded; the only scanner build args
      # BuildKit documents are BUILDKIT_SBOM_SCAN_STAGE/_CONTEXT, which
      # control scan SCOPE, not detail level). Reproduced the same effect
      # here as post-processing instead: strips the `files` array and any
      # `relationships` entry that references a file element, leaves
      # `packages` completely untouched — verified below, not assumed.
      # `.comment` is added to the SPDX document itself so any consumer of
      # this attestation sees the omission disclosed in-band, not silently.
      - name: Extract per-platform SPDX SBOM predicates
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          # Same fix as the provenance-extraction step above (see its
          # comment for the full incident writeup) — this step reads the
          # identical merged index and can fail the same way for the same
          # reasons. Shared with that step via
          # scripts/fetch-complete-oci-index.sh rather than duplicating the
          # retry loop a second time (EXTRACTED 2026-08-28).
          MANIFEST_JSON=$(scripts/fetch-complete-oci-index.sh "${IMG}" "${DIGEST}" \
            "the 'build' job's SBOM generation")

          for PLATFORM in linux/amd64 linux/arm64; do
            ARCH="${PLATFORM#linux/}"
            FILE="sbom-$(basename "${PLATFORM}").json"
            RAW_FILE="sbom-$(basename "${PLATFORM}")-raw.json"

            IMAGE_DIGEST=$(echo "${MANIFEST_JSON}" | jq -r --arg arch "${ARCH}" \
              '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux") | .digest')

            if [[ -z "${IMAGE_DIGEST}" || "${IMAGE_DIGEST}" == "null" ]]; then
              echo "::error:: No image manifest found for ${PLATFORM} in the merged index ${IMG}@${DIGEST}."
              exit 1
            fi

            ATTESTATION_DIGEST=$(echo "${MANIFEST_JSON}" | jq -r --arg ref "${IMAGE_DIGEST}" \
              '.manifests[] | select(.annotations."vnd.docker.reference.type" == "attestation-manifest" and .annotations."vnd.docker.reference.digest" == $ref) | .digest')

            if [[ -z "${ATTESTATION_DIGEST}" || "${ATTESTATION_DIGEST}" == "null" ]]; then
              echo "::error:: No attestation manifest found for ${PLATFORM} (image digest ${IMAGE_DIGEST}) on ${IMG}@${DIGEST}."
              exit 1
            fi

            ATTESTATION_RAW=$(crane manifest "${IMG}@${ATTESTATION_DIGEST}")

            PREDICATE_DIGEST=$(echo "${ATTESTATION_RAW}" | jq -r \
              '.layers[] | select(.annotations."in-toto.io/predicate-type" == "https://spdx.dev/Document") | .digest')

            if [[ -z "${PREDICATE_DIGEST}" || "${PREDICATE_DIGEST}" == "null" ]]; then
              echo "::error:: No SPDX SBOM layer found in attestation manifest ${IMG}@${ATTESTATION_DIGEST} for ${PLATFORM}."
              echo "::error:: Check the 'build' job's 'sbom: true' setting."
              exit 1
            fi

            crane blob "${IMG}@${PREDICATE_DIGEST}" | jq '.predicate' > "${RAW_FILE}"

            if [[ ! -s "${RAW_FILE}" ]] || [[ "$(cat "${RAW_FILE}")" == "null" ]]; then
              echo "::error:: Fetched in-toto statement for ${PLATFORM} but its .predicate field was empty/null (blob ${PREDICATE_DIGEST})."
              exit 1
            fi

            RAW_PACKAGE_COUNT=$(jq '(.packages // []) | length' "${RAW_FILE}")

            # Strip file-level entries + their ownership relationships only.
            # Builds a hash-set of file SPDXIDs first (single pass) so the
            # relationship filter is O(1) per lookup rather than an
            # index()-per-relationship scan against 20k+ file IDs.
            jq '
              (reduce (.files // [])[] as $f ({}; .[$f.SPDXID] = true)) as $file_set
              | del(.files)
              | .relationships = ((.relationships // []) | map(select(
                  ($file_set[.spdxElementId] // false) == false and
                  ($file_set[.relatedSpdxElement] // false) == false
                )))
              | .comment = "File-level cataloging (SPDX '\''files'\'' array and per-file ownership relationships) intentionally omitted from this attestation to keep the predicate within Sigstore Rekor'\''s practical size limits. Every package below remains fully declared with complete purl/version/license metadata — nothing was removed from the package list, only the per-file evidence layer beneath it. Re-scan the published image directly with Syft (file.metadata.selection: all) for file-level detail."
            ' "${RAW_FILE}" > "${FILE}"

            TRIMMED_PACKAGE_COUNT=$(jq '(.packages // []) | length' "${FILE}")

            # Hard guarantee, not an assumption: the trim above must never
            # touch .packages. If these counts ever diverge, something is
            # structurally wrong with the jq above — fail loudly rather than
            # attest a predicate that may have silently lost package data.
            if [[ "${RAW_PACKAGE_COUNT}" != "${TRIMMED_PACKAGE_COUNT}" ]]; then
              echo "::error:: Package count changed during file-level trim for ${PLATFORM}: ${RAW_PACKAGE_COUNT} -> ${TRIMMED_PACKAGE_COUNT}. This should be structurally impossible. Refusing to attest — investigate the trim jq in this step before re-running."
              exit 1
            fi

            RAW_BYTES=$(wc -c < "${RAW_FILE}")
            TRIMMED_BYTES=$(wc -c < "${FILE}")
            echo "::notice:: ${PLATFORM}: SBOM trimmed ${RAW_BYTES} -> ${TRIMMED_BYTES} bytes (${RAW_PACKAGE_COUNT} packages, unchanged)."

            rm -f "${RAW_FILE}"
          done

      # ------------------------------------------------------------------------
      # DIAGNOSTIC (kept permanently as a release-time sanity check, not just
      # for this investigation): reports the size of whatever sbom-*.json and
      # provenance-*.json ended up on disk. As of the 2026-08-23 file-level
      # trim in "Extract per-platform SPDX SBOM predicates" above, that means
      # the ALREADY-TRIMMED SBOM (originally ~26.6MB/~26.7MB before the trim,
      # ~120x provenance's ~223KB — see that step's comment for the full
      # root-cause analysis of why the untrimmed size broke Rekor v1). This
      # table is what tells us, on every future run, whether the trimmed size
      # still stays comfortably clear of size trouble — not a one-time check.
      # ------------------------------------------------------------------------
      - name: "DIAGNOSTIC: report SBOM/provenance predicate sizes vs. Rekor's 100KB limit"
        run: |
          set -euo pipefail
          REKOR_V1_LIMIT_BYTES=102400  # 100KB — Rekor's documented public-instance attestation upload limit (empirically, the real ceiling for our failure sits somewhere between this and 26MB — see thread history for full analysis)

          {
            echo "### 🔍 DIAGNOSTIC — predicate payload sizes vs. Rekor's 100KB public-instance limit"
            echo ""
            echo "| File | Bytes | KB | Over 100KB limit? |"
            echo "|---|---|---|---|"
            for FILE in provenance-amd64.json provenance-arm64.json sbom-amd64.json sbom-arm64.json; do
              if [[ -f "${FILE}" ]]; then
                BYTES=$(wc -c < "${FILE}")
                KB=$(( BYTES / 1024 ))
                if (( BYTES > REKOR_V1_LIMIT_BYTES )); then
                  FLAG="⚠️ **YES**"
                else
                  FLAG="no"
                fi
                echo "| \`${FILE}\` | ${BYTES} | ${KB} | ${FLAG} |"
              else
                echo "| \`${FILE}\` | _not found_ | — | — |"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------------
      # DIAGNOSTIC: SBOM structural breakdown (2026-08-23)
      # ------------------------------------------------------------------------
      # Originally written to answer "what's consuming the ~26MB" before any
      # trim existed — that investigation found 87.3% of the file was SPDX
      # `files` entries + ownership `relationships`, only 12.7% actual
      # packages, which directly led to the file-level trim now applied in
      # "Extract per-platform SPDX SBOM predicates" above. Kept running here
      # as a confirmation check, not just a historical artifact: this table
      # should now show `files: 0` and the same package count/ecosystem
      # breakdown as before the trim — if either one looks wrong on a given
      # run (files > 0, or an ecosystem's package count changed), that's a
      # sign the trim step's guard rail didn't catch something and needs
      # attention before trusting this run's attestation.
      # Only sbom-amd64.json is analyzed — arm64's composition should mirror
      # it closely (same Dockerfile, same package set); re-run this step
      # against sbom-arm64.json by hand if amd64's breakdown looks
      # architecture-specific in a way that's surprising.
      - name: "DIAGNOSTIC: SBOM structural breakdown by ecosystem"
        run: |
          set -euo pipefail
          FILE="sbom-amd64.json"

          if [[ ! -f "${FILE}" ]]; then
            echo "::warning:: ${FILE} not found — skipping structural breakdown."
            exit 0
          fi

          TOTAL_PACKAGES=$(jq '(.packages // []) | length' "${FILE}")
          TOTAL_FILES=$(jq '(.files // []) | length' "${FILE}")
          TOTAL_RELATIONSHIPS=$(jq '(.relationships // []) | length' "${FILE}")

          # Per-package: [purl ecosystem scheme, serialized byte length of that package object].
          # "unknown" catches packages with no purl externalRef at all.
          jq -r '
            .packages[]? as $p
            | ( ($p.externalRefs // [])
                | map(select(.referenceType == "purl"))
                | (.[0].referenceLocator // "unknown")
              ) as $purl
            | ( if $purl == "unknown" then "unknown"
                else ($purl | capture("^pkg:(?<s>[^/]+)/").s? // "unknown")
                end
              ) as $scheme
            | [$scheme, ($p | tostring | length)] | @tsv
          ' "${FILE}" > /tmp/pkg-by-scheme.tsv

          # Aggregate: count + total bytes per ecosystem, sorted by bytes desc.
          BY_SCHEME=$(awk -F'\t' '
            { count[$1]++; bytes[$1]+=$2 }
            END { for (s in count) printf "%s\t%d\t%d\n", s, count[s], bytes[s] }
          ' /tmp/pkg-by-scheme.tsv | sort -t $'\t' -k3 -rn)

          # Individually largest package entries (catches outliers — e.g. one
          # entry with an unusually large embedded license/copyright blob —
          # separately from "which ecosystem has the most packages").
          # NOTE: `sort -rn | { head -15; cat >/dev/null; }` — not just `| head -15`.
          # Under `set -o pipefail`, `head` closing the pipe after its 15 lines
          # sends SIGPIPE to `sort` while it's still writing the remaining
          # (unwanted) output, which makes `sort` exit non-zero and kills this
          # whole step via `set -e` — confirmed live in this project's own CI
          # (2026-08-23: "sort: write failed: 'standard output': Broken pipe",
          # exit code 2). Draining the rest into /dev/null after `head` is done
          # lets `sort` finish writing to a live reader every time.
          TOP_PACKAGES=$(jq -r '
            .packages[]?
            | [ (. | tostring | length), .name, (.versionInfo // "?") ] | @tsv
          ' "${FILE}" | sort -rn | { head -15; cat >/dev/null; })

          {
            echo "### 🔍 DIAGNOSTIC — SBOM structural breakdown (${FILE})"
            echo ""
            echo "**Totals:** ${TOTAL_PACKAGES} packages, ${TOTAL_FILES} file entries, ${TOTAL_RELATIONSHIPS} relationships"
            echo ""
            echo "#### By ecosystem (purl scheme)"
            echo ""
            echo "| Ecosystem | Package count | Total bytes | Avg bytes/pkg |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r scheme count bytes; do
              [[ -z "${scheme}" ]] && continue
              avg=$(( bytes / count ))
              echo "| \`${scheme}\` | ${count} | ${bytes} | ${avg} |"
            done <<< "${BY_SCHEME}"
            echo ""
            echo "#### 15 largest individual package entries"
            echo ""
            echo "| Bytes | Name | Version |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r bytes name version; do
              [[ -z "${bytes}" ]] && continue
              echo "| ${bytes} | \`${name}\` | \`${version}\` |"
            done <<< "${TOP_PACKAGES}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Attest the two per-platform SPDX SBOMs extracted above, mirroring the provenance-attest step (cosign appends, so both attestations coexist on the same digest).
      # SIMPLIFIED: retry logic lives in scripts/cosign-retry.sh, shared with sign and provenance attest.
      #
      # REVERTED TO PLAIN REKOR V1 (2026-08-23): this step briefly used
      # `--signing-config` to route around Rekor v1's practical size ceiling
      # via an early-adopter Rekor v2 instance (log2025-1.rekor.sigstore.dev).
      # That path is now removed, not just unused — full history below for
      # whoever needs it next time a large-attestation problem shows up here:
      #
      #   1. Root cause: the untrimmed SBOM predicate ran ~26MB (~120x
      #      provenance's ~223KB), and Rekor v1 requires uploading the ENTIRE
      #      DSSE-wrapped payload (sigstore/cosign#3599) — a payload that
      #      size got rejected outright, deterministically, every run.
      #   2. Rather than route around the limit, "Extract per-platform SPDX
      #      SBOM predicates" above now trims the predicate at the source:
      #      strips SPDX file-level cataloging (87.3% of the original size —
      #      22,588 `files` entries + their ownership relationships) while
      #      leaving every one of the 2,783 real packages fully declared.
      #      See that step's comment for why this is a legitimate detail-level
      #      choice (Syft's own `file.metadata.selection: none`), not data
      #      loss.
      #   3. That alone brought the predicate down enough to attest cleanly
      #      against plain Rekor v1 — confirmed via a real run, not assumed —
      #      so the Rekor v2 SigningConfig detour (the "Build Rekor v2
      #      signing config for SBOM attestation" step that used to sit
      #      here) is no longer needed and has been deleted.
      #
      # If a future SBOM genuinely needs to be this large again (a real
      # change in what's shipped, not just verbosity), the Rekor v2 approach
      # is still valid and fully documented in this file's git history —
      # search for "log2025-1.rekor.sigstore.dev" in a prior commit rather
      # than re-deriving it from scratch.
      - name: Attest container image SBOM
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}"

          for PLATFORM in linux/amd64 linux/arm64; do
            FILE="sbom-$(basename "${PLATFORM}").json"

            scripts/cosign-retry.sh cosign attest --yes \
              --type spdxjson \
              --predicate "${FILE}" \
              "${IMG}@${DIGEST}"
          done
      # Post-Publish Verification
      # scripts/verify-image.sh re-implements, from the outside, exactly
      # what a downstream consumer would run to trust this image: keyless
      # signature, SLSA provenance, and SPDX SBOM checks. Runs BEFORE
      # "Create GitHub Release" deliberately — a failure here must block
      # the Release, since there's no point publishing notes for an image
      # that just failed its own trust check. Verified by DIGEST
      # (steps.create-manifest.outputs.digest), not by tag: a tag is a
      # mutable pointer that could move between the sign step and this
      # check; the digest cannot.
      # NOTE (2026-08-23): this step is the practical test of the "Install
      # Cosign CLI tool" step's known open risk (GHCR OCI 1.1 Referrers API
      # support) — see that step's comment. If this fails with something
      # that reads like "no matching signatures/attestations found" rather
      # than a cryptographic/identity mismatch, start there.
      - name: Make verify-image.sh executable
        run: chmod +x scripts/verify-image.sh

      - name: Verify published image signature & attestations
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          scripts/verify-image.sh "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" "${GITHUB_REF_NAME}"
      - name: Verify both signed architecture-specific SLSA and SPDX payloads
        env:
          DIGEST: ${{ steps.create-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          img="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
            --output json "$img" > "$RUNNER_TEMP/verified-provenance.json"
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
            --output json "$img" > "$RUNNER_TEMP/verified-sbom.json"
          python3 scripts/verify_signed_release_predicates.py \
            --provenance-amd64 provenance-amd64.json \
            --provenance-arm64 provenance-arm64.json \
            --sbom-amd64 sbom-amd64.json \
            --sbom-arm64 sbom-arm64.json \
            --verified-provenance "$RUNNER_TEMP/verified-provenance.json" \
            --verified-sbom "$RUNNER_TEMP/verified-sbom.json" \
            --expected-subject "$DIGEST" \
            --evidence "$RUNNER_TEMP/signed-predicate-evidence.json"

      - name: Retain independent signed-predicate content evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-predicates-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/signed-predicate-evidence.json
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------------
      # Export this target's published info for the `release` job
      # ------------------------------------------------------------------------
      # GitHub Release creation was REMOVED from this job (TIER 2 — see the
      # job-level comment above for why: parallel matrix legs racing to
      # create/publish the same release is a real correctness bug). Each
      # leg instead writes its own primary tag + digest to a small file,
      # uploaded as its own artifact, which the `release` job downloads
      # from every leg to build ONE combined release afterward. Job
      # `outputs:` were deliberately not used here — this file already
      # relies on the artifact-file pattern (not matrix outputs) for
      # exactly this "combine results from parallel legs" problem, see the
      # `build` job's digest-export comment for the same reasoning.
      - name: Export published info for release job
        env:
          FIRST_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/published-info"
          cat > "${{ runner.temp }}/published-info/${{ matrix.target }}.json" <<JSON
          {
            "target": "${{ matrix.target }}",
            "tag": "${FIRST_TAG}",
            "digest": "${{ steps.create-manifest.outputs.digest }}"
          }
          JSON

      - name: Upload published info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-info-${{ matrix.target }}
          path: ${{ runner.temp }}/published-info/*.json
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------------
      # Step Summary Output (per-target — the release job's summary covers
      # the combined release; this one is this matrix leg's own record)
      # ------------------------------------------------------------------------
      - name: Output Workflow Step Summary
        run: |
          {
            echo "## BAOBAB Dev Container Candidate Signed / Awaiting Protected Promotion (${{ matrix.target }})"
            echo ""
            echo "**OCI Image Reference:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "**Index Manifest Digest:** \`${{ steps.create-manifest.outputs.digest }}\`"
            echo ""
            echo "### Security & Hygiene Controls Applied"
            echo "- ✅ **Pinned GitHub Actions:** Immutable 40-character commit SHAs"
            echo "- ✅ **Concurrency Control:** Auto-cancels obsolete build runs on PRs"
            echo "- ✅ **Exact remote digest Trivy:** Both architectures scanned; release publication requires CLEAN results. Development-only risk acceptance never authorizes release publication or promotion."
            echo "- ✅ **SBOM & SLSA Attestations:** Embedded directly into OCI index"
            echo "- ✅ **Keyless Cosign Signature:** Signed via GitHub Actions OIDC identity"
            echo "- ✅ **Post-Publish Verification:** Signature and attestations independently re-verified against the published digest (scripts/verify-image.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

  # R5: release version tags never move until ALL four candidate manifests
  # are signed, both architectures checked and all exact-digest scans pass.
  # GHCR tag mutation is not atomic; script journals partial failure and
  # restores prior mutable aliases, but new version tags may need review.
  # Independent GitHub Environment policy must be configured by the owner.
  promote:
    name: Protected GHCR tag promotion with recovery evidence
    needs: [publish, ga-reuse, sanity-check]
    if: always() && !cancelled() && github.run_attempt == 1 && needs.sanity-check.outputs.is_release == 'true' && ((needs.sanity-check.outputs.publication_channel == 'ga' && needs.ga-reuse.result == 'success') || (needs.sanity-check.outputs.publication_channel != 'ga' && needs.publish.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: dev10-registry-tag-promotion
      queue: max
    environment:
      name: dev10-release-promotion
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: read
    steps:
      - name: Refuse promotion until independently protected environment is configured
        env:
          POLICY_READY: ${{ vars.DEV10_R5_PROMOTION_APPROVED }}
        run: |
          set -euo pipefail
          [[ "$POLICY_READY" == 'true' ]] || {
            echo '::error::DEV-10 R5 promotion policy not configured. The dev10-release-promotion environment must have independent reviewers/tag restrictions and DEV10_R5_PROMOTION_APPROVED=true.';
            exit 1;
          }
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck tag and branch governance after the deployment approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/verify_remote_release_tag.py --tag "$RELEASE_TAG" --sha "$GITHUB_SHA"
          python3 scripts/verify_release_governance.py

      - name: Verify actual independent GitHub Environment approval policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/dev10-release-promotion" > "$RUNNER_TEMP/promotion-environment.json"
          gh api "repos/${GITHUB_REPOSITORY}/environments/dev10-release-promotion/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/promotion-deployment-policies.json"
          python3 scripts/verify_release_environment.py \
            --environment "$RUNNER_TEMP/promotion-environment.json" \
            --policies "$RUNNER_TEMP/promotion-deployment-policies.json" \
            --tag "$RELEASE_TAG" > "$RUNNER_TEMP/verified-release-environment.json"

      - name: Capture independent deployment approval evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
          ORIGINAL_ACTOR_LOGIN: ${{ github.actor }}
          ORIGINAL_ACTOR_ID: ${{ github.actor_id }}
          SOURCE_CONTRIBUTORS: ${{ needs.sanity-check.outputs.contributor_ids }}
        run: |
          set -euo pipefail
          python3 scripts/verify_promotion_approval.py \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" --actor "$ORIGINAL_ACTOR_LOGIN" \
            --actor-id "$ORIGINAL_ACTOR_ID" --tag "$RELEASE_TAG" \
            --environment-evidence "$RUNNER_TEMP/verified-release-environment.json" --contributors "$SOURCE_CONTRIBUTORS" \
            --output "$RUNNER_TEMP/r5-promotion-evidence/approval.json"

      - name: Verify Actions candidate artifact containers before download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.sanity-check.outputs.publication_channel }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/artifact-pages.json"
          python3 scripts/verify_actions_artifact_containers.py \
            --input "$RUNNER_TEMP/artifact-pages.json" --channel "$CHANNEL" \
            --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
      - name: Download candidate records for release channel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/published-info
          pattern: ${{ needs.sanity-check.outputs.publication_channel == 'ga' && 'ga-reused-candidates' || 'published-info-*' }}
          merge-multiple: true
      - name: Enforce producer-consumer candidate artifact contract
        env:
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
          CHANNEL: ${{ needs.sanity-check.outputs.publication_channel }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_artifact_contract.py \
            --directory "$RUNNER_TEMP/published-info" \
            --tag "$RELEASE_TAG" --channel "$CHANNEL"
      - name: Independently verify GA continuity against qualified RC records
        if: needs.sanity-check.outputs.publication_channel == 'ga'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.sanity-check.outputs.release_tag }}
          RC_RUN: ${{ needs.ga-reuse.outputs.rc_run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualified-rc-records"
          [[ "$RC_RUN" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Could not resolve a qualified same-commit RC run"; exit 1;
          }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RC_RUN}" > "$RUNNER_TEMP/qualified-rc-run.json"
          for target in final frontend frontend-e2e infra; do
            gh run download "$RC_RUN" --repo "$GITHUB_REPOSITORY" --name "published-info-$target" --dir "$RUNNER_TEMP/qualified-rc-records"
          done
          python3 scripts/verify_rc_ga_workflow.py \
            --rc-run "$RUNNER_TEMP/qualified-rc-run.json" \
            --rc-records "$RUNNER_TEMP/qualified-rc-records" \
            --ga-records "$RUNNER_TEMP/published-info" \
            --ga-tag "$TAG" --ga-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/r5-promotion-evidence/rc-ga-continuity.json"

      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane CLI tool
        env:
          CRANE_VERSION: "0.21.9"
          CRANE_SHA256: "5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e"
        run: |
          set -euo pipefail
          ASSET="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL -o "${ASSET}" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/${ASSET}"
          echo "${CRANE_SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" crane
          chmod +x crane
          sudo mv crane /usr/local/bin/crane
          crane version

      # Protected promotion independently verifies the signed OCI digests.
      # Build/publish jobs install Cosign in their own runners; promotion is a
      # separate runner and must provision the verifier explicitly as well.
      - name: Install Cosign CLI for independent promotion verification
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Independently provision pinned Trivy for digest-specific security decisions
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$asset"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" trivy
          sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          trivy --version

      - name: Verify all candidate records, signatures and expected release labels
        env:
          CHANNEL: ${{ needs.sanity-check.outputs.publication_channel }}
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
        run: |
          set -euo pipefail
          info="${RUNNER_TEMP}/published-info"
          image="${REGISTRY}/${IMAGE_NAME}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || { echo '::error::Only strict GA or numbered RC semver can be promoted'; exit 1; }
          python3 scripts/release_tag_policy.py --tag "$RELEASE_TAG" >/dev/null
          evidence="$RUNNER_TEMP/r5-promotion-evidence"
          mkdir -p "$evidence/security" "$evidence/registry"
          version="${RELEASE_TAG#v}"
          count=$(find "$info" -maxdepth 1 -type f -name '*.json' | wc -l)
          [[ "$count" -eq 4 ]] || { echo "::error::Expected exactly four candidate files; found $count"; exit 1; }
          for target in final frontend frontend-e2e infra; do
            file="$info/$target.json"
            [[ -f "$file" ]] || { echo "::error::Missing $target candidate"; exit 1; }
            expected_suffix=""
            [[ "$target" == final ]] || expected_suffix="-$target"
            expected_tag="$image:$version$expected_suffix"
            observed=$(jq -er '.target' "$file")
            tag=$(jq -er '.tag' "$file")
            digest=$(jq -er '.digest' "$file")
            [[ "$observed" == "$target" && "$tag" == "$expected_tag" && "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "::error::Mismatched candidate record for $target"; exit 1;
            }
            verification_tag="$RELEASE_TAG"
            if [[ "$CHANNEL" == ga ]]; then
              verification_tag=$(jq -er '.head_branch' "$RUNNER_TEMP/qualified-rc-run.json")
            fi
            # Resolve the immutable OCI object independently from GHCR.
            # The record is not proof that the referenced digest exists.
            # Pull the registry index using a verifier installed on this
            # separate protected runner; never trust build-job platform claims.
            crane manifest "$image@$digest" > "$RUNNER_TEMP/verified-$target-index.json"
            python3 scripts/verify_independent_oci_index.py \
              --input "$RUNNER_TEMP/verified-$target-index.json"
            resolved_digest=$(crane digest "$image@$digest")
            [[ "$resolved_digest" == "$digest" ]] || {
              echo "::error::Registry digest identity mismatch for $target"; exit 1;
            }
            # Development risk acceptance is never release authority.
            # No release-specific decision schema, custody verifier or separate
            # trust anchor is provisioned yet. Therefore any residual HIGH or
            # CRITICAL finding fails closed; do not reuse the development SHA.
            # The scan must identify the immutable GHCR digest and architecture.
            for architecture in linux/amd64 linux/arm64; do
              child=$(jq -r --arg arch "${architecture#linux/}" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' "$RUNNER_TEMP/verified-$target-index.json")
              [[ "$child" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Missing exact architecture child digest"; exit 2; }
              trivy image --image-src remote --platform "$architecture" \
                --scanners vuln,secret --pkg-types os,library \
                --severity HIGH,CRITICAL --ignorefile /dev/null --format json \
                --output "$RUNNER_TEMP/security-$target-${architecture#linux/}.json" "$image@$child"
              python3 scripts/verify_digest_security_decision.py \
                --report "$RUNNER_TEMP/security-$target-${architecture#linux/}.json" \
                --target "$target" --digest "$child" --release-tag "$RELEASE_TAG" \
                --image-repository "$image" --architecture "$architecture" \
                --scanner-version "$(trivy --version | sed -n 's/^Version: //p' | head -1)" \
                > "$evidence/security/$target-${architecture#linux/}.json"
            done
            python3 scripts/verify_registry_arch_attestations.py --image "$image@$digest" \
              --tag "$RELEASE_TAG" --signer-tag "$verification_tag" --expected-sha "$GITHUB_SHA" \
              --evidence "$evidence/registry/$target.json"
            echo "::notice::Promotion precheck: $target digest $digest verified"
          done

      - name: Promote verified stable tags before mutable aliases, with recovery evidence
        env:
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          INFO_DIR: ${{ runner.temp }}/published-info
          PROMOTION_EVIDENCE_DIR: ${{ runner.temp }}/r5-promotion-evidence
        run: |
          set -euo pipefail
          bash scripts/promote_release_tags.sh

      - name: Assemble the release manifest from independent digest readback
        env:
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
          CHANNEL: ${{ needs.sanity-check.outputs.publication_channel }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/r5-promotion-evidence"
          python3 scripts/assemble_release_evidence.py --tag "$RELEASE_TAG" --channel "$CHANNEL" \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --evidence "$evidence" \
            --candidates "$RUNNER_TEMP/published-info"
          cp "$evidence/release-evidence.json" "$RUNNER_TEMP/release-evidence.json"

      - name: Retain the verified release evidence manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-evidence
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve promotion journal including partial-failure diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev10-r5-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r5-promotion-evidence/
          if-no-files-found: warn
          retention-days: 30

  # Job 5: Combined GitHub Release; only after protected promotion succeeds.
  # Job 4: Combined GitHub Release
  # Runs once, after every `publish` matrix leg has finished — creates ONE
  # release for the tag, listing pull + verification commands for every
  # target that was published this run (final, frontend, frontend-e2e as
  # of this pass). Reads whatever published-info-* artifacts exist — no
  # hardcoded target list, so a future fourth target needs no change here.
  release:
    name: Create Combined GitHub Release
    needs: [promote, sanity-check, ga-reuse]
    if: always() && !cancelled() && github.run_attempt == 1 && needs.sanity-check.outputs.is_release == 'true' && needs.promote.result == 'success'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # contents: write — create the GitHub Release. This is the only job
    # that needs it now; `publish`'s matrix legs no longer touch releases.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # RC builds publish published-info-* records; GA reuses the exact
      # qualified RC digests in ga-reused-candidates. Both channels must
      # render release notes from the records actually promoted.
      - name: Verify Actions candidate artifact containers before download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.sanity-check.outputs.publication_channel }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/artifact-pages.json"
          python3 scripts/verify_actions_artifact_containers.py \
            --input "$RUNNER_TEMP/artifact-pages.json" --channel "$CHANNEL" \
            --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
      - name: Download channel candidate records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/published-info
          pattern: ${{ needs.sanity-check.outputs.publication_channel == 'ga' && 'ga-reused-candidates' || 'published-info-*' }}
          merge-multiple: true

      - name: Enforce release metadata artifact contract
        env:
          RELEASE_TAG: ${{ needs.sanity-check.outputs.release_tag }}
          CHANNEL: ${{ needs.sanity-check.outputs.publication_channel }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_artifact_contract.py \
            --directory "$RUNNER_TEMP/published-info" \
            --tag "$RELEASE_TAG" --channel "$CHANNEL"

      # Builds the release body from whatever published-info JSON files are
      # actually present — genuinely no hardcoded target list, so this
      # doesn't need editing when a future target joins. `final` renders
      # first if present (its pull command has no suffix, matching the
      # primary/default image), everything else in whatever order `find`
      # returns.
      - name: Build combined release body
        id: release-body
        run: |
          set -euo pipefail
          BODY_FILE="${{ runner.temp }}/release-body.md"
          INFO_DIR="${{ runner.temp }}/published-info"

          # Do not publish a release body with missing, partial or
          # unexpected channel records (or a literal unmatched glob).
          for target in final frontend frontend-e2e infra; do
            [[ -s "${INFO_DIR}/${target}.json" ]] || {
              echo "::error::Missing candidate record: ${target}.json" >&2
              exit 1
            }
            jq -e --arg target "$target" \
              '.target == $target and (.tag | type == "string" and length > 0) and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))' \
              "${INFO_DIR}/${target}.json" >/dev/null || {
              echo "::error::Invalid candidate record: ${target}.json" >&2
              exit 1
            }
          done
          shopt -s nullglob
          candidate_files=("${INFO_DIR}"/*.json)
          [[ "${#candidate_files[@]}" -eq 4 ]] || {
            echo "::error::Expected exactly four channel candidate records" >&2
            exit 1
          }

          ordered_files=()
          [[ -f "${INFO_DIR}/final.json" ]] && ordered_files+=("${INFO_DIR}/final.json")
          for f in "${INFO_DIR}"/*.json; do
            [[ "$f" == "${INFO_DIR}/final.json" ]] && continue
            ordered_files+=("$f")
          done

          RELEASE_TAG="${{ needs.sanity-check.outputs.release_tag }}"
          {
            # Render the disclosure from the same exact allow-list enforced by
            # dev10_kernel_risk_gate.py. A syntactically valid future release
            # must not inherit an older version's security exception.
            if python3 - "${RELEASE_TAG}" <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from dev10_kernel_risk_gate import is_historical_development_risk_disclosure_ref
          raise SystemExit(0 if is_historical_development_risk_disclosure_ref(sys.argv[1]) else 1)
          PY
            then
              echo "### Baobab development environment — ${RELEASE_TAG}"
              echo ""
              echo "**Intended use:** Organisation development environments, GitHub Codespaces and disposable local developer toolchains only. This is NOT an application staging/production deployment image."
              if [[ "${{ needs.sanity-check.outputs.is_stable_release }}" != "true" ]]; then
                echo "**Release candidate:** This is an RC rehearsal. Four versioned RC tags are published and verified; major/minor/latest aliases stay on the current GA."
              else
                echo "**General availability:** This is the approved development image. Versioned tags and latest/major/minor aliases are promoted together after all checks."
                echo "**Consumer upgrade:** Owners of Nabhold, ZuriBeans, Thamani, CP, IAM and other Baobab development estates should update their devcontainer image pin to the verified ${RELEASE_TAG} digest, rebuild and rerun their consumer tests."
              fi
              echo ""
              echo "**Time-bounded security disclosure:** Native AMD64 and ARM64 image profiles were independently scanned with unfiltered Trivy; the explicitly scoped, inventory-pinned linux-libc-dev development-only CVE treatment under [issue #54](https://github.com/baobab-platform/baobab-dev/issues/54) may apply. The original 295 advisories (12 CRITICAL, 283 HIGH) remain tracked as unremediated/under investigation, **not declared harmless**. Review exact architecture scan artifacts and the recorded risk decision."
              echo ""
              echo "**Review deadline:** 2026-11-26 00:00 UTC. Continued organisational consumption beyond the deadline needs remediation or re-review; the tag will not automatically disappear when the exception expires."
              echo ""
              echo "**Verification:** Compare pinned image digests, Cosign signature, SLSA/SPDX attestations and native source revision with the release contract. Do not generalise this acceptance to another tag, workload or organisation."
              echo ""
            fi
            echo "### Container Pull Directives"
            echo ""

            for f in "${ordered_files[@]}"; do
              target=$(jq -r '.target' "$f")
              tag=$(jq -r '.tag' "$f")
              digest=$(jq -r '.digest' "$f")
              signer_tag=$(jq -r '.signer_tag // empty' "$f")
              signer_run_id=$(jq -r '.signer_run_id // empty' "$f")
              [[ -n "$signer_tag" ]] || signer_tag="${{ needs.sanity-check.outputs.release_tag }}"

              echo "**${target}:**"
              echo "Signature source: \`${signer_tag}\`"
              if [[ -n "$signer_run_id" ]]; then
                echo "Qualified RC workflow run: [${signer_run_id}](https://github.com/${{ github.repository }}/actions/runs/${signer_run_id})"
              fi
              echo '```bash'
              echo "docker pull ${tag}"
              echo '```'
              echo ""
              echo "Verify (digest \`${digest}\`):"
              echo '```bash'
              echo "cosign verify \\"
              echo "  --certificate-identity \"https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/tags/${signer_tag}\" \\"
              echo "  --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" \\"
              echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}"
              echo ""
              echo "cosign verify-attestation \\"
              echo "  --type slsaprovenance1 \\"
              echo "  --certificate-identity \"https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/tags/${signer_tag}\" \\"
              echo "  --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" \\"
              echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}"
              echo '```'
              echo ""
            done
          } > "${BODY_FILE}"

          echo "path=${BODY_FILE}" >> "$GITHUB_OUTPUT"

      # Same immutable-releases sequencing as before (create as draft, then
      # publish) — see the prior single-job version's comment for the full
      # "Cannot upload assets to an immutable release" background; that
      # constraint is unchanged by this job split.
      - name: Download verified release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-evidence
          path: ${{ runner.temp }}/release-evidence

      - name: Create GitHub Release (draft)
        id: create-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.sanity-check.outputs.release_tag }}
          draft: true
          prerelease: ${{ needs.sanity-check.outputs.is_stable_release != 'true' }}
          files: |
            config/versions.lock
            ${{ runner.temp }}/release-evidence/release-evidence.json
          generate_release_notes: true
          body_path: ${{ steps.release-body.outputs.path }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.sanity-check.outputs.release_tag }}" --draft=false --repo "${{ github.repository }}"
